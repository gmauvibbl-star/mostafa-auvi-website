<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Journal</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7f9fa;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 10px;
        }
        .entry-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd1d9;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        textarea {
            height: 150px;
            resize: vertical;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
            align-self: flex-start;
        }
        button:hover {
            background-color: #2980b9;
        }
        .entries-list {
            margin-top: 20px;
        }
        .journal-entry {
            background: #fdfdfd;
            border: 1px solid #e2e8f0;
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 15px;
            position: relative;
        }
        .entry-title {
            font-size: 20px;
            font-weight: bold;
            color: #2c3e50;
            margin: 0 0 5px 0;
        }
        .entry-date {
            font-size: 13px;
            color: #7f8c8d;
            margin-bottom: 15px;
        }
        .entry-body {
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .delete-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: #e74c3c;
            padding: 6px 10px;
            font-size: 12px;
        }
        .delete-btn:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>My Personal Journal</h1>
    
    <div class="entry-form">
        <input type="text" id="entryTitle" placeholder="Entry Title...">
        <textarea id="entryBody" placeholder="Write your thoughts here..."></textarea>
        <button onclick="addEntry()">Save Entry</button>
    </div>

    <h2>Past Entries</h2>
    <div id="entriesList" class="entries-list"></div>
</div>

<script>
    // Load entries on page load
    document.addEventListener('DOMContentLoaded', displayEntries);

    function addEntry() {
        const titleInput = document.getElementById('entryTitle');
        const bodyInput = document.getElementById('entryBody');
        
        if (!titleInput.value.trim() || !bodyInput.value.trim()) {
            alert('Please fill out both the title and the body.');
            return;
        }

        const entries = JSON.parse(localStorage.getItem('journalEntries')) || [];
        
        const newEntry = {
            id: Date.now(),
            title: titleInput.value,
            body: bodyInput.value,
            date: new Date().toLocaleString()
        };

        entries.unshift(newEntry);
        localStorage.setItem('journalEntries', JSON.stringify(entries));

        titleInput.value = '';
        bodyInput.value = '';
        
        displayEntries();
    }

    function displayEntries() {
        const entriesList = document.getElementById('entriesList');
        const entries = JSON.parse(localStorage.getItem('journalEntries')) || [];
        
        if (entries.length === 0) {
            entriesList.innerHTML = '<p style="color: #95a5a6; font-style: italic;">No entries yet. Start writing above!</p>';
            return;
        }

        entriesList.innerHTML = entries.map(entry => `
            <div class="journal-entry">
                <div class="entry-title">${escapeHtml(entry.title)}</div>
                <div class="entry-date">${entry.date}</div>
                <div class="entry-body">${escapeHtml(entry.body)}</div>
                <button class="delete-btn" onclick="deleteEntry(${entry.id})">Delete</button>
            </div>
        `).join('');
    }

    function deleteEntry(id) {
        if (confirm('Are you sure you want to delete this entry?')) {
            let entries = JSON.parse(localStorage.getItem('journalEntries')) || [];
            entries = entries.filter(entry => entry.id !== id);
            localStorage.setItem('journalEntries', JSON.stringify(entries));
            displayEntries();
        }
    }

    function escapeHtml(text) {
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }
</script>

</body>
</html>
