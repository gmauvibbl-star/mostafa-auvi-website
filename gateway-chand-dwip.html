  .login-box{
    background:rgba(255,255,255,.92);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    padding:50px 40px;border-radius:16px;
    box-shadow:0 15px 40px rgba(27,59,54,.15);
    max-width:400px;width:100%;text-align:center;
    border-top:6px solid var(--gold);
  }
  .login-box h1{font-family:'Great Vibes',cursive;font-size:42px;color:var(--pine-green);margin-bottom:10px;font-weight:400}
  .login-box p{font-family:'EB Garamond',serif;font-style:italic;color:#666;margin-bottom:25px}
  .login-box input{width:100%;padding:12px 16px;margin-bottom:15px;border:1px solid #E0DED9;border-radius:8px;font-family:'EB Garamond',serif;font-size:16px;background:#fff}
  .login-box input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.15)}
  .login-box button{width:100%;padding:14px;background:var(--pine-green);color:var(--gold-light);border:none;border-radius:8px;cursor:pointer;font-size:16px;font-weight:600;transition:background .2s}
  .login-box button:hover{background:var(--sage-green)}
  #loginError{color:var(--terracotta);margin-top:15px;font-size:14px;min-height:18px}
</style>
</head>
<body>
  <div class="login-box">
    <h1>Author's Gateway</h1>
    <p>Please login to continue</p>
    <input type="email" id="loginEmail" placeholder="Email Address">
    <input type="password" id="loginPassword" placeholder="Password">
    <button onclick="loginWithEmail()">Login to Dashboard</button>
    <div id="loginError"></div>
  </div>
  <script>
    // আপনার আসল লগইন ফাংশনটি এখানে বসান (dashboard.html-এর loginWithEmail)
    function loginWithEmail(){
      document.getElementById('loginError').innerText = "এই ফাংশনে আপনার লগইন কোড যুক্ত করুন";
    }
  </script>
</body>
</html>
