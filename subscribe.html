<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ইমেইল সাবস্ক্রিপশন | Mostafa Auvi</title><style>body{max-width:650px;margin:40px auto;padding:0 18px;font:17px/1.7 system-ui;color:#20252b}input{width:100%;padding:12px;border:1px solid #bbc3cf;border-radius:8px;font:inherit;box-sizing:border-box}button{margin-top:12px;padding:11px 16px;border:0;border-radius:8px;background:#2856a6;color:white;font:inherit;cursor:pointer}.status{margin-top:15px}</style></head><body><p><a href="./">← মূল ওয়েবসাইট</a></p><h1>নতুন লেখার ইমেইল আপডেট</h1><p>নতুন লেখা প্রকাশিত হলে ইমেইলে খবর পেতে সাবস্ক্রাইব করুন। সাবস্ক্রিপশন নিশ্চিত করার ইমেইল পাঠানো হবে। যেকোনো সময় আনসাবস্ক্রাইব করতে পারবেন।</p><form id="form"><label for="email">ইমেইল ঠিকানা</label><input id="email" type="email" required autocomplete="email" placeholder="you@example.com"><button>সাবস্ক্রাইব করুন</button></form><p class="status" id="status" aria-live="polite"></p><script>const SUPABASE_URL="https://voswrndbxrsaqfzwffhh.supabase.co",SUPABASE_ANON_KEY="sb_publishable_lsz4V4nlZIbrFKi43YhOEg_m_pf0E5I";document.getElementById('form').onsubmit=async e=>{e.preventDefault();const s=document.getElementById('status');if(!SUPABASE_URL.startsWith('https://')||SUPABASE_URL.includes('YOUR_')||SUPABASE_ANON_KEY.includes('YOUR_')){s.textContent='সাবস্ক্রিপশন চালু করতে সাইটের মালিককে সেটআপ সম্পন্ন করতে হবে।';return}s.textContent='পাঠানো হচ্ছে…';try{const r=await fetch(SUPABASE_URL+'/functions/v1/subscription',{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY,Authorization:'Bearer '+SUPABASE_ANON_KEY},body:JSON.stringify({action:'subscribe',email:document.getElementById('email').value.trim()})});const d=await r.json();s.textContent=r.ok?(d.message||'ইমেইল দেখুন এবং সাবস্ক্রিপশন নিশ্চিত করুন।'):(d.error||'এখন সাবস্ক্রাইব করা যায়নি। পরে চেষ্টা করুন।')}catch{s.textContent='সংযোগে সমস্যা হয়েছে। পরে আবার চেষ্টা করুন।'}};</script></body></html>
