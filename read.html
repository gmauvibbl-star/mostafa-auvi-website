<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Mostafa Auvi-এর প্রকাশিত লেখা"><title>লেখা | Mostafa Auvi</title><style>body{max-width:780px;margin:36px auto;padding:0 18px;font:18px/1.9 system-ui;color:#20252b}#body{white-space:pre-wrap;overflow-wrap:anywhere}button{padding:9px 13px;border:0;border-radius:8px;background:#2856a6;color:white;cursor:pointer;margin:4px 5px 4px 0}a{color:#2856a6}</style></head><body><p><a href="./posts.html">← সব লেখা</a></p><h1 id="title">লেখা লোড হচ্ছে…</h1><p id="date"></p><div id="body"></div><hr><button id="copy">লিংক কপি</button><button id="share">শেয়ার করুন</button><a id="wa" target="_blank" rel="noopener">WhatsApp</a> · <a id="fb" target="_blank" rel="noopener">Facebook</a><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL="YOUR_SUPABASE_PROJECT_URL",SUPABASE_ANON_KEY="YOUR_SUPABASE_ANON_KEY";const url=location.href,slug=new URLSearchParams(location.search).get('slug');document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(url);alert('লিংক কপি হয়েছে')}catch{prompt('লিংক কপি করুন',url)}};document.getElementById('share').onclick=async()=>{if(navigator.share){try{await navigator.share({title:document.title,url})}catch{}}else{try{await navigator.clipboard.writeText(url);alert('লিংক কপি হয়েছে')}catch{prompt('লিংক কপি করুন',url)}}};document.getElementById('wa').href='https://wa.me/?text='+encodeURIComponent(url);document.getElementById('fb').href='https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(url);if(!slug){document.getElementById('title').textContent='লেখা পাওয়া যায়নি'}else if(SUPABASE_URL.startsWith('https://')&&!SUPABASE_URL.includes('YOUR_')&&!SUPABASE_ANON_KEY.includes('YOUR_')){supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY).from('posts').select('title,body,published_at').eq('slug',slug).eq('published',true).maybeSingle().then(({data,error})=>{if(error||!data){document.getElementById('title').textContent='লেখাটি পাওয়া যায়নি';document.getElementById('body').textContent='';return}document.title=data.title+' | Mostafa Auvi';document.getElementById('title').textContent=data.title;document.getElementById('body').textContent=data.body;document.getElementById('date').textContent=data.published_at?new Date(data.published_at).toLocaleDateString('bn-BD'):''})}else{document.getElementById('title').textContent='সেটআপ বাকি';document.getElementById('body').textContent='Supabase কনফিগার না করা পর্যন্ত লেখা লোড হবে না।'}</script></body></html>
