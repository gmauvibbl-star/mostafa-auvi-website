<style>
  :root{
    --teal-deep:#0F3D3E; --teal:#1B5E6B; --teal-mid:#2A7A7E;
    --cream:#FAF4E8; --paper:#F4ECD8; --paper-warm:#EDE2C6; --paper-dark:#C8B898;
    --ink:#1A1410; --ink-soft:#3D2E22; --ink-mute:#6B5A48;
    --gold:#B89248; --gold-bright:#D4B468; --gold-dim:#7A6028;
    --blood:#8A1818; --olive:#5A6B3F; --green:#2D5F52;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;min-height:100%;background:var(--olive);font-family:'Noto Serif Bengali','EB Garamond',serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  body{display:flex;justify-content:center}
  .page-wrap{max-width:800px;width:100%;margin:0 auto;background:var(--paper);box-shadow:0 0 40px rgba(0,0,0,0.22);position:relative;min-height:100vh;display:flex;flex-direction:column}

  /* ===== Top bar ===== */
  .top-bar{background:var(--teal-deep);color:var(--cream);padding:11px 28px;display:flex;justify-content:space-between;align-items:center;font-family:'EB Garamond',serif;font-size:12px;letter-spacing:0.14em;text-transform:uppercase}
  .top-bar a{color:var(--gold-bright);text-decoration:none;transition:color .2s}
  .top-bar a:hover{color:#fff}
  .top-bar .brand-mini{font-weight:600;letter-spacing:0.18em}
  .top-bar .back-link::before{content:"← ";letter-spacing:0}

  /* ===== Article header ===== */
  .article-header{padding:48px 50px 26px;border-bottom:1px solid var(--paper-dark);position:relative}
  .article-header::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:60px;height:3px;background:var(--gold)}
  .category-badge{display:inline-block;font-family:'EB Garamond',serif;font-size:11px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--gold-dim);background:var(--paper-warm);border:1px solid var(--paper-dark);padding:4px 12px;border-radius:2px;margin-bottom:18px}
  .article-title{font-family:'Playfair Display','Noto Serif Bengali',serif;font-size:clamp(28px,5vw,44px);line-height:1.18;font-weight:800;color:var(--teal-deep);margin-bottom:14px;letter-spacing:-0.01em}
  .article-title.bn{font-family:'Noto Serif Bengali',serif;font-weight:700;letter-spacing:0}
  .article-meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;font-family:'EB Garamond',serif;font-style:italic;font-size:14px;color:var(--ink-mute)}
  .article-meta .meta-sep{color:var(--paper-dark)}
  .article-meta .meta-lang{font-style:normal;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;font-size:11px;color:var(--gold-dim)}

  /* Language toggle */
  .lang-toggle{display:inline-flex;align-items:center;gap:6px;background:var(--teal-deep);color:var(--cream);border:1px solid var(--teal-deep);padding:5px 14px;border-radius:2px;font-family:'EB Garamond',serif;font-style:normal;font-size:12px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;transition:all .2s;margin-left:auto}
  .lang-toggle:hover{background:var(--teal);border-color:var(--teal)}
  .lang-toggle .dot{width:6px;height:6px;border-radius:50%;background:var(--gold-bright)}

  /* ===== Cover image ===== */
  .cover-wrap{padding:0 50px;margin:28px 0 8px}
  .cover-wrap img{display:block;width:100%;max-height:440px;object-fit:cover;border-radius:4px;box-shadow:0 6px 22px rgba(0,0,0,0.18);border:1px solid var(--paper-dark)}

  /* ===== Article body ===== */
  .article-body{padding:32px 50px 40px;font-family:'Noto Serif Bengali','EB Garamond',serif;font-size:18px;line-height:2;color:var(--ink-soft);text-align:justify;hyphens:auto;flex:1}
  .article-body.en{font-family:'EB Garamond',serif}
  .article-body p{margin:0 0 1.15em}
  .article-body p:first-of-type::first-letter{font-family:'Playfair Display',serif;font-size:4.2em;font-weight:800;color:var(--teal-deep);float:left;line-height:0.85;margin:6px 12px 0 0;padding:6px 6px 0 0}
  .article-body.en p:first-of-type::first-letter{font-family:'Playfair Display',serif}
  .article-body h2{font-family:'Playfair Display','Noto Serif Bengali',serif;font-size:1.55em;font-weight:700;color:var(--teal-deep);margin:1.6em 0 0.7em;line-height:1.3;padding-bottom:6px;border-bottom:1px solid var(--paper-dark)}
  .article-body h3{font-family:'Playfair Display','Noto Serif Bengali',serif;font-size:1.25em;font-weight:600;color:var(--teal-deep);margin:1.4em 0 0.5em;line-height:1.35}
  .article-body img{display:block;max-width:100%;height:auto;margin:1.4em auto;border-radius:4px;box-shadow:0 4px 14px rgba(0,0,0,0.14)}
  .article-body figure{margin:1.6em 0;text-align:center}
  .article-body figcaption{font-family:'EB Garamond',serif;font-style:italic;font-size:0.84em;color:var(--ink-mute);margin-top:6px;text-align:center}
  .article-body blockquote{border-left:3px solid var(--gold);padding:4px 16px;margin:1.4em 0;font-style:italic;color:var(--ink-mute);background:var(--paper-warm);border-radius:0 3px 3px 0}
  .article-body blockquote p{margin:0.5em 0}
  .article-body ul,.article-body ol{padding-left:26px;margin:1em 0 1.2em}
  .article-body li{margin:0.3em 0}
  .article-body a{color:var(--blood);text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:3px}
  .article-body a:hover{color:var(--teal-deep)}
  .article-body strong,.article-body b{color:var(--teal-deep);font-weight:700}
  .article-body em,.article-body i{color:var(--ink)}
  .article-body hr{border:0;border-top:1px solid var(--paper-dark);margin:2em auto;width:40%}
  .article-body [style*="background"]{padding:1px 4px;border-radius:2px}

  /* ===== Tags ===== */
  .tags-row{padding:0 50px 28px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid var(--paper-dark)}
  .tags-label{font-family:'EB Garamond',serif;font-style:italic;font-size:12px;color:var(--gold-dim);letter-spacing:0.1em;text-transform:uppercase;margin-right:4px}
  .tag-pill{display:inline-block;font-family:'EB Garamond',serif;font-size:12px;color:var(--teal-deep);background:var(--cream);border:1px solid var(--paper-dark);padding:3px 11px;border-radius:20px;letter-spacing:0.03em}
  .tag-pill::before{content:"#";color:var(--gold-dim);margin-right:2px}

  /* ===== Share ===== */
  .share-section{padding:26px 50px 36px;background:var(--paper-warm);border-bottom:1px solid var(--paper-dark)}
  .share-title{font-family:'Playfair Display',serif;font-size:15px;font-weight:600;color:var(--teal-deep);letter-spacing:0.06em;margin-bottom:14px;display:flex;align-items:center;gap:10px}
  .share-title::before,.share-title::after{content:"";flex:1;height:1px;background:var(--paper-dark)}
  .share-buttons{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .share-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:3px;font-family:'EB Garamond',serif;font-size:13px;font-weight:600;letter-spacing:0.05em;color:#fff;text-decoration:none;cursor:pointer;border:none;transition:transform .15s,box-shadow .15s;min-width:42px}
  .share-btn:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,0.18);color:#fff}
  .share-btn svg{width:14px;height:14px;fill:currentColor}
  .share-fb{background:#1877F2}.share-x{background:#000}.share-wa{background:#25D366}
  .share-tg{background:#0088CC}.share-li{background:#0A66C2}.share-copy{background:var(--teal-deep)}

  /* ===== Footer ===== */
  .site-footer{background:var(--teal-deep);color:var(--cream);border-top:3px solid var(--gold);padding:30px 50px 22px}
  .footer-brand{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--gold-bright);letter-spacing:0.08em;margin-bottom:4px}
  .footer-brand .bn{font-family:'Noto Serif Bengali',serif;font-size:14px;color:var(--cream);display:block;letter-spacing:0;font-weight:500;margin-top:2px}
  .footer-nav{display:flex;flex-wrap:wrap;gap:8px 18px;margin:14px 0;font-family:'EB Garamond',serif;font-size:13px}
  .footer-nav a{color:var(--cream);text-decoration:none;opacity:0.85;transition:opacity .2s,color .2s}
  .footer-nav a:hover{color:var(--gold-bright);opacity:1}
  .footer-copy{font-family:'EB Garamond',serif;font-style:italic;font-size:11px;color:var(--gold-dim);letter-spacing:0.08em;border-top:1px solid rgba(184,146,72,0.25);padding-top:12px;margin-top:6px}

  /* ===== States ===== */
  .loading-state,.error-state{padding:80px 50px;text-align:center}
  .loading-state .spinner,.error-state .icon{font-family:'Playfair Display',serif;font-size:48px;color:var(--gold);margin-bottom:14px}
  .loading-state h2,.error-state h2{font-family:'Playfair Display',serif;font-size:22px;color:var(--teal-deep);margin-bottom:8px}
  .loading-state p,.error-state p{font-family:'EB Garamond',serif;font-style:italic;color:var(--ink-mute);font-size:15px}
  .error-state a{display:inline-block;margin-top:18px;color:var(--blood);font-weight:600;text-decoration:none;border-bottom:1px solid var(--blood);padding-bottom:1px}

  /* ===== Responsive ===== */
  @media(max-width:680px){
    .top-bar{padding:10px 18px;font-size:11px}
    .top-bar .brand-mini{display:none}
    .article-header{padding:32px 22px 22px}
    .article-title{font-size:26px}
    .cover-wrap{padding:0 22px;margin:22px 0 6px}
    .cover-wrap img{max-height:300px}
    .article-body{padding:24px 22px 32px;font-size:17px;line-height:1.92}
    .article-body p:first-of-type::first-letter{font-size:3.6em}
    .tags-row{padding:0 22px 22px}
    .share-section{padding:22px 22px 28px}
    .share-btn{padding:7px 11px;font-size:12px}
    .site-footer{padding:24px 22px 18px}
    .article-meta{font-size:13px;gap:6px 12px}
    .lang-toggle{padding:4px 10px;font-size:11px}
  }
</style>

const fmtDate=(iso,lang)=>{
  if(!iso)return "";
  const d=new Date(iso);
  if(isNaN(d))return "";

};

const params=new URLSearchParams(location.search);
const slug=params.get('slug');
const articleEl=document.getElementById('article');
const shareUrl=location.href;

}

    '</div></div>';
}

function renderArticle(post,sibling){
  const lang=post.language||'bn';
  const isEn=lang==='en';
  document.documentElement.lang=lang;
  document.title=(post.title||'লেখা')+' | Mostafa Auvi';

  const dateStr=fmtDate(post.published_at,lang);
  const tags=Array.isArray(post.tags)?post.tags.filter(Boolean):(post.tags?String(post.tags).split(',').map(t=>t.trim()).filter(Boolean):[]);
  const bodyHtml=String(post.body||'').trim();
  const cover=post.cover_image?('<div class="cover-wrap"><img src="'+esc(post.cover_image)+'" alt="'+esc(post.title||'')+'"></div>'):'';

  const langToggle=sibling?('<button class="lang-toggle" id="langToggle" type="button"><span class="dot"></span>'+(isEn?'বাংলায় পড়ুন':'Read in English')+'</button>'):'';
  const langBadge='<span class="meta-lang">'+(isEn?'English':'বাংলা')+'</span>';

  articleEl.innerHTML=
    '<header class="article-header">'+
      '<span class="category-badge">'+esc(catLabel(post.category))+'</span>'+
      '<h1 class="article-title'+(isEn?'':' bn')+'">'+esc(post.title||'')+'</h1>'+
      '<div class="article-meta">'+
        '<span>'+esc(dateStr)+'</span>'+
        '<span class="meta-sep">·</span>'+
        langBadge+
        langToggle+
      '</div>'+
    '</header>'+
    cover+
    '<div class="article-body'+(isEn?' en':'')+'" id="articleBody">'+bodyHtml+'</div>'+
    (tags.length?('<div class="tags-row"><span class="tags-label">Tags</span>'+tags.map(t=>'<span class="tag-pill">'+esc(t)+'</span>').join('')+'</div>'):'')+
    buildShareButtons(post.title||'');

  // Language toggle handler
  if(sibling){
    document.getElementById('langToggle').onclick=()=>{
      const newUrl='./read.html?slug='+encodeURIComponent(sibling.slug);
      location.href=newUrl;
    };
  }

  // Copy link handler
  const copyBtn=document.getElementById('copyLinkBtn');
  if(copyBtn){
    copyBtn.onclick=async()=>{
      try{await navigator.clipboard.writeText(shareUrl);copyBtn.innerHTML='<svg viewBox="0 0 24 24"><path d="M9 16.2l-3.5-3.5-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z" fill="currentColor"/></svg>কপি হয়েছে!';setTimeout(()=>{copyBtn.innerHTML='<svg viewBox="0 0 24 24"><path d="M3.9 12c0-1.7 1.4-3.1 3.1-3.1h4V7H7C4.2 7 2 9.2 2 12s2.2 5 5 5h4v-1.9H7C5.3 15.1 3.9 13.7 3.9 12zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.7 0 3.1 1.4 3.1 3.1s-1.4 3.1-3.1 3.1h-4V17h4c2.8 0 5-2.2 5-5s-2.2-5-5-5z"/></svg>Copy Link'},1800)}catch(e){prompt('লিংক কপি করুন:',shareUrl)}
    };
  }
}

async function loadPost(){
  if(!slug){renderError('লেখা পাওয়া যায়নি','কোনো লেখার লিংক নির্বাচন করা হয়নি।');return}
  if(!SUPABASE_URL.startsWith('https://')||SUPABASE_ANON_KEY.includes('YOUR_')){renderError('সেটআপ বাকি','Supabase কনফিগার করা হয়নি।');return}
  try{
    const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
    // Fetch the post by slug
    const {data:post,error:err1}=await sb.from('posts')
      .select('id,group_id,language,slug,title,body,excerpt,cover_image,category,tags,published_at')
      .eq('slug',slug)
      .eq('published',true)
      .maybeSingle();
    if(err1)throw err1;
    if(!post){renderError('লেখাটি পাওয়া যায়নি','এই লিংকে কোনো প্রকাশিত লেখা নেই।');return}
    // Fetch sibling in other language by group_id
    let sibling=null;
    if(post.group_id){
      const {data:sib}=await sb.from('posts')
        .select('slug,language,title')
        .eq('group_id',post.group_id)
        .neq('language',post.language||'bn')
        .eq('published',true)
        .maybeSingle();
      if(sib&&sib.slug&&sib.slug!==post.slug)sibling=sib;
    }
    renderArticle(post,sibling);
  }catch(e){
    console.error(e);
    renderError('লোড করা যায়নি','ডেটাবেস সংযোগে সমস্যা হয়েছে। কিছুক্ষণ পর আবার চেষ্টা করুন।');
  }
}

loadPost();
</script>
