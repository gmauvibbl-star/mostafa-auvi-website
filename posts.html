<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="মোস্তফা অভির প্রকাশিত লেখা—বিভাগ, বছর, ভাষা ও ট্যাগ ধরে খুঁজুন।"><title>প্রকাশিত লেখা | Mostafa Auvi</title><style>
:root{--ink:#292b2d;--muted:#77716a;--line:#e4d9cc;--paper:#fffefa;--red:#76242d;--bg:#f3eee7}*{box-sizing:border-box}body{max-width:1120px;margin:0 auto;padding:22px;color:var(--ink);background:var(--bg);font:17px/1.8 "Noto Serif Bengali","Nirmala UI",system-ui,serif}a{color:var(--red)}header,.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:clamp(18px,3vw,30px);margin:16px 0}h1,h2{color:var(--red);line-height:1.45}h1{margin:.3em 0;font-size:clamp(28px,4vw,42px)}.muted{color:var(--muted);font-size:14px}.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.filters input,.filters select{min-width:0;width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:white;font:inherit;font-size:15px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.post{min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:white}.cover{height:150px;background:linear-gradient(135deg,#f4e1d7,#76242d);background-size:cover;background-position:center}.body{padding:17px}.meta{font-size:12px;color:var(--muted)}.post h2{font-size:20px;margin:6px 0}.post p{font-size:15px;margin:8px 0 14px;overflow-wrap:anywhere}.read{font-weight:bold;text-decoration:none}.status{color:var(--muted);font-size:14px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.filters{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){body{padding:12px}.grid,.filters{grid-template-columns:1fr}}
</style></head><body>
<p><a href="./">← মূল ওয়েবসাইট</a>　·　<a href="journal.html">জার্নাল</a></p>
<header><div class="muted">মোস্তফা অভি · লেখার সংগ্রহ</div><h1>প্রকাশিত লেখা</h1><p>বিভাগ, সময়, ভাষা বা ট্যাগ ধরে লেখা খুঁজুন। প্রতিটি লেখার মূল পাতা থেকে সম্পূর্ণ লেখা পড়া যাবে।</p></header>
<section class="panel"><div class="filters"><input id="q" type="search" placeholder="শিরোনাম বা লেখার শব্দ…" aria-label="অনুসন্ধান"><select id="category" aria-label="বিভাগ"><option value="">সব বিভাগ</option></select><select id="year" aria-label="বছর"><option value="">সব বছর</option></select><select id="language" aria-label="ভাষা"><option value="">সব ভাষা</option><option value="bn">বাংলা</option><option value="en">English</option></select><input id="tag" placeholder="ট্যাগ দিয়ে খুঁজুন" aria-label="ট্যাগ"><select id="sort" aria-label="ক্রম"><option value="new">নতুন আগে</option><option value="old">পুরোনো আগে</option></select></div><p id="status" class="status" aria-live="polite">লেখা লোড হচ্ছে…</p><div id="list" class="grid"></div></section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://voswrndbxrsaqfzwffhh.supabase.co",SUPABASE_ANON_KEY="sb_publishable_lsz4V4nlZIbrFKi43YhOEg_m_pf0E5I";const $=id=>document.getElementById(id);let all=[];
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function tags(p){return Array.isArray(p.tags)?p.tags:typeof p.tags==="string"?p.tags.split(",").map(x=>x.trim()).filter(Boolean):[]}
function render(){const q=$("q").value.trim().toLocaleLowerCase(),cat=$("category").value,year=$("year").value,lang=$("language").value,tag=$("tag").value.trim().toLocaleLowerCase(),sort=$("sort").value;let rows=all.filter(p=>{const d=p.published_at||p.created_at||"";const hay=[p.title,p.excerpt,p.body,p.category,...tags(p)].join(" ").toLocaleLowerCase();return(!q||hay.includes(q))&&(!cat||p.category===cat)&&(!year||d.slice(0,4)===year)&&(!lang||!p.language||p.language===lang||(lang==="bn"&&p.language==="বাংলা")||(lang==="en"&&p.language==="English"))&&(!tag||tags(p).some(t=>t.toLocaleLowerCase().includes(tag)))});rows.sort((a,b)=>{const d=(a.published_at||a.created_at||"").localeCompare(b.published_at||b.created_at||"");return sort==="old"?d:-d});$("status").textContent=rows.length+"টি লেখা পাওয়া গেছে।";$("list").innerHTML=rows.length?rows.map(p=>{const d=p.published_at||p.created_at||"",meta=[p.category,d?new Date(d).toLocaleDateString("bn-BD",{year:"numeric",month:"short",day:"numeric"}):"",p.language==="en"||p.language==="English"?"English":p.language?"বাংলা":""].filter(Boolean).map(esc).join(" · ");const cover=p.cover_image?'<div class="cover" style="background-image:url(\''+esc(p.cover_image).replace(/'/g,"%27")+'\')"></div>':'<div class="cover"></div>';const ex=p.excerpt||String(p.body||"").replace(/<[^>]*>/g," ").slice(0,200);return '<article class="post">'+cover+'<div class="body"><div class="meta">'+meta+'</div><h2>'+esc(p.title)+'</h2><p>'+esc(ex)+'</p><div class="meta">'+tags(p).map(esc).join(" · ")+'</div><p><a class="read" href="read.html?slug='+encodeURIComponent(p.slug)+'">লেখাটি পড়ুন ↗</a></p></div></article>'}).join(""):'<p class="status">এই শর্তে কোনো প্রকাশিত লেখা পাওয়া যায়নি।</p>'}
async function init(){try{const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const {data,error}=await sb.from("posts").select("*").eq("published",true).order("published_at",{ascending:false,nullsFirst:false}).limit(500);if(error)throw error;all=data||[];const cats=[...new Set(all.map(p=>p.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"bn"));$("category").innerHTML='<option value="">সব বিভাগ</option>'+cats.map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join("");const years=[...new Set(all.map(p=>(p.published_at||p.created_at||"").slice(0,4)).filter(y=>/^\\d{4}$/.test(y)))].sort().reverse();$("year").innerHTML='<option value="">সব বছর</option>'+years.map(y=>'<option value="'+y+'">'+y+'</option>').join("");const params=new URLSearchParams(location.search);if(params.has("category"))$("category").value=params.get("category");if(params.has("language"))$("language").value=params.get("language");if(params.has("tag"))$("tag").value=params.get("tag");if(params.get("sort")==="oldest")$("sort").value="old";["q","category","year","language","tag","sort"].forEach(id=>$(id).addEventListener(id==="q"||id==="tag"?"input":"change",render));render()}catch(e){$("status").textContent="লেখার তালিকা লোড করা যায়নি। Supabase সংযোগ ও schema যাচাই করুন।";$("list").innerHTML='<p>আপাতত <a href="journal.html">জার্নাল</a> দেখতে পারেন।</p>'}}
init();
</script></body></html>
