name: Generate Chandradwip poster WebP

on:
  push:
    paths:
      - 'assets/img/chandradwip_cards_poster.png'
      - '.github/workflows/generate-chandradwip-webp.yml'

permissions:
  contents: write

jobs:
  convert:
    if: contains(github.event.head_commit.message, '[generate-webp]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert PNG to compressed WebP
        run: |
          magick assets/img/chandradwip_cards_poster.png             -strip             -define webp:method=6             -quality 82             assets/img/chandradwip_cards_poster.webp
      - name: Commit WebP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img/chandradwip_cards_poster.webp
          git diff --cached --quiet && exit 0
          git commit -m "Add compressed Chandradwip poster WebP"
          git push