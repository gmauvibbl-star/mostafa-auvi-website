name: Refresh published-writing sitemap

on:
  push:
    branches: [main]
    paths-ignore:
      - "sitemap.xml"
  schedule:
    # Daily at 03:23 UTC (09:23 Bangladesh time).
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-published-writing-sitemap
  cancel-in-progress: true

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate static crawlable article pages
        run: node scripts/generate-static-articles.mjs

      - name: Generate sitemap from published posts
        run: node scripts/generate-sitemap.mjs

      - name: Validate generated XML
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            const xml = fs.readFileSync('sitemap.xml', 'utf8');
            if (!xml.startsWith('<?xml') || !xml.includes('<urlset') || !xml.includes('</urlset>')) {
              throw new Error('Generated sitemap.xml is not a valid sitemap document');
            }
            const count = (xml.match(/<url>/g) || []).length;
            if (count < 10) throw new Error('Unexpectedly small sitemap: ' + count + ' URLs');
            console.log('Validated sitemap.xml:', count, 'URLs');
          "

      - name: Commit updated sitemap directly to main
        run: |
          if git diff --quiet -- sitemap.xml posts/; then
            echo "Sitemap is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml posts/
          git commit -m "chore: refresh published article pages and sitemap"
          git push origin HEAD:main
