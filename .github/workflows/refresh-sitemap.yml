name: Refresh published-writing sitemap

on:
  push:
    branches: [main]
    paths-ignore:
      - "sitemap.xml"
  schedule:
    # Daily at 03:23 UTC (09:23 Bangladesh time).
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-published-writing-sitemap
  cancel-in-progress: true

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate static crawlable article pages
        run: node scripts/generate-static-articles.mjs

      - name: Generate static crawlable Chandradwip pages
        run: node scripts/generate-static-chandradwip.mjs

      - name: Generate sitemap from published posts
        run: node scripts/generate-sitemap.mjs

      - name: Validate generated XML
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            const xml = fs.readFileSync('sitemap.xml', 'utf8');
            if (!xml.startsWith('<?xml') || !xml.includes('<urlset') || !xml.includes('</urlset>')) {
              throw new Error('Generated sitemap.xml is not a valid sitemap document');
            }
            const count = (xml.match(/<url>/g) || []).length;
            if (count < 10) throw new Error('Unexpectedly small sitemap: ' + count + ' URLs');
            console.log('Validated sitemap.xml:', count, 'URLs');
          "

      - name: Create or update pull request for generated pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- sitemap.xml posts/; then
            echo "Generated pages and sitemap are already up to date."
            exit 0
          fi

          BRANCH="automation/published-articles"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml posts/
          git commit -m "chore: refresh published article pages and sitemap"
          git push --force origin HEAD:"$BRANCH"

          EXISTING_PR=$(gh pr list --base main --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -z "$EXISTING_PR" ]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Publish crawlable static article pages and refresh sitemap" \
              --body "Automatically generated static HTML pages for published writing, with per-article metadata and an updated sitemap. The source content remains in Supabase; this PR publishes crawlable snapshots."
          else
            echo "Updated existing pull request #$EXISTING_PR"
          fi
