name: Refresh published-writing sitemap

on:
  push:
    branches: [main]
    paths-ignore:
      - "sitemap.xml"
      - "posts/**"
  schedule:
    # Daily at 03:23 UTC (09:23 Bangladesh time).
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-published-writing-sitemap
  cancel-in-progress: true

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate static crawlable article pages
        run: node scripts/generate-static-articles.mjs

      - name: Generate static crawlable Chandradwip pages
        run: node scripts/generate-static-chandradwip.mjs

      - name: Generate sitemap from published posts
        run: node scripts/generate-sitemap.mjs

      - name: Validate generated XML
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            const xml = fs.readFileSync('sitemap.xml', 'utf8');
            if (!xml.startsWith('<?xml') || !xml.includes('<urlset') || !xml.includes('</urlset>')) {
              throw new Error('Generated sitemap.xml is not a valid sitemap document');
            }
            const count = (xml.match(/<url>/g) || []).length;
            if (count < 10) throw new Error('Unexpectedly small sitemap: ' + count + ' URLs');
            if (!xml.includes('/posts/')) throw new Error('Sitemap contains no article URLs');
            const locs = [...xml.matchAll(/<loc>([^<]+)<\\/loc>/g)].map(m => m[1]);
            const articleLocs = locs.filter(loc => loc.includes('/posts/') && !loc.endsWith('/posts/'));
            for (const loc of articleLocs) {
              const pathname = new URL(loc).pathname;
              const file = pathname.split('/').slice(-1)[0];
              if (!file.endsWith('.html')) continue;
              if (!fs.existsSync('posts/' + file)) throw new Error('Sitemap points to missing static article: ' + loc);
            }
            console.log('Validated sitemap.xml:', count, 'URLs and', articleLocs.length, 'article paths');
            const index = fs.readFileSync('posts/index.html', 'utf8');
            if (!index.includes('GENERATED-PUBLISHED-ARTICLE-INDEX')) {
              throw new Error('Generated published-writing index is missing its marker');
            }
            console.log('Validated posts/index.html');
          "

      - name: Publish generated pages and sitemap
        run: |
          if git diff --quiet -- sitemap.xml posts/; then
            echo "Generated pages and sitemap are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml posts/
          git commit -m "chore: refresh published article pages and sitemap"
          git push origin HEAD:main
