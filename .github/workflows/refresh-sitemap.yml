name: Refresh published-writing sitemap

on:
  push:
    branches: [main]
    paths-ignore:
      - "sitemap.xml"
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-published-writing-sitemap
  cancel-in-progress: true

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate sitemap from published posts
        run: node scripts/generate-sitemap.mjs

      - name: Open or update sitemap pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/refresh-published-sitemap
          delete-branch: true
          commit-message: "chore: refresh sitemap for published writing"
          title: "chore: refresh published-writing sitemap"
          body: |
            Automated update of sitemap.xml from currently published Bengali and English posts.

            Please review and merge this pull request to publish the refreshed sitemap.
          add-paths: |
            sitemap.xml
