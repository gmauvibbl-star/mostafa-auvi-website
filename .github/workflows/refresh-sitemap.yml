name: Refresh published-writing sitemap

on:
  push:
    branches: [main]
    paths-ignore:
      - "sitemap.xml"
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-published-writing-sitemap
  cancel-in-progress: true

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate sitemap from published posts
        run: node scripts/generate-sitemap.mjs

      - name: Commit sitemap when it changes
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "Sitemap is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "chore: refresh sitemap for published writing"
          git push origin HEAD:main
