<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0F3D3E">
<title>লেখক ড্যাশবোর্ড | Mostafa Auvi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;800&family=Noto+Serif+Bengali:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --teal-deep:#0F3D3E; --teal:#1B5E6B; --cream:#FAF4E8; --paper:#F4ECD8; --paper-warm:#EDE2C6; --paper-dark:#C8B898;
    --ink:#1A1410; --ink-soft:#3D2E22; --ink-mute:#6B5A48; --gold:#B89248; --gold-bright:#D4B468; --blood:#8A1818;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Serif Bengali',serif;background:var(--paper);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center}
  
  /* Login View */
  .login-container{margin:auto;text-align:center;background:var(--cream);padding:40px 50px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,0.1);border:1px solid var(--paper-dark);max-width:450px;width:90%}
  .login-container h1{font-family:'Playfair Display',serif;color:var(--teal-deep);font-size:28px;margin-bottom:10px}
  .login-container p{font-family:'EB Garamond',serif;font-style:italic;color:var(--ink-mute);font-size:16px;margin-bottom:30px}
  .login-btn{background:var(--teal-deep);color:var(--cream);border:none;padding:12px 30px;font-size:18px;font-family:'Noto Serif Bengali',serif;border-radius:6px;cursor:pointer;transition:background 0.3s;font-weight:600}
  .login-btn:hover{background:var(--teal)}
  .error-msg{color:var(--blood);margin-top:20px;font-size:16px}

  /* Dashboard View */
  .dashboard-wrap{width:100%;max-width:900px;padding:30px 20px}
  .dash-header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--gold);padding-bottom:15px;margin-bottom:30px;flex-wrap:wrap;gap:15px}
  .dash-title{font-family:'Playfair Display',serif;font-size:32px;color:var(--teal-deep)}
  .logout-btn{background:var(--blood);color:#fff;border:none;padding:10px 20px;font-size:16px;border-radius:6px;cursor:pointer;font-family:'Noto Serif Bengali',serif}
  
  .form-card{background:var(--cream);padding:30px;border-radius:10px;box-shadow:0 4px 15px rgba(0,0,0,0.05);border:1px solid var(--paper-dark);margin-bottom:40px}
  .form-group{margin-bottom:20px}
  .form-group label{display:block;font-size:18px;font-weight:600;color:var(--teal-deep);margin-bottom:8px}
  .form-input, .form-select, .form-textarea{width:100%;padding:12px 15px;font-size:18px;font-family:'Noto Serif Bengali',serif;border:1px solid var(--paper-dark);border-radius:6px;background:#fff;color:var(--ink)}
  .form-textarea{min-height:250px;resize:vertical;line-height:1.6}
  .form-input:focus, .form-textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 5px rgba(15,61,62,0.2)}
  .submit-btn{background:var(--teal-deep);color:var(--cream);border:none;padding:14px 40px;font-size:20px;font-family:'Noto Serif Bengali',serif;border-radius:6px;cursor:pointer;font-weight:700;width:100%}
  .submit-btn:hover{background:var(--teal)}
  
  .status-message{text-align:center;font-size:18px;margin-top:15px;color:var(--green);}
</style>
</head>
<body>

<!-- লগইন ভিউ -->
<div id="loginView" class="login-container">
  <h1>লেখক ড্যাশবোর্ড</h1>
  <p>শুধুমাত্র অনুমোদিত ব্যবহারকারীরা প্রবেশ করতে পারবেন।<br>অনুগ্রহ করে জিমেইল দিয়ে লগইন করুন।</p>
  <button class="login-btn" onclick="loginWithGoogle()">Google দিয়ে লগইন করুন</button>
  <div id="loginError" class="error-msg"></div>
</div>

<!-- ড্যাশবোর্ড ভিউ -->
<div id="dashboardView" style="display:none;" class="dashboard-wrap">
  <div class="dash-header">
    <h1 class="dash-title">নতুন লেখা পোস্ট করুন</h1>
    <button class="logout-btn" onclick="logout()">লগআউট</button>
  </div>

  <div class="form-card">
    <div class="form-group">
      <label>শিরোনাম (Title)</label>
      <input type="text" id="postTitle" class="form-input" placeholder="এখানে লেখার শিরোনাম দিন">
    </div>
    
    <div class="form-group">
      <label>বিভাগ (Category)</label>
      <select id="postCategory" class="form-select">
        <option value="গল্প">গল্প</option>
        <option value="উপন্যাস">উপন্যাস</option>
        <option value="প্রবন্ধ">প্রবন্ধ</option>
        <option value="সাহিত্যালোচনা">সাহিত্যালোচনা</option>
        <option value="ভ্রমণকাহিনি">ভ্রমণকাহিনি</option>
        <option value="আইন-আদালত">আইন-আদালত</option>
      </select>
    </div>

    <div class="form-group">
      <label>সারসংক্ষেপ (Excerpt)</label>
      <textarea id="postExcerpt" class="form-textarea" style="min-height:80px;" placeholder="লেখার প্রথম কয়েকটি লাইন বা সারসংক্ষেপ দিন"></textarea>
    </div>

    <div class="form-group">
      <label>মূল লেখা (Body / HTML)</label>
      <textarea id="postBody" class="form-textarea" placeholder="এখানে আপনার সম্পূর্ণ লেখাটি লিখুন"></textarea>
    </div>

    <div class="form-group">
      <label>কভার ইমেজ লিংক (URL)</label>
      <input type="text" id="postCover" class="form-input" placeholder="https://...">
    </div>

    <button class="submit-btn" onclick="savePost()">লেখাটি প্রকাশ করুন (Publish)</button>
    <div id="postStatus" class="status-message"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// আপনার Supabase কী (posts.html থেকে নেওয়া)
const SUPABASE_URL="https://voswrndbxrsaqfzwffhh.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_lsz4V4nlZIbrFKi43YhOEg_m_pf0E5I";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ⚠️ আপনার জিমেইল এখানে দিন। শুধু এই জিমেইল দিয়ে লগইন করলেই ড্যাশবোর্ড খুলবে।
const OWNER_EMAIL = "your-email@gmail.com"; // <-- এখানে আপনার জিমেইল দিন (যেমন: mostafa.auvi@gmail.com)

// চেক করা যাক ইউজার লগইন করা আছে কিনা
async function checkAuth() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    if (session.user.email === OWNER_EMAIL) {
      document.getElementById('loginView').style.display = 'none';
      document.getElementById('dashboardView').style.display = 'block';
    } else {
      // অন্য কেউ লগইন করলে তাকে বের করে দিন
      await sb.auth.signOut();
      document.getElementById('loginError').innerText = "প্রবেশ অনুমোদিত নয়! শুধুমাত্র মালিক ঢুকতে পারবেন।";
    }
  } else {
    document.getElementById('loginView').style.display = 'block';
    document.getElementById('dashboardView').style.display = 'none';
  }
}

// Google দিয়ে লগইন
async function loginWithGoogle() {
  const { data, error } = await sb.auth.signInWithOAuth({
    provider: 'google',
    options: {
      redirectTo: window.location.href // লগইন হলে এই পেজেই ফিরে আসবে
    }
  });
  if (error) {
    document.getElementById('loginError').innerText = "লগইন ব্যর্থ হয়েছে: " + error.message;
  }
}

// লগআউট
async function logout() {
  await sb.auth.signOut();
  checkAuth();
}

// পোস্ট সেভ করার ফাংশন
async function savePost() {
  const title = document.getElementById('postTitle').value.trim();
  const category = document.getElementById('postCategory').value;
  const excerpt = document.getElementById('postExcerpt').value.trim();
  const body = document.getElementById('postBody').value.trim();
  const cover = document.getElementById('postCover').value.trim();

  if(!title || !body) {
    alert("শিরোনাম এবং মূল লেখা দুটোই আবশ্যক!");
    return;
  }

  // স্লাগ তৈরি (Title থেকে)
  const slug = title.toLowerCase().replace(/[^\u0980-\u09FFa-z0-9 ]/g, '').replace(/\s+/g, '-');

  const { data, error } = await sb.from('posts').insert([
    { 
      title: title, 
      category: category, 
      excerpt: excerpt, 
      body: body, 
      cover_image: cover, 
      slug: slug,
      language: 'bn',
      published: true,
      published_at: new Date().toISOString()
    }
  ]);

  if (error) {
    document.getElementById('postStatus').innerText = "ত্রুটি: " + error.message;
    document.getElementById('postStatus').style.color = "var(--blood)";
  } else {
    document.getElementById('postStatus').innerText = "সফলভাবে প্রকাশিত হয়েছে!";
    document.getElementById('postStatus').style.color = "var(--green)";
    // ফর্ম ক্লিয়ার করা
    document.getElementById('postTitle').value = '';
    document.getElementById('postExcerpt').value = '';
    document.getElementById('postBody').value = '';
    document.getElementById('postCover').value = '';
  }
}

// পেজ লোড হলে আথ চেক করবে
checkAuth();
</script>
</body>
</html>
