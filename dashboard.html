<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>মোস্তফা অভি — লেখক ড্যাশবোর্ড | MOSTSFA AUVI Author Dashboard</title>
  <meta name="description" content="বাংলা ও ইংরেজি দ্বিভাষিক লেখক ব্যবস্থাপনা ড্যাশবোর্ড" />
  <meta name="author" content="MOSTSFA AUVI" />

  <!-- Bengali fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/gh/rasel-uxui/SolaimanLipi@latest/SolaimanLipi.css" rel="stylesheet" />

  <!-- Supabase JS v2 (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>

  <!-- Lucide icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <style>
    /* ============================================================
       CSS — Design System
       ============================================================ */
    :root {
      --radius: 8px;
      --bg: #ffffff;
      --fg: #18181b;
      --muted: #f4f4f5;
      --muted-fg: #71717a;
      --border: #e4e4e7;
      --card: #ffffff;
      --primary: #059669;
      --primary-fg: #ffffff;
      --primary-soft: #d1fae5;
      --accent: #f97316;
      --destructive: #dc2626;
      --warning: #d97706;
      --sidebar: #fafaf9;
      --sidebar-fg: #44403c;
      --ring: #10b981;
      --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
      --shadow-lg: 0 10px 25px rgba(0,0,0,.08), 0 4px 6px rgba(0,0,0,.04);
    }
    .dark {
      --bg: #18181b;
      --fg: #f4f4f5;
      --muted: #27272a;
      --muted-fg: #a1a1aa;
      --border: rgba(255,255,255,0.08);
      --card: #1f1f23;
      --primary: #10b981;
      --primary-fg: #08120e;
      --primary-soft: rgba(16,185,129,0.15);
      --accent: #fb923c;
      --destructive: #ef4444;
      --warning: #f59e0b;
      --sidebar: #1c1c1f;
      --sidebar-fg: #d4d4d8;
      --ring: #10b981;
      --shadow: 0 1px 3px rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.2);
      --shadow-lg: 0 10px 25px rgba(0,0,0,.4), 0 4px 6px rgba(0,0,0,.2);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: 'Hind Siliguri', 'Noto Sans Bengali', system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    .bn-font { font-family: 'SolaimanLipi', 'Hind Siliguri', 'Noto Sans Bengali', sans-serif; }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 14px; border-radius: var(--radius); border: 1px solid var(--border);
      background: var(--card); color: var(--fg); cursor: pointer;
      font-family: inherit; font-size: 14px; font-weight: 500;
      transition: all .15s; line-height: 1.2;
    }
    .btn:hover:not(:disabled) { background: var(--muted); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
    .btn-primary:hover:not(:disabled) { background: #047857; filter: brightness(1.05); }
    .dark .btn-primary:hover:not(:disabled) { background: #059669; filter: brightness(0.9); }
    .btn-destructive { background: var(--destructive); color: #fff; border-color: var(--destructive); }
    .btn-ghost { background: transparent; border-color: transparent; }
    .btn-ghost:hover:not(:disabled) { background: var(--muted); }
    .btn-sm { padding: 6px 10px; font-size: 13px; }
    .btn-icon { padding: 8px; width: 36px; height: 36px; justify-content: center; }

    /* Inputs */
    .input, .textarea, .select {
      width: 100%; padding: 8px 12px; border-radius: var(--radius);
      border: 1px solid var(--border); background: var(--card); color: var(--fg);
      font-family: inherit; font-size: 14px; transition: border-color .15s, box-shadow .15s;
    }
    .input:focus, .textarea:focus, .select:focus {
      outline: none; border-color: var(--ring);
      box-shadow: 0 0 0 3px rgba(16,185,129,0.15);
    }
    .textarea { resize: vertical; min-height: 70px; }
    .label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--fg); }
    .label .req { color: var(--destructive); }

    /* Cards */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
    .card-h { font-size: 14px; font-weight: 600; margin: 0 0 12px 0; display: flex; align-items: center; gap: 6px; }

    /* Badges */
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 8px; border-radius: 999px;
      font-size: 11px; font-weight: 500;
      background: var(--muted); color: var(--muted-fg);
    }
    .badge-default { background: var(--primary-soft); color: var(--primary); }
    .dark .badge-default { color: #6ee7b7; }
    .badge-warning { background: #fef3c7; color: #92400e; }
    .dark .badge-warning { background: rgba(245,158,11,0.15); color: #fbbf24; }

    /* Layout */
    .min-h-screen { min-height: 100vh; }
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .flex-1 { flex: 1; }
    .items-center { align-items: center; }
    .justify-center { justify-content: center; }
    .justify-between { justify-content: space-between; }
    .gap-2 { gap: 8px; } .gap-3 { gap: 12px; } .gap-4 { gap: 16px; }
    .p-4 { padding: 16px; } .p-6 { padding: 24px; }
    .mx-auto { margin-left: auto; margin-right: auto; }
    .mt-2 { margin-top: 8px; } .mt-4 { margin-top: 16px; } .mt-6 { margin-top: 24px; }
    .mb-2 { margin-bottom: 8px; } .mb-4 { margin-bottom: 16px; }
    .w-full { width: 100%; }
    .max-w-md { max-width: 448px; } .max-w-6xl { max-width: 1152px; }
    .hidden { display: none !important; }
    .text-center { text-align: center; }
    .text-sm { font-size: 13px; } .text-xs { font-size: 11px; }
    .text-muted { color: var(--muted-fg); }
    .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .grid { display: grid; }
    .grid-2 { grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid-4 { grid-template-columns: repeat(4, 1fr); gap: 12px; }
    @media (max-width: 768px) {
      .grid-2 { grid-template-columns: 1fr; }
      .grid-4 { grid-template-columns: repeat(2, 1fr); }
    }

    /* Top bar */
    .topbar {
      height: 56px; border-bottom: 1px solid var(--border);
      background: var(--card); display: flex; align-items: center;
      justify-content: space-between; padding: 0 16px; gap: 12px;
    }
    .topbar h1 { font-size: 15px; font-weight: 600; margin: 0; }

    /* Sidebar */
    .layout { display: flex; min-height: calc(100vh - 56px); }
    .sidebar {
      width: 240px; flex-shrink: 0; border-right: 1px solid var(--border);
      background: var(--sidebar); padding: 12px; display: flex; flex-direction: column; gap: 4px;
    }
    .sidebar .brand {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .brand .logo {
      width: 36px; height: 36px; border-radius: 8px;
      background: linear-gradient(135deg, var(--primary), #047857);
      display: flex; align-items: center; justify-content: center;
      color: #fff; flex-shrink: 0;
    }
    .brand .logo svg { width: 20px; height: 20px; }
    .brand .name { font-size: 14px; font-weight: 600; }
    .brand .sub { font-size: 11px; color: var(--muted-fg); }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px; border-radius: var(--radius);
      cursor: pointer; font-size: 14px; color: var(--sidebar-fg);
      transition: background .15s; border: none; background: transparent;
      font-family: inherit; text-align: left; width: 100%;
    }
    .nav-item:hover { background: var(--muted); }
    .nav-item.active { background: var(--primary-soft); color: var(--primary); font-weight: 500; }
    .dark .nav-item.active { color: #6ee7b7; }
    .nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }

    .user-card {
      margin-top: auto; padding: 10px; border-radius: var(--radius);
      background: var(--muted); display: flex; align-items: center; gap: 8px;
    }
    .avatar {
      width: 32px; height: 32px; border-radius: 50%; background: var(--primary);
      color: var(--primary-fg); display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 600; flex-shrink: 0;
    }
    .user-card .info { flex: 1; min-width: 0; }
    .user-card .name { font-size: 13px; font-weight: 500; }
    .user-card .email { font-size: 11px; color: var(--muted-fg); }

    /* Main content */
    .main { flex: 1; padding: 24px; overflow: auto; }
    .main-inner { max-width: 1152px; margin: 0 auto; }

    /* Login page */
    .login-wrap {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 16px; background: linear-gradient(135deg, #d1fae5 0%, var(--bg) 50%, #fed7aa 100%);
    }
    .dark .login-wrap { background: linear-gradient(135deg, rgba(16,185,129,0.1) 0%, var(--bg) 50%, rgba(249,115,22,0.1) 100%); }
    .login-card { width: 100%; max-width: 448px; }
    .login-brand { text-align: center; margin-bottom: 24px; }
    .login-brand .logo-big {
      width: 64px; height: 64px; border-radius: 16px; margin: 0 auto 12px;
      background: linear-gradient(135deg, var(--primary), #047857);
      display: flex; align-items: center; justify-content: center; color: #fff;
      box-shadow: 0 8px 20px rgba(5,150,105,0.3);
    }
    .login-brand .logo-big svg { width: 32px; height: 32px; }
    .login-brand h1 { font-size: 24px; font-weight: 700; margin: 0; }
    .login-brand p { font-size: 13px; color: var(--muted-fg); margin: 4px 0 0; }

    .tab-strip {
      display: flex; gap: 4px; padding: 4px;
      background: var(--muted); border-radius: 8px; margin-bottom: 16px;
    }
    .tab-strip button {
      flex: 1; padding: 8px; border: none; background: transparent;
      font-family: inherit; font-size: 13px; font-weight: 500;
      cursor: pointer; border-radius: 6px; color: var(--muted-fg);
    }
    .tab-strip button.active { background: var(--card); color: var(--fg); box-shadow: var(--shadow); }

    /* Editor */
    .editor-shell {
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--card); overflow: hidden; display: flex; flex-direction: column;
    }
    .editor-shell.fullscreen { position: fixed; inset: 0; z-index: 1000; border-radius: 0; }
    .editor-toolbar {
      display: flex; flex-wrap: wrap; gap: 2px; padding: 8px;
      border-bottom: 1px solid var(--border);
      background: var(--muted); position: relative; align-items: flex-start;
    }
    .tb-btn {
      width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center;
      border: none; background: transparent; color: var(--muted-fg); cursor: pointer;
      border-radius: 6px; transition: all .1s;
    }
    .tb-btn:hover:not(:disabled) { background: var(--bg); color: var(--fg); }
    .tb-btn.active { background: var(--primary-soft); color: var(--primary); }
    .dark .tb-btn.active { color: #6ee7b7; }
    .tb-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .tb-btn svg { width: 16px; height: 16px; }
    .tb-divider { width: 1px; height: 24px; background: var(--border); margin: 4px 4px; }
    .tb-select {
      height: 32px; padding: 0 8px; border: 1px solid transparent; background: transparent;
      color: var(--muted-fg); font-family: inherit; font-size: 13px; border-radius: 6px; cursor: pointer;
    }
    .tb-select:hover { background: var(--bg); color: var(--fg); }

    .tb-popover {
      position: absolute; z-index: 100; top: 42px;
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      box-shadow: var(--shadow-lg); padding: 8px; max-height: 280px; overflow: auto;
      min-width: 200px;
    }
    .tb-popover button {
      display: block; width: 100%; text-align: left;
      padding: 6px 10px; border: none; background: transparent;
      color: var(--fg); cursor: pointer; border-radius: 4px; font-family: inherit;
      font-size: 13px;
    }
    .tb-popover button:hover { background: var(--muted); }
    .tb-color-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; min-width: 180px; }
    .tb-color-grid button {
      width: 24px; height: 24px; padding: 0; border: 1px solid var(--border);
      border-radius: 4px; cursor: pointer;
    }
    .tb-color-grid button:hover { transform: scale(1.1); }

    .editor-content {
      min-height: 320px; padding: 16px; outline: none; line-height: 1.8;
      font-family: 'SolaimanLipi', 'Noto Sans Bengali', sans-serif; font-size: 17px;
      word-wrap: break-word;
    }
    .editor-content:empty::before {
      content: attr(data-placeholder); color: var(--muted-fg); pointer-events: none;
    }
    .editor-content h1 { font-size: 1.75rem; font-weight: 700; margin: 0.8em 0 0.4em; line-height: 1.3; }
    .editor-content h2 { font-size: 1.5rem; font-weight: 700; margin: 0.8em 0 0.4em; line-height: 1.3; }
    .editor-content h3 { font-size: 1.25rem; font-weight: 600; margin: 0.8em 0 0.4em; line-height: 1.3; }
    .editor-content p { margin: 0 0 0.8em; }
    .editor-content ul { list-style: disc; padding-left: 1.5em; margin: 0.5em 0; }
    .editor-content ol { list-style: decimal; padding-left: 1.5em; margin: 0.5em 0; }
    .editor-content blockquote { border-left: 3px solid var(--border); padding-left: 1em; margin: 0.8em 0; color: var(--muted-fg); font-style: italic; }
    .editor-content a { color: var(--primary); text-decoration: underline; }
    .editor-content img { max-width: 100%; height: auto; border-radius: 8px; margin: 0.5em 0; }
    .editor-content table { border-collapse: collapse; width: 100%; margin: 0.8em 0; }
    .editor-content th, .editor-content td { border: 1px solid var(--border); padding: 0.5em 0.75em; text-align: left; }
    .editor-content th { background: var(--muted); font-weight: 600; }
    .editor-content hr { border: 0; border-top: 1px solid var(--border); margin: 1.2em 0; }
    .editor-content iframe { border: 0; }

    .editor-footer {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 12px; border-top: 1px solid var(--border);
      background: var(--muted); font-size: 11px; color: var(--muted-fg);
    }

    /* Toast */
    #toast-host {
      position: fixed; top: 16px; right: 16px; z-index: 9999;
      display: flex; flex-direction: column; gap: 8px; max-width: 380px;
    }
    .toast {
      padding: 12px 14px; border-radius: 8px; background: var(--card);
      border: 1px solid var(--border); box-shadow: var(--shadow-lg);
      font-size: 13px; animation: slideIn .2s; min-width: 280px;
    }
    .toast.success { border-left: 4px solid var(--primary); }
    .toast.error { border-left: 4px solid var(--destructive); }
    .toast.info { border-left: 4px solid var(--accent); }
    .toast .t-title { font-weight: 600; margin-bottom: 2px; }
    .toast .t-desc { color: var(--muted-fg); font-size: 12px; }
    @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    /* Loader */
    .spinner { width: 24px; height: 24px; border: 3px solid var(--muted); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* List item */
    .writing-item {
      display: flex; gap: 12px; padding: 12px; border: 1px solid var(--border);
      border-radius: var(--radius); background: var(--card); transition: box-shadow .15s;
    }
    .writing-item:hover { box-shadow: var(--shadow); }
    .writing-item .thumb { width: 96px; height: 64px; border-radius: 6px; background: var(--muted); flex-shrink: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .writing-item .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .writing-item .info { flex: 1; min-width: 0; }
    .writing-item .title { font-size: 14px; font-weight: 500; margin: 0 0 2px; }
    .writing-item .meta { font-size: 11px; color: var(--muted-fg); display: flex; flex-wrap: wrap; gap: 8px; }

    /* Cover uploader */
    .cover-uploader {
      width: 100%; aspect-ratio: 16/9; border-radius: var(--radius);
      border: 2px dashed var(--border); cursor: pointer; transition: all .15s;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: var(--muted-fg); background: var(--muted);
    }
    .cover-uploader:hover { border-color: var(--primary); background: var(--primary-soft); }
    .cover-uploader.has-image { border-style: solid; padding: 0; overflow: hidden; }
    .cover-uploader img { width: 100%; height: 100%; object-fit: cover; }

    /* Tag input */
    .tag-input-wrap {
      display: flex; flex-wrap: wrap; gap: 6px; padding: 8px;
      border: 1px solid var(--border); border-radius: var(--radius); background: var(--card);
      min-height: 42px;
    }
    .tag-input-wrap input {
      flex: 1; min-width: 120px; border: none; outline: none; background: transparent;
      color: var(--fg); font-family: inherit; font-size: 13px;
    }
    .tag-chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 8px; border-radius: 999px; background: var(--primary-soft);
      color: var(--primary); font-size: 12px;
    }
    .dark .tag-chip { color: #6ee7b7; }
    .tag-chip button {
      border: none; background: transparent; color: inherit; cursor: pointer;
      padding: 0; display: flex; align-items: center;
    }

    /* Switch */
    .switch { position: relative; display: inline-block; width: 36px; height: 20px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background: var(--border); border-radius: 999px; transition: .15s;
    }
    .switch .slider::before {
      content: ''; position: absolute; height: 14px; width: 14px; left: 3px; top: 3px;
      background: #fff; border-radius: 50%; transition: .15s;
    }
    .switch input:checked + .slider { background: var(--primary); }
    .switch input:checked + .slider::before { transform: translateX(16px); }

    /* Modal */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 999;
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .modal {
      background: var(--card); border-radius: var(--radius); padding: 24px;
      max-width: 480px; width: 100%; box-shadow: var(--shadow-lg);
    }
    .modal h3 { margin: 0 0 8px; font-size: 16px; }
    .modal p { margin: 0 0 16px; color: var(--muted-fg); font-size: 14px; }

    /* Mobile */
    .mobile-only { display: none; }
    @media (max-width: 1024px) {
      .sidebar { display: none; }
      .mobile-only { display: flex; }
      .sidebar.open {
        display: flex; position: fixed; inset: 0 auto 0 0; z-index: 100;
        box-shadow: var(--shadow-lg);
      }
      .sidebar.open + .backdrop { display: block; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 99; }
    }
  </style>
</head>
<body>
  <!-- Toast host -->
  <div id="toast-host"></div>

  <!-- App host — সব content JS দিয়ে render হবে -->
  <div id="app"></div>

  <!-- ============================================================
       JavaScript — সম্পূর্ণ অ্যাপ্লিকেশন
       ============================================================ -->
  <script>
    // ============================================================
    // 🔧 CONFIG — এখানে আপনার Supabase URL ও anon key বসান
    // ============================================================
    const SUPABASE_URL  = 'YOUR_SUPABASE_URL';        // যেমন: https://abcxyz.supabase.co
    const SUPABASE_KEY  = 'YOUR_SUPABASE_ANON_KEY';   // যেমন: eyJhbGciOi...
    const COVERS_BUCKET = 'covers';                   // Storage bucket নাম

    // যদি এখানে ডিফল্ট ভ্যালু থাকে, ড্যাশবোর্ড "config করুন" মেসেজ দেখাবে

    // ============================================================
    // State
    // ============================================================
    const state = {
      session: null,
      user: null,
      userEmail: null,
      view: 'new',           // 'new' | 'list' | 'stats'
      editingId: null,
      categories: [],
      selectedParentCategory: '',
      tags: [],
      writings: [],
      pagination: { page: 1, limit: 10, total: 0, totalPages: 1 },
      filter: { status: 'all', search: '' },
      activeTab: 'bn',
      theme: localStorage.getItem('auvi-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'),
      loading: true,
      saving: false,
    };

    // Editor state (rich text)
    let editor = null; // RichTextEditor instance

    // ============================================================
    // Utilities
    // ============================================================
    function $(selector, root = document) { return root.querySelector(selector); }
    function $$(selector, root = document) { return Array.from(root.querySelectorAll(selector)); }
    function el(tag, props = {}, ...children) {
      const e = document.createElement(tag);
      Object.entries(props).forEach(([k, v]) => {
        if (k === 'class') e.className = v;
        else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
        else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2).toLowerCase(), v);
        else if (k === 'html') e.innerHTML = v;
        else if (v !== null && v !== undefined && v !== false) e.setAttribute(k, v);
      });
      children.flat().forEach(c => {
        if (c == null || c === false) return;
        if (typeof c === 'string' || typeof c === 'number') e.appendChild(document.createTextNode(String(c)));
        else e.appendChild(c);
      });
      return e;
    }
    function icon(name, props = {}) {
      const i = document.createElement('i');
      i.setAttribute('data-lucide', name);
      Object.entries(props).forEach(([k, v]) => i.setAttribute(k, v));
      return i;
    }
    function refreshIcons() {
      if (window.lucide) lucide.createIcons();
    }

    function slugify(text) {
      return (text || '').trim().toLowerCase()
        .replace(/[\s\u0964\u0965।]+/g, '-')
        .replace(/[^\u0980-\u09FFa-z0-9-]/g, '')
        .replace(/-+/g, '-')
        .replace(/^-|-$/g, '');
    }

    function formatDate(iso) {
      try { return new Date(iso).toLocaleDateString('bn-BD'); } catch { return ''; }
    }
    function formatNumber(n) {
      try { return Number(n).toLocaleString('bn-BD'); } catch { return String(n); }
    }

    function toast(title, desc = '', type = 'info', duration = 3500) {
      const host = $('#toast-host');
      const t = el('div', { class: `toast ${type}` },
        el('div', { class: 't-title' }, title),
        desc && el('div', { class: 't-desc' }, desc)
      );
      host.appendChild(t);
      setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .2s'; setTimeout(() => t.remove(), 200); }, duration);
    }

    // Theme
    function applyTheme(theme) {
      state.theme = theme;
      document.documentElement.classList.toggle('dark', theme === 'dark');
      localStorage.setItem('auvi-theme', theme);
    }

    // ============================================================
    // Supabase client
    // ============================================================
    let supabase = null;
    function initSupabase() {
      if (!SUPABASE_URL || !SUPABASE_KEY || SUPABASE_URL === 'YOUR_SUPABASE_URL') {
        return false;
      }
      try {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
          auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
        });
        return true;
      } catch (e) {
        console.error('Supabase init failed', e);
        return false;
      }
    }

    // ============================================================
    // AUTH
    // ============================================================
    async function checkSession() {
      if (!supabase) return false;
      const { data, error } = await supabase.auth.getSession();
      if (error || !data.session) return false;
      state.session = data.session;
      state.user = data.session.user;
      state.userEmail = data.session.user.email;
      // Verify admin
      const { data: adminRec } = await supabase.from('admin_users').select('user_id').eq('user_id', state.user.id).maybeSingle();
      if (!adminRec) {
        toast('অ্যাক্সেস নেই', 'এই অ্যাকাউন্ট লেখক ড্যাশবোর্ড ব্যবহার করতে পারবে না। প্রথমে admin_users টেবিলে যোগ করুন।', 'error', 6000);
        await supabase.auth.signOut();
        return false;
      }
      return true;
    }

    async function signIn(email, password) {
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) throw new Error(error.message);
      return checkSession();
    }

    async function signUp(email, password) {
      const { data, error } = await supabase.auth.signUp({ email, password });
      if (error) throw new Error(error.message);
      // After signup, the user is created in auth.users but NOT yet in admin_users
      // They need to manually be added to admin_users table OR via edge function
      if (data.user && !data.session) {
        throw new Error('ইমেইল ভেরিফিকেশন প্রয়োজন। ইমেইল চেক করুন।');
      }
      if (data.user) {
        // Try to insert into admin_users (will fail due to RLS for non-admins, but that's expected)
        await supabase.from('admin_users').insert({ user_id: data.user.id });
      }
      return checkSession();
    }

    async function resetPassword(email) {
      const { error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.href,
      });
      if (error) throw new Error(error.message);
    }

    async function signOut() {
      await supabase.auth.signOut();
      state.session = null;
      state.user = null;
      state.view = 'new';
      state.editingId = null;
      renderApp();
    }

    // ============================================================
    // CATEGORIES
    // ============================================================
    async function loadCategories() {
      const { data, error } = await supabase
        .from('categories')
        .select('*')
        .order('sort_order', { ascending: true });
      if (error) { console.error(error); return; }
      state.categories = data || [];
    }

    function getParentCategories() {
      return state.categories.filter(c => !c.parent_id);
    }
    function getSubcategories(parentId) {
      return state.categories.filter(c => c.parent_id === parentId);
    }

    // ============================================================
    // TAGS
    // ============================================================
    async function loadTags() {
      const { data, error } = await supabase.from('tags').select('id, name').order('name');
      if (error) { console.error(error); return; }
      state.tags = data || [];
    }

    async function ensureTags(names) {
      const trimmed = names.map(n => n.trim()).filter(Boolean);
      const result = [];
      for (const name of trimmed) {
        // Check cache
        let existing = state.tags.find(t => t.name.toLowerCase() === name.toLowerCase());
        if (existing) { result.push(existing.id); continue; }
        // Try insert
        const { data, error } = await supabase.from('tags').insert({ name }).select().single();
        if (!error && data) {
          state.tags.push(data);
          result.push(data.id);
        } else {
          // Maybe exists — try fetch
          const { data: existing2 } = await supabase.from('tags').select('id, name').eq('name', name).maybeSingle();
          if (existing2) { state.tags.push(existing2); result.push(existing2.id); }
        }
      }
      return result;
    }

    // ============================================================
    // WRITINGS CRUD
    // ============================================================
    async function loadWritings() {
      let query = supabase.from('posts').select('*, category:categories(id,name,name_en,slug), post_tags(tag_id)', { count: 'exact' });
      // Filter
      if (state.filter.status !== 'all') query = query.eq('status', state.filter.status);
      if (state.filter.search) {
        query = query.or(`title.ilike.%${state.filter.search}%,title_en.ilike.%${state.filter.search}%`);
      }
      // Pagination
      const page = state.pagination.page;
      const limit = state.pagination.limit;
      query = query.order('updated_at', { ascending: false }).range((page - 1) * limit, page * limit - 1);
      const { data, error, count } = await query;
      if (error) { console.error(error); toast('তালিকা লোড ব্যর্থ', error.message, 'error'); return; }
      state.writings = data || [];
      state.pagination.total = count || 0;
      state.pagination.totalPages = Math.max(Math.ceil((count || 0) / limit), 1);
    }

    async function loadWritingForEdit(id) {
      const { data, error } = await supabase
        .from('posts')
        .select('*, post_tags(tag_id)')
        .eq('id', id)
        .single();
      if (error) throw new Error(error.message);
      // Load tag names
      let tagNames = [];
      if (data.post_tags && data.post_tags.length > 0) {
        const tagIds = data.post_tags.map(pt => pt.tag_id);
        const { data: tagData } = await supabase.from('tags').select('name').in('id', tagIds);
        tagNames = (tagData || []).map(t => t.name);
      }
      return { ...data, tags: tagNames };
    }

    async function saveWriting(formData) {
      // Compute word count
      const text = (formData.body || '').replace(/<[^>]*>/g, ' ').trim();
      const wordCount = text ? text.split(/\s+/).length : 0;
      const payload = {
        title: formData.title,
        slug: formData.slug,
        title_en: formData.title_en || null,
        slug_en: formData.slug_en || null,
        intro: formData.intro || null,
        intro_en: formData.intro_en || null,
        body: formData.body || '',
        body_en: formData.body_en || null,
        category_id: formData.category_id || null,
        cover_image: formData.cover_image || null,
        featured: formData.featured || false,
        status: formData.status || 'draft',
        word_count: wordCount,
        published: formData.status === 'published',
        published_at: formData.status === 'published' ? new Date().toISOString() : null,
        updated_at: new Date().toISOString(),
      };
      let postId;
      if (state.editingId) {
        const { data, error } = await supabase.from('posts').update(payload).eq('id', state.editingId).select().single();
        if (error) throw new Error(error.message);
        postId = data.id;
      } else {
        const { data, error } = await supabase.from('posts').insert(payload).select().single();
        if (error) throw new Error(error.message);
        postId = data.id;
      }
      // Tags: first remove all existing, then add new
      await supabase.from('post_tags').delete().eq('post_id', postId);
      if (formData.tags && formData.tags.length > 0) {
        const tagIds = await ensureTags(formData.tags);
        const inserts = tagIds.map(tid => ({ post_id: postId, tag_id: tid }));
        if (inserts.length > 0) {
          const { error: ptErr } = await supabase.from('post_tags').insert(inserts);
          if (ptErr) console.error('post_tags insert error', ptErr);
        }
      }
      return postId;
    }

    async function deleteWriting(id) {
      const { error } = await supabase.from('posts').delete().eq('id', id);
      if (error) throw new Error(error.message);
    }

    async function toggleWritingStatus(w) {
      const newStatus = w.status === 'published' ? 'draft' : 'published';
      const { error } = await supabase.from('posts').update({
        status: newStatus,
        published: newStatus === 'published',
        published_at: newStatus === 'published' ? new Date().toISOString() : null,
        updated_at: new Date().toISOString(),
      }).eq('id', w.id);
      if (error) throw new Error(error.message);
    }

    // ============================================================
    // COVER IMAGE UPLOAD (Supabase Storage)
    // ============================================================
    async function uploadCover(file) {
      if (file.size > 5 * 1024 * 1024) throw new Error('ফাইল ৫MB এর বেশি');
      if (!file.type.startsWith('image/')) throw new Error('শুধু ছবি ফাইল দিন');
      const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
      const filename = `${Date.now()}-${Math.random().toString(36).slice(2, 10)}.${ext}`;
      const path = `covers/${filename}`;
      const { error } = await supabase.storage.from(COVERS_BUCKET).upload(path, file, { cacheControl: '3600', upsert: false });
      if (error) throw new Error(error.message);
      const { data } = supabase.storage.from(COVERS_BUCKET).getPublicUrl(path);
      return data.publicUrl;
    }

    // ============================================================
    // STATS
    // ============================================================
    async function loadStats() {
      const { count: total } = await supabase.from('posts').select('*', { count: 'exact', head: true });
      const { count: drafts } = await supabase.from('posts').select('*', { count: 'exact', head: true }).eq('status', 'draft');
      const { count: published } = await supabase.from('posts').select('*', { count: 'exact', head: true }).eq('status', 'published');
      const { count: featured } = await supabase.from('posts').select('*', { count: 'exact', head: true }).eq('featured', true);
      // Recent
      const { data: recent } = await supabase.from('posts')
        .select('id,title,title_en,status,updated_at,category:categories(name)')
        .order('updated_at', { ascending: false }).limit(5);
      // Total words
      const { data: allPosts } = await supabase.from('posts').select('word_count');
      const totalWords = (allPosts || []).reduce((sum, p) => sum + (p.word_count || 0), 0);
      return { total: total || 0, drafts: drafts || 0, published: published || 0, featured: featured || 0, totalWords, recent: recent || [] };
    }

    // ============================================================
    // RICH TEXT EDITOR (contentEditable + execCommand)
    // ============================================================
    function createRichEditor(mountEl, opts = {}) {
      const state = {
        value: opts.value || '',
        language: opts.language || 'bn',
        storageKey: opts.storageKey,
        isPreview: false,
        isFullscreen: false,
        lastSavedAt: null,
        history: [],
        historyIdx: -1,
        skipNextHistory: false,
      };

      const shell = el('div', { class: 'editor-shell' });

      // Toolbar
      const toolbar = el('div', { class: 'editor-toolbar' });
      const content = el('div', { class: 'editor-content', contenteditable: 'true', 'data-placeholder': opts.placeholder || 'এখানে লিখুন...' });
      const footer = el('div', { class: 'editor-footer' });
      const wordCount = el('span', {}, 'শব্দ: ০');
      const charCount = el('span', {}, 'অক্ষর: ০');
      const savedLabel = el('span', { class: 'hidden' });
      footer.append(wordCount, el('div', { class: 'flex items-center gap-2' }, savedLabel));

      shell.append(toolbar, el('div', { style: { flex: '1', overflow: 'auto', minHeight: '320px' } }, content), footer);
      mountEl.appendChild(shell);
      content.innerHTML = state.value || '';

      // Helpers
      const exec = (cmd, val) => {
        if (state.isPreview) return;
        content.focus();
        try { document.execCommand(cmd, false, val); } catch {}
        syncContent();
      };

      const syncContent = () => {
        const html = content.innerHTML;
        state.value = html;
        if (opts.onChange) opts.onChange(html);
        if (!state.skipNextHistory) {
          const last = state.history[state.historyIdx];
          if (!last || last !== html) {
            state.history = state.history.slice(0, state.historyIdx + 1);
            state.history.push(html);
            if (state.history.length > 50) state.history = state.history.slice(-50);
            state.historyIdx = state.history.length - 1;
          }
        }
        state.skipNextHistory = false;
        updateCounts();
      };

      const updateCounts = () => {
        const text = content.innerText || '';
        const words = text.trim() ? text.trim().split(/\s+/).length : 0;
        wordCount.textContent = `শব্দ: ${formatNumber(words)}`;
        charCount.textContent = `অক্ষর: ${formatNumber(text.length)}`;
      };

      // Toolbar buttons
      function tbBtn(title, iconSvg, onClick, activeFn) {
        const b = el('button', { class: 'tb-btn', title, type: 'button' });
        b.innerHTML = iconSvg;
        b.addEventListener('mousedown', e => e.preventDefault());
        b.addEventListener('click', () => { onClick(); b.blur(); });
        if (activeFn) b.dataset.activeFn = '1';
        return b;
      }

      function popoverTrigger(label, buildContent) {
        const wrap = el('div', { style: { position: 'relative' } });
        const btn = el('button', { class: 'tb-select', type: 'button' });
        btn.innerHTML = `${label} <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>`;
        const pop = el('div', { class: 'tb-popover hidden' });
        let open = false;
        const toggle = () => {
          open = !open;
          pop.classList.toggle('hidden', !open);
          if (open) {
            // Close other popovers
            $$('.tb-popover').forEach(p => { if (p !== pop) p.classList.add('hidden'); });
            pop.innerHTML = '';
            buildContent(pop);
          }
        };
        btn.addEventListener('mousedown', e => e.preventDefault());
        btn.addEventListener('click', toggle);
        wrap.append(btn, pop);
        return wrap;
      }

      // Close popovers on outside click
      document.addEventListener('mousedown', (e) => {
        if (!e.target.closest('.editor-toolbar')) {
          $$('.tb-popover').forEach(p => p.classList.add('hidden'));
        }
      });

      // Build toolbar
      const ic = (paths) => `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${paths}</svg>`;

      // Undo/Redo
      toolbar.append(tbBtn('Undo (আগের কাজ বাতিল)', ic('<path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6.7 2.7L3 13"/>'), () => {
        if (state.historyIdx > 0) {
          state.historyIdx--;
          state.skipNextHistory = true;
          content.innerHTML = state.history[state.historyIdx];
          if (opts.onChange) opts.onChange(state.history[state.historyIdx]);
          updateCounts();
        }
      }));
      toolbar.append(tbBtn('Redo (ফিরিয়ে আনা)', ic('<path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6.7 2.7L21 13"/>'), () => {
        if (state.historyIdx < state.history.length - 1) {
          state.historyIdx++;
          state.skipNextHistory = true;
          content.innerHTML = state.history[state.historyIdx];
          if (opts.onChange) opts.onChange(state.history[state.historyIdx]);
          updateCounts();
        }
      }));
      toolbar.append(el('div', { class: 'tb-divider' }));

      // Headings
      toolbar.append(tbBtn('H1', ic('<path d="M4 12h16M4 6v12M20 6v12"/>'), () => exec('formatBlock', 'h1')));
      toolbar.append(tbBtn('H2', ic('<path d="M4 12h16M4 6v12M20 6v12M4 18h8"/>'), () => exec('formatBlock', 'h2')));
      toolbar.append(tbBtn('H3', ic('<path d="M4 6v12M4 12h8M12 6v12"/>'), () => exec('formatBlock', 'h3')));
      toolbar.append(el('div', { class: 'tb-divider' }));

      // Bold/Italic/Underline/Strikethrough
      toolbar.append(tbBtn('বোল্ড', ic('<path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/><path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/>'), () => exec('bold')));
      toolbar.append(tbBtn('ইটালিক', ic('<path d="M19 4h-9M14 20H5M15 4 9 20"/>'), () => exec('italic')));
      toolbar.append(tbBtn('আন্ডারলাইন', ic('<path d="M6 4v6a6 6 0 0 0 12 0V4M4 20h16"/>'), () => exec('underline')));
      toolbar.append(tbBtn('কাটা দাগ (Strikethrough)', ic('<path d="M16 4H9a3 3 0 0 0-2.83 4M14 12a4 4 0 0 1 0 8H6"/><path d="M4 12l16 0"/>'), () => exec('strikeThrough')));
      toolbar.append(el('div', { class: 'tb-divider' }));

      // Font family popover
      const FONTS = [
        { label: 'সলাইমান লিপি', value: "'SolaimanLipi', 'Noto Sans Bengali', sans-serif" },
        { label: 'নোটো সানস বাংলা', value: "'Noto Sans Bengali', sans-serif" },
        { label: 'নোটো সেরিফ বাংলা', value: "'Noto Serif Bengali', serif" },
        { label: 'হিন্দ শিলিগুড়ি', value: "'Hind Siliguri', sans-serif" },
        { label: 'Arial', value: 'Arial, sans-serif' },
        { label: 'Times New Roman', value: "'Times New Roman', serif" },
        { label: 'Georgia', value: 'Georgia, serif' },
        { label: 'Verdana', value: 'Verdana, sans-serif' },
      ];
      toolbar.append(popoverTrigger('ফন্ট', (pop) => {
        FONTS.forEach(f => {
          const b = el('button', { type: 'button' }, f.label);
          b.style.fontFamily = f.value;
          b.addEventListener('click', () => { exec('fontName', f.value); $$('.tb-popover').forEach(p => p.classList.add('hidden')); });
          pop.appendChild(b);
        });
      }));

      // Font size popover
      const SIZES = [
        { label: 'ছোট (12px)', value: '12px' },
        { label: 'মাঝারি (14px)', value: '14px' },
        { label: 'সাধারণ (16px)', value: '16px' },
        { label: 'বড় (18px)', value: '18px' },
        { label: 'অতি বড় (20px)', value: '20px' },
        { label: 'বিশাল (24px)', value: '24px' },
        { label: 'প্রচুর বড় (32px)', value: '32px' },
        { label: 'সর্বোচ্চ (48px)', value: '48px' },
      ];
      toolbar.append(popoverTrigger('আকার', (pop) => {
        SIZES.forEach(s => {
          const b = el('button', { type: 'button' }, `${s.label}`);
          b.style.fontSize = s.value;
          b.addEventListener('click', () => {
            content.focus();
            const sel = window.getSelection();
            if (!sel || sel.rangeCount === 0) { $$('.tb-popover').forEach(p => p.classList.add('hidden')); return; }
            const range = sel.getRangeAt(0);
            if (range.collapsed) {
              try { document.execCommand('fontSize', false, '7'); } catch {}
              content.querySelectorAll('font[size="7"]').forEach(f => {
                const span = el('span'); span.style.fontSize = s.value;
                while (f.firstChild) span.appendChild(f.firstChild);
                f.replaceWith(span);
              });
            } else {
              const span = el('span'); span.style.fontSize = s.value;
              try { range.surroundContents(span); }
              catch {
                const frag = range.extractContents();
                span.appendChild(frag);
                range.insertNode(span);
              }
            }
            syncContent();
            $$('.tb-popover').forEach(p => p.classList.add('hidden'));
          });
          pop.appendChild(b);
        });
      }));

      // Text color
      const TEXT_COLORS = ['#000000', '#374151', '#6B7280', '#DC2626', '#EA580C', '#D97706', '#CA8A04', '#16A34A', '#15803D', '#0891B2', '#2563EB', '#7C3AED', '#C026D3', '#DB2777', '#FFFFFF'];
      toolbar.append(popoverTrigger('<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></svg>', (pop) => {
        const grid = el('div', { class: 'tb-color-grid' });
        TEXT_COLORS.forEach(c => {
          const b = el('button', { type: 'button', style: { backgroundColor: c } });
          b.addEventListener('click', () => { exec('foreColor', c); $$('.tb-popover').forEach(p => p.classList.add('hidden')); });
          grid.appendChild(b);
        });
        pop.appendChild(grid);

      toolbar.append(tbBtn('সংরক্ষিত খসড়া ফিরিয়ে আনা', ic('<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>'), () => {
        if (!state.storageKey) return;
        try {
          const raw = localStorage.getItem(state.storageKey);
          if (!raw) { toast('কোনো খসড়া নেই', '', 'info'); return; }
          const payload = JSON.parse(raw);
          if (confirm(`"${new Date(payload.savedAt).toLocaleString()}" এ সংরক্ষিত খসড়া ফিরিয়ে আনবেন?`)) {
            state.skipNextHistory = true;
            content.innerHTML = payload.html;
            if (opts.onChange) opts.onChange(payload.html);
            updateCounts();
            toast('খসড়া ফিরিয়ে আনা হয়েছে', '', 'success');

        } catch {}

      toolbar.append(tbBtn('সংরক্ষিত খসড়া মুছুন', ic('<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M10 11v6M14 11v6"/>'), () => {
        if (!state.storageKey) return;
        if (confirm('সংরক্ষিত খসড়া মুছে ফেলবেন?')) {
          try { localStorage.removeItem(state.storageKey); savedLabel.classList.add('hidden'); toast('খসড়া মুছে ফেলা হয়েছে'); } catch {}
        }
      }));

      // Right side: preview, fullscreen
      const rightWrap = el('div', { style: { marginLeft: 'auto', display: 'flex', gap: '2px' } });

        state.isPreview = !state.isPreview;

        else content.style.background = '';
      }));
      rightWrap.append(tbBtn('পূর্ণ পর্দা', ic('<path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/>'), () => {
        state.isFullscreen = !state.isFullscreen;
        shell.classList.toggle('fullscreen', state.isFullscreen);
      }));
      toolbar.appendChild(rightWrap);

      // Init history

        state.history.push(state.value);
        state.historyIdx = 0;
      }

      // Event handlers
      content.addEventListener('input', syncContent);
      content.addEventListener('keyup', updateCounts);
      content.addEventListener('mouseup', updateCounts);

      // Auto-save (debounced)
      let saveTimer = null;
      const onChangeDebounced = (html) => {
        if (!state.storageKey) return;
        clearTimeout(saveTimer);
        saveTimer = setTimeout(() => {
          try {
            const payload = { html, savedAt: new Date().toISOString() };
            localStorage.setItem(state.storageKey, JSON.stringify(payload));
            state.lastSavedAt = payload.savedAt;
            savedLabel.textContent = `সেভ: ${new Date(payload.savedAt).toLocaleTimeString()}`;
            savedLabel.classList.remove('hidden');
          } catch {}
        }, 800);
      };
      const origOnChange = opts.onChange;
      opts.onChange = (html) => { if (origOnChange) origOnChange(html); onChangeDebounced(html); };

      // Load lastSavedAt
      if (state.storageKey) {
        try {
          const raw = localStorage.getItem(state.storageKey);
          if (raw) {
            const payload = JSON.parse(raw);
            state.lastSavedAt = payload.savedAt;
            savedLabel.textContent = `সেভ: ${new Date(payload.savedAt).toLocaleTimeString()}`;
            savedLabel.classList.remove('hidden');
          }
        } catch {}
      }

      updateCounts();
      return {
        getValue: () => state.value,
        setValue: (html) => {
          state.skipNextHistory = true;
          content.innerHTML = html || '';
          state.value = html || '';
          if (opts.onChange) opts.onChange(html);
          updateCounts();
        },
        destroy: () => { shell.remove(); },
      };
    }

        )

      // Right column: category, cover, tags, options

        icon('image-plus'),

        tagInputWrap.querySelectorAll('.tag-chip').forEach(c => c.remove());

            el('button', { type: 'button' }, icon('x')));
          chip.querySelector('button').addEventListener('click', () => {
            formData.tags = formData.tags.filter(x => x !== t);
            renderTags();
          });
          tagInputWrap.insertBefore(chip, tagInput);
        });

        if (e.key === 'Enter' || e.key === ',') {
          e.preventDefault();
          const v = tagInput.value.trim();
          if (v && !formData.tags.includes(v)) {
            formData.tags.push(v);
            tagInput.value = '';
            renderTags();
          }
        } else if (e.key === 'Backspace' && !tagInput.value && formData.tags.length > 0) {
          formData.tags.pop();
          renderTags();

            <i data-lucide="star" style="width:16px;height:16px;color:#f59e0b;"></i>
            <div>
              <div class="text-sm">ফিচার্ড লেখা</div>
              <div class="text-xs text-muted">হোমপেজে দেখাবে</div>
            </div>
          </label>
          <label class="switch"><input type="checkbox" id="f-featured"><span class="slider"></span></label>
        </div>
        <div class="flex items-center justify-between mt-2">
          <div class="flex items-center gap-2">
            <i data-lucide="eye" style="width:16px;height:16px;"></i>
            <div>
              <div class="text-sm">বর্তমান স্ট্যাটাস</div>
              <div class="text-xs text-muted" id="status-text">খসড়া</div>
            </div>
          </div>
          <span class="badge badge-warning" id="status-badge">খসড়া</span>
        </div>
      `;

      rightCol.append(catCard, coverCard, tagsCard, optCard);
      grid.append(leftCol, rightCol);
      mount.append(header, grid);

      // Populate categories
      const parentSel = $('#f-parent-cat');
      getParentCategories().forEach(c => {
        const opt = el('option', { value: c.id }, `${c.name} / ${c.name_en}`);
        parentSel.appendChild(opt);
      });
      parentSel.addEventListener('change', () => {
        const subSel = $('#f-sub-cat');
        subSel.innerHTML = '<option value="">নির্বাচন করুন...</option>';
        getSubcategories(parentSel.value).forEach(c => {
          subSel.appendChild(el('option', { value: c.id }, `${c.name} / ${c.name_en}`));
        });
        formData.category_id = parentSel.value;
        updateCatBadge();
      });
      $('#f-sub-cat').addEventListener('change', () => {

        updateCatBadge();
      });
      function updateCatBadge() {
        const badge = $('#cat-badge');
        badge.innerHTML = '';
        if (formData.category_id) {
          const cat = state.categories.find(c => c.id === formData.category_id);
          if (cat) badge.appendChild(el('span', { class: 'badge badge-default bn-font' }, `${cat.name} / ${cat.name_en}`));
        }
      }

      // Cover upload
      coverUploader.addEventListener('click', () => coverInput.click());

        try {
          toast('আপলোড হচ্ছে...', '', 'info', 1500);
          const url = await uploadCover(f);
          formData.cover_image = url;
          coverUploader.classList.add('has-image');
          coverUploader.innerHTML = `<img src="${url}" alt="Cover" />`;
        } catch (e) { toast('আপলোড ব্যর্থ', e.message, 'error'); }

      });

      $('#f-title').addEventListener('input', (e) => {

        if (!formData.slug || formData.slug === slugify(formData.title)) {
          formData.slug = slugify(e.target.value);
          $('#f-slug').value = formData.slug;
        }
      });
      $('#f-slug').addEventListener('input', (e) => { formData.slug = e.target.value; });
      $('#f-intro').addEventListener('input', (e) => { formData.intro = e.target.value; });
      $('#f-title-en').addEventListener('input', (e) => {
        formData.title_en = e.target.value;
        if (!formData.slug_en || formData.slug_en === slugify(formData.title_en)) {
          formData.slug_en = slugify(e.target.value);
          $('#f-slug-en').value = formData.slug_en;
        }
      });
      $('#f-slug-en').addEventListener('input', (e) => { formData.slug_en = e.target.value; });
      $('#f-intro-en').addEventListener('input', (e) => { formData.intro_en = e.target.value; });

      let bnEd = null, enEd = null;
      const initEditors = () => {
        bnEd = createRichEditor($('#bn-editor-mount'), {
          language: 'bn',
          value: formData.body,
          storageKey: `draft-bn-${state.editingId || 'new'}`,
          placeholder: 'এখানে আপনার বাংলা লেখা লিখুন...',
          onChange: (html) => { formData.body = html; },
        });
        enEd = createRichEditor($('#en-editor-mount'), {
          language: 'en',
          value: formData.body_en,
          storageKey: `draft-en-${state.editingId || 'new'}`,
          placeholder: 'Write your English content here...',
          onChange: (html) => { formData.body_en = html; },
        });
      };

      // Load editing data
      if (state.editingId) {
        mount.appendChild(el('div', { class: 'flex items-center justify-center', style: { padding: '40px' } },
          el('div', { class: 'spinner' })));
        try {
          const w = await loadWritingForEdit(state.editingId);
          formData.title = w.title || '';
          formData.slug = w.slug || '';
          formData.intro = w.intro || '';
          formData.body = w.body || '';
          formData.title_en = w.title_en || '';
          formData.slug_en = w.slug_en || '';
          formData.intro_en = w.intro_en || '';
          formData.body_en = w.body_en || '';
          formData.category_id = w.category_id || '';
          formData.tags = w.tags || [];
          formData.featured = w.featured || false;
          formData.status = w.status || 'draft';
          formData.cover_image = w.cover_image || null;
          // Populate UI
          $('#f-title').value = formData.title;
          $('#f-slug').value = formData.slug;
          $('#f-intro').value = formData.intro;
          $('#f-title-en').value = formData.title_en;
          $('#f-slug-en').value = formData.slug_en;
          $('#f-intro-en').value = formData.intro_en;
          $('#f-featured').checked = formData.featured;
          // Category
          if (formData.category_id) {
            const cat = state.categories.find(c => c.id === formData.category_id);
            if (cat) {
              const parent = cat.parent_id ? state.categories.find(p => p.id === cat.parent_id) : cat;
              if (parent) {
                parentSel.value = parent.id;
                parentSel.dispatchEvent(new Event('change'));
                if (cat.parent_id) $('#f-sub-cat').value = cat.id;
              }
            }
          }
          // Cover
          if (formData.cover_image) {
            coverUploader.classList.add('has-image');
            coverUploader.innerHTML = `<img src="${formData.cover_image}" alt="Cover" />`;
          }
          // Status
          $('#status-text').textContent = formData.status === 'published' ? 'প্রকাশিত' : 'খসড়া';
          const sb = $('#status-badge');
          sb.textContent = formData.status === 'published' ? 'প্রকাশিত' : 'খসড়া';
          sb.className = `badge ${formData.status === 'published' ? 'badge-default' : 'badge-warning'}`;
          renderTags();
        } catch (e) {
          toast('লেখা লোড ব্যর্থ', e.message, 'error');
        }
        // Remove spinner
        mount.lastChild.remove();
      }
      initEditors();

      // Save / Publish
      const save = async (status) => {
        if (!formData.title.trim()) {
          toast('ত্রুটি', 'বাংলা শিরোনাম দিন', 'error');
          state.activeTab = 'bn';
          renderApp();
          return;
        }
        if (!formData.slug.trim()) formData.slug = slugify(formData.title);
        if (!formData.category_id) {
          toast('ত্রুটি', 'ক্যাটাগরি নির্বাচন করুন', 'error');
          return;
        }
        const btn = status === 'published' ? $('#publish-btn') : $('#save-draft-btn');
        const orig = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner" style="width:14px;height:14px;display:inline-block;vertical-align:middle;margin-right:6px;"></span> সেভ হচ্ছে...';
        try {
          formData.status = status;
          await saveWriting(formData);
          toast(status === 'published' ? 'প্রকাশিত হয়েছে' : 'খসড়া সংরক্ষিত', `"${formData.title}" সফলভাবে সেভ হয়েছে`, 'success');
          state.view = 'list';
          state.editingId = null;
          await loadWritings();
          renderApp();
        } catch (e) {
          toast('সংরক্ষণ ব্যর্থ', e.message, 'error');
        } finally {
          btn.disabled = false;
          btn.innerHTML = orig;
          refreshIcons();
        }
      };
      $('#save-draft-btn').addEventListener('click', () => save('draft'));
      $('#publish-btn').addEventListener('click', () => save('published'));

      refreshIcons();
    }

    // ============================================================
    // VIEW: Writings List
    // ============================================================
    async function renderListView(mount) {
      mount.appendChild(el('div', { class: 'flex justify-between items-center gap-2 mb-4 flex-wrap' },
        el('div', {},
          el('h2', { class: 'bn-font', style: { fontSize: '20px', fontWeight: 600, margin: 0 } }, 'আমার লেখাসমূহ'),
          el('p', { class: 'text-muted text-sm', id: 'count-text' }, 'লোড হচ্ছে...')
        ),
        el('button', { class: 'btn btn-primary', onclick: () => { state.view = 'new'; state.editingId = null; renderApp(); } },
          icon('plus'), 'নতুন লেখা')
      ));

      // Filters
      const filters = el('div', { class: 'flex gap-2 mb-4 flex-wrap' },
        el('div', { style: { position: 'relative', flex: 1, minWidth: '240px' } },
          el('input', { class: 'input', placeholder: 'শিরোনাম দিয়ে খুঁজুন...', id: 'search-input', value: state.filter.search })
        ),
        el('select', { class: 'select', id: 'status-filter', style: { width: 'auto' } },
          el('option', { value: 'all' }, 'সব'),
          el('option', { value: 'draft' }, 'খসড়া'),
          el('option', { value: 'published' }, 'প্রকাশিত')
        )
      );
      const listHost = el('div', { class: 'flex flex-col gap-2', id: 'list-host' });
      listHost.appendChild(el('div', { class: 'flex items-center justify-center', style: { padding: '40px' } }, el('div', { class: 'spinner' })));
      mount.append(filters, listHost);

      // Filter handlers
      let searchTimer = null;
      $('#search-input').addEventListener('input', (e) => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(async () => {
          state.filter.search = e.target.value;
          state.pagination.page = 1;
          await loadWritings();
          renderListItems();
        }, 250);
      });
      $('#status-filter').value = state.filter.status;
      $('#status-filter').addEventListener('change', async (e) => {
        state.filter.status = e.target.value;
        state.pagination.page = 1;
        await loadWritings();
        renderListItems();
      });

      await loadWritings();
      renderListItems();
      refreshIcons();
    }

    function renderListItems() {
      const host = $('#list-host');
      $('#count-text').textContent = `মোট ${formatNumber(state.pagination.total)} টি লেখা`;
      host.innerHTML = '';
      if (state.writings.length === 0) {
        host.appendChild(el('div', { class: 'text-center', style: { padding: '64px', border: '2px dashed var(--border)', borderRadius: 'var(--radius)' } },
          icon('file-text'),
          el('p', { class: 'text-muted mt-2' }, 'কোনো লেখা পাওয়া যায়নি'),
          el('button', { class: 'btn btn-primary mt-2', onclick: () => { state.view = 'new'; state.editingId = null; renderApp(); } },
            icon('plus'), 'প্রথম লেখা লিখুন')
        ));
        refreshIcons();
        return;
      }
      state.writings.forEach(w => {
        const item = el('div', { class: 'writing-item' });
        const thumb = el('div', { class: 'thumb' },
          w.cover_image ? el('img', { src: w.cover_image, alt: '' }) : icon('file-text'));
        const info = el('div', { class: 'info' },
          el('div', { class: 'flex items-center gap-2 flex-wrap' },
            el('h3', { class: 'title bn-font truncate', style: { flex: 1, minWidth: 0 } }, w.title),
            w.featured && el('span', { class: 'badge badge-default' }, '★ ফিচার্ড'),
            el('span', {
              class: `badge ${w.status === 'published' ? 'badge-default' : 'badge-warning'}`,
              style: { cursor: 'pointer' },
              title: 'স্ট্যাটাস পরিবর্তন করতে ক্লিক করুন',
              onclick: async () => {
                try { await toggleWritingStatus(w); await loadWritings(); renderListItems(); toast('স্ট্যাটাস পরিবর্তিত'); }
                catch (e) { toast('ত্রুটি', e.message, 'error'); }
              }
            }, w.status === 'published' ? 'প্রকাশিত' : 'খসড়া')
          ),
          w.title_en && el('p', { class: 'text-xs text-muted truncate' }, w.title_en),
          el('div', { class: 'meta' },
            w.category && el('span', {}, icon('file-text'), w.category.name),
            el('span', {}, icon('calendar'), formatDate(w.updated_at)),
            el('span', {}, `শব্দ: ${formatNumber(w.word_count || 0)}`)
          )
        );
        const actions = el('div', { class: 'flex gap-1', style: { flexShrink: 0 } },
          el('button', { class: 'btn btn-ghost btn-sm btn-icon', title: 'সম্পাদনা',
            onclick: () => { state.editingId = w.id; state.view = 'new'; renderApp(); }
          }, icon('pencil')),
          el('button', { class: 'btn btn-ghost btn-sm btn-icon', title: 'মুছুন',
            onclick: async () => {
              if (!confirm('এই লেখাটি মুছে ফেলবেন?')) return;
              try { await deleteWriting(w.id); await loadWritings(); renderListItems(); toast('লেখা মুছে ফেলা হয়েছে'); }
              catch (e) { toast('ত্রুটি', e.message, 'error'); }
            }
          }, icon('trash-2'))
        );
        item.append(thumb, info, actions);
        host.appendChild(item);
      });

      // Pagination
      if (state.pagination.totalPages > 1) {
        const pag = el('div', { class: 'flex justify-between items-center mt-2' },
          el('p', { class: 'text-xs text-muted' }, `পৃষ্ঠা ${formatNumber(state.pagination.page)} / ${formatNumber(state.pagination.totalPages)}`),
          el('div', { class: 'flex gap-1' },
            el('button', { class: 'btn btn-sm btn-icon', disabled: state.pagination.page <= 1,
              onclick: async () => { state.pagination.page--; await loadWritings(); renderListItems(); }
            }, icon('chevron-left')),
            el('button', { class: 'btn btn-sm btn-icon', disabled: state.pagination.page >= state.pagination.totalPages,
              onclick: async () => { state.pagination.page++; await loadWritings(); renderListItems(); }
            }, icon('chevron-right'))
          )
        );
        host.appendChild(pag);
      }
      refreshIcons();
    }

    // ============================================================
    // VIEW: Stats
    // ============================================================
    async function renderStatsView(mount) {
      mount.appendChild(el('h2', { class: 'bn-font', style: { fontSize: '20px', fontWeight: 600, margin: '0 0 4px' } }, 'পরিসংখ্যান'));
      mount.appendChild(el('p', { class: 'text-muted text-sm mb-4' }, 'আপনার লেখার সারসংক্ষেপ'));
      const spinnerWrap = el('div', { class: 'flex items-center justify-center', style: { padding: '40px' } }, el('div', { class: 'spinner' }));
      mount.appendChild(spinnerWrap);
      try {
        const stats = await loadStats();
        spinnerWrap.remove();

        const cards = [
          { label: 'মোট লেখা', value: stats.total, icon: 'file-text', cls: 'badge-default' },
          { label: 'প্রকাশিত', value: stats.published, icon: 'check-circle-2', cls: 'badge-default' },
          { label: 'খসড়া', value: stats.drafts, icon: 'file-edit', cls: 'badge-warning' },
          { label: 'ফিচার্ড', value: stats.featured, icon: 'star', cls: 'badge-default' },
        ];
        const cardsGrid = el('div', { class: 'grid grid-4 mb-4' });
        cards.forEach(c => {
          cardsGrid.appendChild(el('div', { class: 'card' },
            el('div', { class: 'flex items-center justify-between' },
              el('div', {},
                el('p', { class: 'text-xs text-muted' }, c.label),
                el('p', { style: { fontSize: '24px', fontWeight: 700, marginTop: '4px' } }, formatNumber(c.value))
              ),
              el('div', { class: `badge ${c.cls}`, style: { width: '36px', height: '36px', borderRadius: '8px' } }, icon(c.icon))
            )
          ));
        });
        mount.appendChild(cardsGrid);

        // Total words
        mount.appendChild(el('div', { class: 'card mb-4' },
          el('h3', { class: 'card-h' }, icon('type'), 'মোট শব্দ লিখেছেন'),
          el('div', { class: 'flex items-baseline gap-2' },
            el('span', { style: { fontSize: '28px', fontWeight: 700 } }, formatNumber(stats.totalWords)),
            el('span', { class: 'text-muted text-sm' }, 'শব্দ')
          ),
          el('p', { class: 'text-xs text-muted mt-2' },
            stats.total > 0 ? `গড়ে প্রতি লেখায় ${formatNumber(Math.round(stats.totalWords / stats.total))} শব্দ` : '')
        ));

        // Recent
        const recentCard = el('div', { class: 'card' },
          el('h3', { class: 'card-h' }, 'সাম্প্রতিক লেখা')
        );
        if (stats.recent.length === 0) {
          recentCard.appendChild(el('p', { class: 'text-sm text-muted' }, 'এখনো কোনো লেখা নেই'));
        } else {
          stats.recent.forEach(w => {
            const row = el('div', { class: 'flex items-center justify-between gap-2', style: { padding: '8px 0', borderBottom: '1px solid var(--border)' } },
              el('div', { style: { minWidth: 0, flex: 1 } },
                el('p', { class: 'text-sm bn-font truncate' }, w.title),
                el('p', { class: 'text-xs text-muted' },
                  (w.category?.name || '') + ' · ' + formatDate(w.updated_at))
              ),
              el('span', { class: `badge ${w.status === 'published' ? 'badge-default' : 'badge-warning'}` },
                w.status === 'published' ? 'প্রকাশিত' : 'খসড়া')
            );
            recentCard.appendChild(row);
          });
        }
        mount.appendChild(recentCard);
      } catch (e) {
        spinnerWrap.remove();
        mount.appendChild(el('div', { class: 'card' }, el('p', { class: 'text-destructive' }, 'ত্রুটি: ' + e.message)));
      }
      refreshIcons();
    }

    // ============================================================
    // After auth — load initial data and render
    // ============================================================
    async function afterAuth() {
      state.loading = true;
      renderApp();
      await Promise.all([loadCategories(), loadTags()]);
      state.loading = false;
      renderApp();
    }

    // ============================================================
    // INIT
    // ============================================================
    async function init() {
      applyTheme(state.theme);
      if (!initSupabase()) {
        renderConfigError();
        return;
      }
      // Show loading
      $('#app').innerHTML = '<div class="min-h-screen flex items-center justify-center"><div class="flex flex-col items-center gap-3"><div class="spinner"></div><p class="text-muted text-sm">লোড হচ্ছে...</p></div></div>';
      const ok = await checkSession();
      if (ok) {
        await loadCategories();
        await loadTags();
      }
      renderApp();

      // Listen to auth state changes
      supabase.auth.onAuthStateChange(async (event, session) => {
        if (event === 'SIGNED_OUT') {
          state.session = null; state.user = null;
          renderApp();
        } else if (event === 'SIGNED_IN' && session && !state.session) {
          state.session = session; state.user = session.user; state.userEmail = session.user.email;
          await afterAuth();
        }
      });
    }

    // Boot
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
