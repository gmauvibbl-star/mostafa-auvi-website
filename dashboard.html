// ====== Site Preview — opens read.html with current draft content ======
function openSitePreview() {
  const editor = document.getElementById('editor');
  if (!editor) return;
  const titleEl = document.querySelector('#title-input, input[name="title"]');
  const title = titleEl ? titleEl.value : 'প্রিভিউ';
  const body = editor.innerHTML;
  const previewData = { title, body, timestamp: Date.now() };
  try {
    localStorage.setItem('mauvi_preview_post', JSON.stringify(previewData));
    window.open('read.html?preview=1', '_blank');
  } catch(e) {
    alert('প্রিভিউ খোলা যায়নি।');
  }
}


// ====== Video Upload ======
async function uploadVideo(file, language) {
  if (!file) return null;
  if (!file.type.match(/^video\/(mp4|webm|ogg)$/)) { toast('ত্রুটি', 'শুধু MP4, WebM, OGG ভিডিও আপলোড করা যাবে।', 'error'); return null; }
  if (file.size > 50 * 1024 * 1024) { toast('ত্রুটি', 'ভিডিও ফাইল ৫০MB-এর কম হতে হবে।', 'error'); return null; }
  try {
    const sb = supabase; if (!sb) throw new Error('Supabase client is not initialized');
    const ext = '.' + file.name.split('.').pop();
    const path = 'video-' + language + '/' + Date.now() + '-' + Math.random().toString(36).slice(2,8) + ext;
    const { data, error } = await sb.storage.from('covers').upload(path, file, { contentType: file.type, upsert: false });
    if (error) throw error;
    const { data: urlData } = sb.storage.from('covers').getPublicUrl(path);
    return urlData.publicUrl;
  } catch(e) { toast('ত্রুটি', 'ভিডিও আপলোড ব্যর্থ: ' + e.message, 'error'); return null; }
}


// ====== Scheduled Publishing ======
function getScheduledAt() {
  const el = document.getElementById('scheduled-at');
  if (!el || !el.value) return null;
  const dt = new Date(el.value);
  if (isNaN(dt.getTime())) return null;
  return dt.toISOString();
}
function clearSchedule() {
  const el = document.getElementById('scheduled-at');
  if (el) el.value = '';
  const hint = document.getElementById('schedule-hint');
  if (hint) hint.textContent = '';
}


// ====== Revision History ======
async function saveRevision(postId) {
  if (!postId) return;
  try {
    const editor = document.getElementById('editor');
    const titleEl = document.querySelector('#title-input, input[name="title"]');
    const sb = supabase; if (!sb) throw new Error('Supabase client is not initialized');
    await sb.from('post_revisions').insert({
      post_id: postId,
      body: editor ? editor.innerHTML : '',
      title: titleEl ? titleEl.value : '',
      saved_at: new Date().toISOString()
    });
  } catch(e) { console.warn('Revision save failed:', e); }
}

async function showRevisionHistory(postId) {
  if (!postId) { toast('তথ্য', 'পুরোনো লেখা তৈরির পর রিভিশন দেখা যাবে।', 'info'); return; }
  try {
    const sb = supabase; if (!sb) throw new Error('Supabase client is not initialized');
    const { data, error } = await sb.from('post_revisions').select('id,body,title,saved_at').eq('post_id', postId).order('saved_at', { ascending: false }).limit(20);
    if (error) throw error;
    if (!data || data.length === 0) { toast('তথ্য', 'কোনো পুরোনো সংস্করণ নেই।', 'info'); return; }
    const choice = prompt('সংস্করণ নির্বাচন করুন (১-' + data.length + '):\n' + data.map((r, i) => (i+1) + '. ' + new Date(r.saved_at).toLocaleString('bn-BD') + ' — ' + (r.title || '(শিরোনামহীন)')).join('\n'));
    const idx = parseInt(choice) - 1;
    if (isNaN(idx) || idx < 0 || idx >= data.length) return;
    const rev = data[idx];
    if (confirm('এই সংস্করণ ফিরিয়ে আনবেন? বর্তমান লেখা সংরক্ষিত থাকবে (নতুন রিভিশন হিসেবে)।')) {
      const editor = document.getElementById('editor');
      const titleEl = document.querySelector('#title-input, input[name="title"]');
      if (editor) { editor.innerHTML = rev.body || ''; }
      if (titleEl && rev.title) { titleEl.value = rev.title; }
      if (state.editingId && state.editingId.id) saveRevision(state.editingId.id);
      toast('সফল', 'পুরোনো সংস্করণ ফিরিয়ে আনা হয়েছে। সংরক্ষণ করুন।', 'success');
    }
  } catch(e) { toast('ত্রুটি', 'রিভিশন লোড ব্যর্থ: ' + e.message, 'error'); }
}


// ====== Scheduled Publishing wiring ======
(function() {
  const schedInput = document.getElementById('scheduled-at');
  const clearBtn = document.getElementById('clear-schedule-btn');
  const statusEl = document.getElementById('schedule-status');
  if (clearBtn) clearBtn.addEventListener('click', () => {
    if (schedInput) schedInput.value = '';
    if (statusEl) statusEl.textContent = '';
  });
  if (schedInput) schedInput.addEventListener('change', () => {
    if (statusEl && schedInput.value) {
      const dt = new Date(schedInput.value);
      statusEl.textContent = 'নির্ধারিত: ' + dt.toLocaleString('bn-BD');
    } else if (statusEl) {
      statusEl.textContent = '';
    }
  });
})();




// ====== Media Library ======
async function openMediaLibrary(callback) {
  try {
    const sb = supabase; if (!sb) throw new Error('Supabase client is not initialized');
    const { data, error } = await sb.storage.from('covers').list('', { limit: 100, sortBy: { column: 'created_at', order: 'desc' } });
    if (error) throw error;
    if (!data || data.length === 0) { toast('তথ্য', 'কোনো ছবি বা ফাইল নেই। আগে আপলোড করুন।', 'info'); return; }
    
    // Build gallery modal
    const modal = document.createElement('div');
    modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
    const inner = document.createElement('div');
    inner.style.cssText = 'background:#fff;border-radius:12px;max-width:700px;width:100%;max-height:80vh;overflow-y:auto;padding:20px;';
    inner.innerHTML = '<h3 style="margin:0 0 12px;font-size:18px;">Media Library</h3><div id="media-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;"></div><button id="media-close" style="margin-top:12px;padding:8px 16px;background:var(--teal-deep);color:#fff;border:none;border-radius:6px;cursor:pointer;">বন্ধ</button>';
    modal.appendChild(inner);
    document.body.appendChild(modal);
    
    const grid = inner.querySelector('#media-grid');
    const baseUrl = SUPABASE_URL + '/storage/v1/object/public/covers/';
    data.filter(f => !f.id.endsWith('.emptyFolderPlaceholder')).forEach(file => {
      const url = baseUrl + file.name;
      const isImage = file.metadata && file.metadata.mimetype && file.metadata.mimetype.startsWith('image/');
      const item = document.createElement('div');
      item.style.cssText = 'cursor:pointer;border:2px solid transparent;border-radius:8px;overflow:hidden;text-align:center;';
      if (isImage) {
        item.innerHTML = '<img src="' + url + '" alt="" style="width:100%;height:100px;object-fit:cover;" /><div style="font-size:10px;padding:4px;color:#666;">' + file.name.slice(0, 15) + '</div>';
      } else {
        item.innerHTML = '<div style="height:100px;display:flex;align-items:center;justify-content:center;background:#f0f0f0;font-size:24px;">📄</div><div style="font-size:10px;padding:4px;color:#666;">' + file.name.slice(0, 15) + '</div>';
      }
      item.onclick = () => {
        if (callback) callback(url, file.name);
        document.body.removeChild(modal);
      };
      grid.appendChild(item);
    });
    
    inner.querySelector('#media-close').onclick = () => document.body.removeChild(modal);
    modal.onclick = (e) => { if (e.target === modal) document.body.removeChild(modal); };
  } catch(e) { toast('ত্রুটি', 'Media Library লোড ব্যর্থ: ' + e.message, 'error'); }
}


// ====== SEO Checklist ======
function updateSEOChecklist() {
  const title = (document.querySelector('#f-title') || {}).value || '';
  const body = document.getElementById('editor');
  const bodyText = body ? body.innerText : '';
  const metaDesc = (document.querySelector('#f-meta-description') || {}).value || '';
  const coverImg = document.querySelector('#cover-preview img');
  const slug = (document.querySelector('#f-slug') || {}).value || '';
  const items = [];
  items.push((title.length > 0 ? '✅' : '❌') + ' শিরোনাম (' + title.length + ' অক্ষর)');
  items.push((bodyText.length > 100 ? '✅' : '❌') + ' মূল লেখা (' + bodyText.length + ' অক্ষর)');
  items.push((metaDesc.length > 0 ? '✅' : '❌') + ' Meta Description (' + metaDesc.length + '/১৫৫)');
  items.push((slug.length > 0 ? '✅' : '❌') + ' URL Slug');
  items.push((coverImg ? '✅' : '❌') + ' প্রচ্ছদ ছবি');
  const hasAlt = body && body.querySelector('img[alt]:not([alt=""])');
  items.push((hasAlt ? '✅' : '❌') + ' ছবির Alt Text');
  const el = document.getElementById('seo-check-items');
  if (el) el.innerHTML = items.map(i => '<div style="margin:2px 0;">' + i + '</div>').join('');
}


// ====== Most Read Posts ======
async function loadMostRead() {
  const container = document.getElementById('most-read-list');
  if (!container) return;
  const safe = value => String(value == null ? '' : value)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  try {
    // Reuse the authenticated dashboard client. SUPABASE_ANON_KEY is not
    // defined in this page; the configured key is SUPABASE_KEY and the
    // existing client already carries the author's signed-in session.
    const sb = supabase;
    if (!sb) throw new Error('Supabase client is not initialized');
    const { data, error } = await sb.rpc('get_most_read_posts', { limit_count: 10 });
    if (error) throw error;
    if (!data || !data.length) {
      container.innerHTML = '<p class="text-sm text-muted">এখনো কোনো পাঠ-তথ্য নেই।</p>';
      return;
    }
    const ids = data.map(p => p.id).filter(Boolean);
    let covers = {};
    if (ids.length) {
      const { data: posts, error: coverError } = await sb.from('posts')
        .select('id,cover_image').in('id', ids);
      if (!coverError) (posts || []).forEach(p => { covers[p.id] = p.cover_image || ''; });
    }
    container.innerHTML = data.map((p, i) => {
      const image = covers[p.id]
        ? '<img src="' + safe(covers[p.id]) + '" alt="' + safe(p.title) + '" loading="lazy" style="width:76px;height:58px;object-fit:cover;border-radius:6px;flex:0 0 76px;">'
        : '<div aria-hidden="true" style="width:76px;height:58px;display:grid;place-items:center;background:var(--muted);border-radius:6px;flex:0 0 76px;">❦</div>';
      const href = 'read.html?slug=' + encodeURIComponent(p.slug || '') + '&lang=' + (p.language === 'en' ? 'en' : 'bn');
      return '<a href="' + safe(href) + '" style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);color:inherit;text-decoration:none;">' +
        image + '<span style="min-width:0;flex:1;"><strong style="display:block;line-height:1.5;">' + (i + 1) + '. ' + safe(p.title || '(শিরোনামহীন)') + '</strong>' +
        '<small style="color:var(--muted-fg);">' + (p.language === 'en' ? 'English' : 'বাংলা') + '</small></span>' +
        '<span style="color:var(--teal-deep);font-weight:600;white-space:nowrap;">' + safe(p.view_count || 0) + ' পাঠ</span></a>';
    }).join('');
  } catch(e) {
    console.warn('Most Read load failed:', e);
    container.innerHTML = '<p class="text-sm text-muted">সর্বাধিক পঠিত লেখা লোড করা যায়নি।</p>';
  }
}

setInterval(updateSEOChecklist, 3000);
</script>

    .breadcrumb .sep { color: var(--border-strong); }
    .breadcrumb .current { color: var(--fg); font-weight: 600; }
    .topbar-right { display: flex; align-items: center; gap: 8px; }

    /* ============================================================

    .layout { display: flex; min-height: calc(100vh - 52px); }

    .sidebar-brand .sub { font-size: 11px; color: var(--sidebar-muted); margin-top: 2px; }

    .sidebar-scroll { flex: 1; overflow-y: auto; padding: 8px 0; }
    .sidebar-section { padding: 8px 0 4px; }
    .sidebar-section-title {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.5px; color: var(--sidebar-muted);
      padding: 8px 16px 4px;
    }
   .nav-item {

    }

    /* ============================================================
       Main content

      background-color: var(--bg);

    .main-inner { width: 100%; max-width: none; margin: 0; }

    /* Statistics cards — stronger colors; preserve existing card layout */
    .stats-card { border-width: 1px; }
    .stats-card-0 { background: #245B9E; border-color: #174477; color: #FFFFFF; }
    .stats-card-1 { background: #287A45; border-color: #1D6035; color: #FFFFFF; }
    .stats-card-2 { background: #A85A12; border-color: #85430B; color: #FFFFFF; }
    .stats-card-3 { background: #6741A5; border-color: #4D2E83; color: #FFFFFF; }
    .stats-card-4 { background: #087E78; border-color: #075F5B; color: #FFFFFF; }
    .stats-card-5 { background: #AD4059; border-color: #873046; color: #FFFFFF; }
    .stats-card .text-muted { color: inherit; opacity: 1; }
    .stats-card > .flex > div:first-child p:last-child { color: inherit; }
    .stats-card > .flex > .badge {
      background: rgba(255,255,255,.18);
      color: inherit;
      border: 1px solid rgba(255,255,255,.28);
    }
    .dark .stats-card-0 { background: #173B63; border-color: #31577F; color: #F3F8FF; }
    .dark .stats-card-1 { background: #194A2B; border-color: #426B45; color: #F0FFF2; }
    .dark .stats-card-2 { background: #66370D; border-color: #93602D; color: #FFF4E5; }
    .dark .stats-card-3 { background: #3D2867; border-color: #62458A; color: #F7F0FF; }

    .dark .stats-featured-card .text-muted { color: #D0BFA5; }

    /* Page header (within main) */
    .page-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin-bottom: 16px; flex-wrap: wrap;
    }
    .page-title { font-size: 20px; font-weight: 700; margin: 0; color: var(--fg-on-red); }
    .page-subtitle { font-size: 12px; color: var(--muted-on-red); margin-top: 2px; }

    /* ============================================================
       Tabs (top of editor)
       ============================================================ */
    .tabs-bar {
      display: flex; gap: 0; border-bottom: 2px solid var(--border);
      background: var(--card); border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      padding: 0 8px; overflow-x: auto;
    }
    .tab-btn {
      padding: 12px 16px; border: none; background: transparent;
      font-family: inherit; font-size: 13px; font-weight: 500;
      cursor: pointer; color: var(--muted-fg);
      border-bottom: 3px solid transparent; margin-bottom: -2px;
      transition: all .15s; display: inline-flex; align-items: center; gap: 6px;
      white-space: nowrap;
    }
    .tab-btn:hover { color: var(--fg); }
    .tab-btn.active {
      color: var(--primary); border-bottom-color: var(--primary); font-weight: 600;
    }
    .tab-content {
      background: var(--card); border: 1px solid var(--border);
      border-top: none; border-radius: 0 0 var(--radius-lg) var(--radius-lg);
      padding: 20px;
    }

    /* Sub-tabs (language tabs within Topic Details) */
    .sub-tabs {
      display: flex; gap: 4px; padding: 4px;

      width: fit-content; max-width: 100%;
    }
    .sub-tab {
      padding: 6px 14px; border: none; background: transparent;

      transition: all .15s; display: inline-flex; align-items: center; gap: 6px;

      width: 16px; height: 12px; border-radius: 2px; font-size: 10px;
      font-weight: 700; color: #fff;
    }
    .lang-flag.bn { background: linear-gradient(135deg, #006a4e 0%, #f42a41 100%); }
    .lang-flag.en { background: linear-gradient(135deg, #1e3a8a 0%, #dc2626 100%); }

    /* ============================================================
       Login page
       ============================================================ */
    .login-wrap {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 16px;
      background:
        radial-gradient(circle at 20% 30%, rgba(200,90,76,0.18) 0%, transparent 45%),
        radial-gradient(circle at 80% 70%, rgba(30,58,82,0.18) 0%, transparent 45%),
        var(--bg);
    }
    .dark .login-wrap {
      background:
        radial-gradient(circle at 20% 30%, rgba(200,90,76,0.10) 0%, transparent 45%),
        radial-gradient(circle at 80% 70%, rgba(45,90,120,0.10) 0%, transparent 45%),
        var(--bg);
    }
    .login-card { width: 100%; max-width: 420px; }
    .login-brand { text-align: center; margin-bottom: 22px; }
    .login-brand .logo-big {
      width: 60px; height: 60px; border-radius: 14px; margin: 0 auto 12px;

    }
    .tab-strip button.active { background: var(--card); color: var(--fg); box-shadow: var(--shadow); }

    /* ============================================================
       Editor
       ============================================================ */
    .editor-shell {
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--card); overflow: hidden; display: flex; flex-direction: column;
    }
    .editor-shell.fullscreen { position: fixed; inset: 0; z-index: 1000; border-radius: 0; }
    .editor-toolbar {
      display: flex; flex-wrap: wrap; gap: 2px; padding: 6px;
      border-bottom: 1px solid var(--border);
      background: var(--card-cream); position: relative; align-items: flex-start;
    }
    .tb-btn {
      width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center;
      border: none; background: transparent; color: var(--muted-fg); cursor: pointer;
      border-radius: 4px; transition: all .1s;
    }
    .tb-btn:hover:not(:disabled) { background: var(--muted); color: var(--fg); }
    .tb-btn.active { background: var(--primary-soft); color: var(--primary); }
    .dark .tb-btn.active { color: #F4D9D2; }
    .tb-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .tb-btn svg { width: 15px; height: 15px; }
    .tb-divider { width: 1px; height: 22px; background: var(--border); margin: 4px 4px; }
    .tb-select {
      height: 30px; padding: 0 6px; border: 1px solid transparent; background: transparent;
      color: var(--muted-fg); font-family: inherit; font-size: 12px; border-radius: 4px; cursor: pointer;
    }
    .tb-select:hover { background: var(--muted); color: var(--fg); }

    .tb-popover {
      position: absolute; z-index: 100; top: 38px;
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow-lg); padding: 6px; max-height: 280px; overflow: auto;
      min-width: 200px;
    }
    .tb-popover button {
      display: block; width: 100%; text-align: left;
      padding: 6px 10px; border: none; background: transparent;
      color: var(--fg); cursor: pointer; border-radius: 4px; font-family: inherit;
      font-size: 12px;
    }
    .tb-popover button:hover { background: var(--muted); }
    .tb-color-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; min-width: 180px; }
    .tb-color-grid button {
      width: 22px; height: 22px; padding: 0; border: 1px solid var(--border);
      border-radius: 3px; cursor: pointer;
    }
    .tb-color-grid button:hover { transform: scale(1.1); }

    .editor-content {
      min-height: 300px; padding: 14px; outline: none; line-height: 1.8;
      font-family: 'SolaimanLipi', 'Noto Sans Bengali', sans-serif; font-size: 16px;
      word-wrap: break-word; color: var(--fg);
    }
    .editor-content:empty::before {
      content: attr(data-placeholder); color: var(--muted-fg); pointer-events: none;
    }
    .editor-content h1 { font-size: 1.75rem; font-weight: 700; margin: 0.8em 0 0.4em; line-height: 1.3; }
    .editor-content h2 { font-size: 1.5rem; font-weight: 700; margin: 0.8em 0 0.4em; line-height: 1.3; }
    .editor-content h3 { font-size: 1.25rem; font-weight: 600; margin: 0.8em 0 0.4em; line-height: 1.3; }
    .editor-content p { margin: 0 0 0.8em; }
    .editor-content ul { list-style: disc; padding-left: 1.5em; margin: 0.5em 0; }
    .editor-content ol { list-style: decimal; padding-left: 1.5em; margin: 0.5em 0; }
    .editor-content blockquote {
      border-left: 3px solid var(--primary); padding-left: 1em;
      margin: 0.8em 0; color: var(--muted-fg); font-style: italic;
    }
    .editor-content a { color: var(--primary); text-decoration: underline; }
    .editor-content img { max-width: 100%; height: auto; border-radius: 6px; margin: 0.5em 0; }
    .editor-content table { border-collapse: collapse; width: 100%; margin: 0.8em 0; }
    .editor-content th, .editor-content td { border: 1px solid var(--border); padding: 0.5em 0.75em; text-align: left; }
    .editor-content th { background: var(--muted); font-weight: 600; }
    .editor-content hr { border: 0; border-top: 1px solid var(--border); margin: 1.2em 0; }
    .editor-content iframe { border: 0; }

    .editor-footer {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 10px; border-top: 1px solid var(--border);
      background: var(--card-cream); font-size: 11px; color: var(--muted-fg);
    }

    /* ============================================================
       Toast
       ============================================================ */
    #toast-host {
      position: fixed; top: 16px; right: 16px; z-index: 9999;
      display: flex; flex-direction: column; gap: 8px; max-width: 360px;
    }
    .toast {
      padding: 11px 14px; border-radius: var(--radius); background: var(--card);
      border: 1px solid var(--border); box-shadow: var(--shadow-lg);
      font-size: 12px; animation: slideIn .2s; min-width: 260px;
    }
    .toast.success { border-left: 4px solid var(--success); }
    .toast.error { border-left: 4px solid var(--destructive); }
    .toast.info { border-left: 4px solid var(--primary); }
    .toast .t-title { font-weight: 700; margin-bottom: 2px; color: var(--fg); }
    .toast .t-desc { color: var(--muted-fg); font-size: 11px; }
    @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    /* Loader */
    .spinner { width: 22px; height: 22px; border: 3px solid var(--muted); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ============================================================
       Writings list item
       ============================================================ */
    .writing-item {
      display: flex; gap: 12px; padding: 12px; border: 1px solid var(--border);
      border-radius: var(--radius); background: var(--card); transition: all .15s;
    }
    .writing-item:hover { box-shadow: var(--shadow); border-color: var(--border-strong); }
    .writing-item .thumb {
      width: 88px; height: 60px; border-radius: 4px; background: var(--muted);
      flex-shrink: 0; overflow: hidden; display: flex; align-items: center; justify-content: center;
    }
    .writing-item .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .writing-item .info { flex: 1; min-width: 0; }
    .writing-item .title { font-size: 13px; font-weight: 600; margin: 0 0 2px; color: var(--fg); }
    .writing-item .meta {
      font-size: 11px; color: var(--muted-fg);
      display: flex; flex-wrap: wrap; gap: 8px;
      margin-top: 4px;
    }
    .writing-item .meta svg { width: 10px; height: 10px; }

    /* ============================================================
       Cover uploader
       ============================================================ */
    .cover-uploader {
      width: 100%; aspect-ratio: 16/9; border-radius: var(--radius);
      border: 2px dashed var(--border-strong); cursor: pointer; transition: all .15s;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: var(--muted-fg); background: var(--card-cream);
    }
    .cover-uploader:hover { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); }
    .cover-uploader.has-image { border-style: solid; padding: 0; overflow: hidden; }
    .cover-uploader img { width: 100%; height: 100%; object-fit: cover; }
    .cover-uploader svg { width: 24px; height: 24px; }

    /* ============================================================
       Tag input
       ============================================================ */
    .tag-input-wrap {
      display: flex; flex-wrap: wrap; gap: 5px; padding: 7px;
      border: 1px solid var(--border); border-radius: var(--radius); background: var(--card);
      min-height: 38px;
    }
    .tag-input-wrap input {
      flex: 1; min-width: 100px; border: none; outline: none; background: transparent;
      color: var(--fg); font-family: inherit; font-size: 12px;
    }
    .tag-chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 7px; border-radius: 999px; background: var(--primary-soft);
      color: var(--primary); font-size: 11px; font-weight: 500;
    }
    .dark .tag-chip { color: #F4D9D2; }
    .tag-chip button {
      border: none; background: transparent; color: inherit; cursor: pointer;
      padding: 0; display: flex; align-items: center;
    }
    .tag-chip button svg { width: 10px; height: 10px; }

    /* ============================================================
       Switch (toggle)
       ============================================================ */

    function findCategoryByName(name) {
      const cats = state.categories && state.categories.length ? state.categories : CATEGORIES;
      for (const p of cats) {
        if (p.name === name || p.slug === name || (p.aliases || []).includes(name)) return { parent: p, sub: null };
        for (const s of (p.subs || [])) {
          if (s.name === name || s.slug === name || (s.aliases || []).includes(name)) return { parent: p, sub: s };
        }
      }
      return null;
    }
    function findCategoryById(catId, subId) {
      const cats = state.categories && state.categories.length ? state.categories : CATEGORIES;
      const parent = cats.find(c => c.id == catId || c.slug == catId);
      if (!parent) return null;
      const sub = subId ? (parent.subs || []).find(s => s.id == subId) : null;
      return { parent, sub };
    }

    function getWritingCategoryLabels(w) {
      const rawParent = w.parent_category || '';
      const rawCategory = w.category || '';
      const rawSub = w.subcategory || '';
      const parentMatch = rawParent ? findCategoryByName(rawParent) : null;
      const categoryMatch = rawCategory ? findCategoryByName(rawCategory) : null;
      const parent = parentMatch?.parent || categoryMatch?.parent;
      const sub = rawSub
        ? (parent?.subs || []).find(s => s.name === rawSub || s.slug === rawSub) || null
        : categoryMatch?.sub || (rawParent && rawCategory !== rawParent ? categoryMatch?.sub : null);
      return {
        parent: parent?.name || rawParent || rawCategory,
        sub: sub?.name || rawSub || (rawParent && rawCategory !== rawParent ? rawCategory : ''),
      };
    }

    function $(selector, root = document) { return root.querySelector(selector); }
    function $$(selector, root = document) { return Array.from(root.querySelectorAll(selector)); }
    function el(tag, props = {}, ...children) {
      const e = document.createElement(tag);
      Object.entries(props).forEach(([k, v]) => {
        if (k === 'class') e.className = v;
        else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
        else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2).toLowerCase(), v);
        else if (k === 'html') e.innerHTML = v;
        else if (v !== null && v !== undefined && v !== false) e.setAttribute(k, v);
      });
      children.flat().forEach(c => {
        if (c == null || c === false) return;
        if (typeof c === 'string' || typeof c === 'number') e.appendChild(document.createTextNode(String(c)));
        else e.appendChild(c);
      });
      return e;
    }
    function icon(name, props = {}) {
      const i = document.createElement('i');
      i.setAttribute('data-lucide', name);
      Object.entries(props).forEach(([k, v]) => i.setAttribute(k, v));
      return i;
    }
    function refreshIcons() { if (window.lucide) lucide.createIcons(); }

    function slugify(text) {
      return (text || '').trim().toLowerCase()
        .replace(/[\s\u0964\u0965।]+/g, '-')
        .replace(/[^\u0980-\u09FFa-z0-9-]/g, '')
        .replace(/-+/g, '-')
        .replace(/^-|-$/g, '');
    }
    function hasMeaningfulArticleContent(html) {
      const doc = new DOMParser().parseFromString(String(html || ''), 'text/html');
      const text = (doc.body.textContent || '').replace(/[\s\u00a0]+/g, ' ').trim();
      return !!text || !!doc.body.querySelector('img, video, iframe, audio');
    }

    }

    function toast(title, desc = '', type = 'info', duration = 3500) {

    async function checkSession() {
      if (!supabase) return false;
      const { data, error } = await supabase.auth.getSession();
      if (error || !data.session) return false;
      state.session = data.session;
      state.user = data.session.user;

      if (!adminRec) {

        await supabase.auth.signOut();
        return false;
      }
      return true;
    }

      const parent = state.categories.find(c => c.name === parentName);

      const { data, error } = await supabase.from('posts').select('tags');
      if (error || !data) { state.tags = []; return; }
      const tagSet = new Set();
      data.forEach(p => { (p.tags || []).forEach(t => tagSet.add(t)); });

      let query = supabase.from('posts')
        .select('id, title, slug, group_id, language, category, parent_category, subcategory, category_id, subcategory_id, cover_image, published, scheduled_at, featured, updated_at, tags', { count: 'exact' })
        .or('group_id.is.null,language.eq.bn')
        .order('updated_at', { ascending: false });
      if (state.filter.status === 'scheduled') query = query.not('scheduled_at', 'is', null).eq('published', false);
      else if (state.filter.status === 'draft') query = query.eq('published', false);
      else if (state.filter.status === 'published') query = query.eq('published', true);
      if (state.filter.search) {
        query = query.ilike('title', `%${state.filter.search}%`);
      }
      query = query.order('updated_at', { ascending: false }).range((page - 1) * limit, page * limit - 1);
      const { data, error, count } = await query;
      if (error) { console.error(error); toast('তালিকা লোড ব্যর্থ', error.message, 'error'); return; }
      const rows = data || [];
      const groupIds = rows.map(w => w.group_id).filter(Boolean);
      let englishByGroup = {};
      if (groupIds.length) {
        const { data: englishRows, error: englishError } = await supabase.from('posts')
          .select('group_id, title').eq('language', 'en').in('group_id', groupIds);
        if (!englishError) {
          englishByGroup = Object.fromEntries((englishRows || []).map(row => [row.group_id, row.title]));
        }
      }
      state.writings = rows.map(w => ({
        ...w,
        hasEnglish: !!(w.group_id && englishByGroup[w.group_id]),
        englishTitle: w.group_id ? (englishByGroup[w.group_id] || '') : '',
      }));
      state.pagination.total = count || 0;
      state.pagination.totalPages = Math.max(Math.ceil((count || 0) / limit), 1);
    }

          // বাংলা row-কে bilingual pair-এর canonical category ধরি; English row edit করলেও classification এক থাকে।
          category: sibling?.category || main.category,

    // লেখা সংরক্ষণ — দুটি row (bn + en) একই group_id দিয়ে
    async function saveWriting(formData) {
      const now = new Date().toISOString();
      const published = formData.status === 'published';
      const groupId = formData.group_id || (`post-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`);
      const tagsArray = (formData.tags || []).filter(Boolean);
      const commonFields = {
        category: formData.category || null,            // ব্যাকওয়ার্ড-কম্প্যাট
        parent_category: formData.category || null,    // ব্যাকওয়ার্ড-কম্প্যাট
        subcategory: formData.subcategory || null,     // ব্যাকওয়ার্ড-কম্প্যাট
        category_id: formData.category_id || null,    // নতুন FK
        subcategory_id: formData.subcategory_id || null,// নতুন FK
        cover_image: formData.cover_image || null,
        featured: formData.featured || false,
        published,
        published_at: published ? (formData.published_at || now) : null,
        updated_at: now,
        tags: tagsArray,
        group_id: groupId,
      };

      // প্রকাশিত লেখায় বাংলা মূল বিষয়বস্তু অবশ্যই থাকতে হবে।
      if (published && !hasMeaningfulArticleContent(formData.body)) {
        throw new Error('প্রকাশের আগে সম্পূর্ণ বাংলা মূল লেখা দিন। খসড়া হিসেবে অসম্পূর্ণ লেখা সেভ করা যাবে।');
      }

      // Bengali row
      const bnPayload = {
        ...commonFields,
        language: 'bn',
        title: formData.title || '',
        slug: formData.slug || slugify(formData.title),
        excerpt: formData.excerpt || null,
        body: formData.body || '',
      };

      // ইংরেজি শিরোনাম দিলে পূর্ণ ইংরেজি লেখা থাকা আবশ্যক।
      const englishText = String(formData.body_en || '').replace(/<[^>]*>/g, ' ').replace(/&nbsp;/gi, ' ').trim();
      if (published && formData.title_en && formData.title_en.trim() && !englishText) {
        throw new Error('প্রকাশের আগে English title-এর সঙ্গে সম্পূর্ণ English content দিন। খসড়া হিসেবে অসম্পূর্ণ অনুবাদ সেভ করা যাবে।');
      }

      // English row (শুধু যদি title_en থাকে)
      const enPayload = formData.title_en && formData.title_en.trim() ? {
        ...commonFields,
        language: 'en',
        title: formData.title_en,
        slug: formData.slug_en || slugify(formData.title_en),
        excerpt: formData.excerpt_en || null,
        body: formData.body_en || '',
      } : null;

      // Update or insert bn row
      formData.group_id = groupId;
      if (formData.bn_id) {
        const { error } = await supabase.from('posts').update(bnPayload).eq('id', formData.bn_id);
        if (error) throw new Error('বাংলা row আপডেট ব্যর্থ: ' + error.message);
      } else {
        const { data: insertedBn, error } = await supabase.from('posts')
          .insert({ ...bnPayload, created_at: now }).select('id').single();
        if (error) throw new Error('বাংলা row ইনসার্ট ব্যর্থ: ' + error.message);
        formData.bn_id = insertedBn.id;
      }

      // Update or insert en row
      if (enPayload) {
        if (formData.en_id) {
          const { error } = await supabase.from('posts').update(enPayload).eq('id', formData.en_id);
          if (error) throw new Error('English row আপডেট ব্যর্থ: ' + error.message);
        } else {
          const { data: insertedEn, error } = await supabase.from('posts')
            .insert({ ...enPayload, created_at: now }).select('id').single();
          if (error) throw new Error('English row ইনসার্ট ব্যর্থ: ' + error.message);
          formData.en_id = insertedEn.id;
        }
      } else if (formData.en_id) {
        const { error } = await supabase.from('posts').delete().eq('id', formData.en_id);
        if (error) throw new Error('English সংস্করণ মুছতে ব্যর্থ: ' + error.message);
        formData.en_id = null;
      }

      return groupId;
    }

    // ============================================================
    // IMAGE UPLOAD (Supabase Storage — covers bucket)
    // ============================================================
    async function uploadCover(file, language = 'bn') {
      if (file.size > 5 * 1024 * 1024) throw new Error('ফাইল ৫MB এর বেশি');
      if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) throw new Error('শুধু JPG, PNG বা WebP ছবি দিন');
      const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
      const filename = `${Date.now()}-${Math.random().toString(36).slice(2, 10)}.${ext}`;
      const folder = language === 'en' ? COVER_FOLDER_EN : COVER_FOLDER_BN;
      const path = `${folder}/${filename}`;
      const { error } = await supabase.storage.from(STORAGE_BUCKET).upload(path, file, { cacheControl: '3600', upsert: false });
      if (error) throw new Error(error.message);
      const { data } = supabase.storage.from(STORAGE_BUCKET).getPublicUrl(path);
      return data.publicUrl;
    }

    async function uploadInlineImage(file, language = 'bn') {
      if (file.size > 5 * 1024 * 1024) throw new Error('ফাইল ৫MB এর বেশি');

      const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();

    // ============================================================
    // RICH TEXT EDITOR (contentEditable + execCommand)
    // ============================================================
    function createRichEditor(mountEl, opts = {}) {
      const state = {
        value: opts.value || '',
        language: opts.language || 'bn',
        storageKey: opts.storageKey,
        isPreview: false,
        isFullscreen: false,
        lastSavedAt: null,
        history: [],
        historyIdx: -1,
        skipNextHistory: false,
      };

      const shell = el('div', { class: 'editor-shell' });

      // Toolbar
      const toolbar = el('div', { class: 'editor-toolbar' });
      const content = el('div', { class: 'editor-content', contenteditable: 'true', 'data-placeholder': opts.placeholder || 'এখানে লিখুন...' });
      const footer = el('div', { class: 'editor-footer' });
      const wordCount = el('span', {}, 'শব্দ: ০');
      const charCount = el('span', {}, 'অক্ষর: ০');
      const savedLabel = el('span', { class: 'hidden' });
      footer.append(wordCount, el('div', { class: 'flex items-center gap-2' }, savedLabel));

      shell.append(toolbar, el('div', { style: { flex: '1', overflow: 'auto', minHeight: '320px' } }, content), footer);
      mountEl.appendChild(shell);
      content.innerHTML = state.value || '';

      // Helpers
      const exec = (cmd, val) => {
        if (state.isPreview) return;
        content.focus();
        try { document.execCommand(cmd, false, val); } catch {}
        syncContent();
      };

      const syncContent = () => {
        const html = content.innerHTML;
        state.value = html;
        if (opts.onChange) opts.onChange(html);
        if (!state.skipNextHistory) {
          const last = state.history[state.historyIdx];
          if (!last || last !== html) {
            state.history = state.history.slice(0, state.historyIdx + 1);
            state.history.push(html);
            if (state.history.length > 50) state.history = state.history.slice(-50);
            state.historyIdx = state.history.length - 1;
          }
        }
        state.skipNextHistory = false;
        updateCounts();
      };

      const updateCounts = () => {
        const text = content.innerText || '';
        const words = text.trim() ? text.trim().split(/\s+/).length : 0;
        wordCount.textContent = `শব্দ: ${formatNumber(words)}`;
        charCount.textContent = `অক্ষর: ${formatNumber(text.length)}`;
      };

      // Toolbar buttons
      function tbBtn(title, iconSvg, onClick, activeFn) {
        const b = el('button', { class: 'tb-btn', title, type: 'button' });
        b.innerHTML = iconSvg;
        b.addEventListener('mousedown', e => e.preventDefault());
        b.addEventListener('click', () => { onClick(); b.blur(); });
        if (activeFn) b.dataset.activeFn = '1';
        return b;
      }

      function popoverTrigger(label, buildContent) {
        const wrap = el('div', { style: { position: 'relative' } });
        const btn = el('button', { class: 'tb-select', type: 'button' });
        btn.innerHTML = `${label} <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>`;
        const pop = el('div', { class: 'tb-popover hidden' });
        let open = false;
        const toggle = () => {
          open = !open;
          pop.classList.toggle('hidden', !open);
          if (open) {
            $$('.tb-popover').forEach(p => { if (p !== pop) p.classList.add('hidden'); });
            pop.innerHTML = '';
            buildContent(pop);
          }
        };
        btn.addEventListener('mousedown', e => e.preventDefault());
        btn.addEventListener('click', toggle);
        wrap.append(btn, pop);
        return wrap;
      }

      document.addEventListener('mousedown', (e) => {
        if (!e.target.closest('.editor-toolbar')) {
          $$('.tb-popover').forEach(p => p.classList.add('hidden'));
        }
      });

      // Build toolbar
      const ic = (paths) => `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${paths}</svg>`;

      // Undo/Redo
      toolbar.append(tbBtn('Undo (আগের কাজ বাতিল)', ic('<path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6.7 2.7L3 13"/>'), () => {
        if (state.historyIdx > 0) {
          state.historyIdx--;
          state.skipNextHistory = true;
          content.innerHTML = state.history[state.historyIdx];
          if (opts.onChange) opts.onChange(state.history[state.historyIdx]);
          updateCounts();
        }
      }));
      toolbar.append(tbBtn('Redo (ফিরিয়ে আনা)', ic('<path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6.7 2.7L21 13"/>'), () => {
        if (state.historyIdx < state.history.length - 1) {
          state.historyIdx++;
          state.skipNextHistory = true;
          content.innerHTML = state.history[state.historyIdx];
          if (opts.onChange) opts.onChange(state.history[state.historyIdx]);
          updateCounts();
        }
      }));
      toolbar.append(tbBtn('রিভিশন ইতিহাস', ic('<path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="9"/>'), () => {
        const id = state.editingId ? state.editingId.id : null;
        showRevisionHistory(id);
      }));
      toolbar.append(el('div', { class: 'tb-divider' }));

      // Headings

      toolbar.append(tbBtn('H2', ic('<path d="M4 12h16M4 6v12M20 6v12M4 18h8"/>'), () => exec('formatBlock', 'h2')));
      toolbar.append(tbBtn('H3', ic('<path d="M4 6v12M4 12h8M12 6v12"/>'), () => exec('formatBlock', 'h3')));
      toolbar.append(el('div', { class: 'tb-divider' }));

      // Bold/Italic/Underline/Strikethrough

      toolbar.append(tbBtn('ইটালিক', ic('<path d="M19 4h-9M14 20H5M15 4 9 20"/>'), () => exec('italic')));
      toolbar.append(tbBtn('আন্ডারলাইন', ic('<path d="M6 4v6a6 6 0 0 0 12 0V4M4 20h16"/>'), () => exec('underline')));
      toolbar.append(tbBtn('কাটা দাগ (Strikethrough)', ic('<path d="M16 4H9a3 3 0 0 0-2.83 4M14 12a4 4 0 0 1 0 8H6"/><path d="M4 12l16 0"/>'), () => exec('strikeThrough')));
      toolbar.append(el('div', { class: 'tb-divider' }));

      // Font family popover
      const FONTS = [

        { label: 'সিয়াম রূপালী (Siyam Rupali)', value: "'SiyamRupali', sans-serif" },
        { label: 'নোটো সানস বাংলা (Noto Sans Bengali)', value: "'Noto Sans Bengali', sans-serif" },
        { label: 'নোটো সেরিফ বাংলা (Noto Serif Bengali)', value: "'Noto Serif Bengali', serif" },
        { label: 'হিন্দ শিলিগুড়ি (Hind Siliguri)', value: "'Hind Siliguri', sans-serif" },
        { label: 'Arial', value: 'Arial, sans-serif' },

      app.appendChild(wrap);

      let mode = 'login';
      const updateMode = (m) => {
        mode = m;
        $$('.tab-strip button').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
                $('#pw-label').textContent = m === 'reset' ? 'নতুন পাসওয়ার্ড (ইমেইলে রিসেট লিংক যাবে)' : 'পাসওয়ার্ড';
        $('#submit-btn').textContent = m === 'login' ? 'লগইন করুন' : 'রিসেট লিংক পাঠান';
      };
      $$('.tab-strip button').forEach(b => b.addEventListener('click', () => updateMode(b.dataset.mode)));

      $('#login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = $('#submit-btn');
        const origText = btn.textContent;
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner" style="width:14px;height:14px;display:inline-block;vertical-align:middle;margin-right:6px;"></span> অপেক্ষা করুন...';
        const email = $('#login-form [name=email]').value;
        const password = $('#login-form [name=password]').value;
        try {
          if (mode === 'login') {
            const ok = await signIn(email, password);
            if (ok) { toast('স্বাগতম!', 'লগইন সফল', 'success'); await afterAuth(); }
          } else if (mode === 'reset') {
            await resetPassword(email);
            toast('রিসেট লিংক পাঠানো হয়েছে', 'ইমেইল চেক করুন', 'success');

        } catch (err) {
          toast('ত্রুটি', err.message || 'অজানা সমস্যা', 'error');
        } finally {
          btn.disabled = false;
          btn.textContent = origText;
        }
      });
      refreshIcons();
    }

      if (state.view === 'new') renderEditorView(inner);

      refreshIcons();

          formData.en_id = w.en_id || null;
          formData.title = w.title || '';
          formData.slug = w.slug || '';
          formData.excerpt = w.excerpt || '';
          formData.body = w.body || '';
          formData.title_en = w.title_en || '';
          formData.slug_en = w.slug_en || '';
          formData.excerpt_en = w.excerpt_en || '';
          formData.body_en = w.body_en || '';
          formData.category = w.category || '';
          formData.subcategory = w.subcategory || '';
          formData.tags = w.tags || [];
          formData.featured = w.featured || false;
          formData.status = w.published ? 'published' : (w.scheduled_at ? 'scheduled' : 'draft')
        if (w.scheduled_at) { const sa = document.getElementById('scheduled-at'); if (sa) { const d = new Date(w.scheduled_at); sa.value = d.toISOString().slice(0,16); } }
          formData.published_at = w.published_at || null;
          formData.cover_image = w.cover_image || null;
          // Populate UI
          $('#f-title').value = formData.title;
          $('#f-slug').value = formData.slug;
          $('#f-excerpt').value = formData.excerpt;
          $('#f-title-en').value = formData.title_en;
          $('#f-slug-en').value = formData.slug_en;
          $('#f-excerpt-en').value = formData.excerpt_en;
          $('#f-featured').checked = formData.featured;
          // Category — handle legacy data where category might be a subcategory name
          if (w.category_id) {
            // নতুন মাইগ্রেশন হওয়া রো — ID থেকে লোড করি
            const cat = state.categories.find(c => String(c.id) === String(w.category_id));
            if (cat) {
              formData.category = cat.name;

              formData.category_slug = cat.slug;
              formData.subcategory_id = w.subcategory_id || null;
              if (w.subcategory_id) {
                const sub = (cat.subs || []).find(s => String(s.id) === String(w.subcategory_id));
                if (sub) formData.subcategory = sub.name;
              }
            }
          } else if (formData.category) {
            // লিগেসি: পুরোনো টেক্সট category — findCategoryByName দিয়ে resolve করি
            const lookup = findCategoryByName(formData.category);
            if (lookup) {
              if (lookup.sub) {
                formData.category = lookup.parent.name;
                formData.category_id = lookup.parent.id || null;
                formData.category_slug = lookup.parent.slug || null;
                formData.subcategory = lookup.sub.name;
                formData.subcategory_id = lookup.sub.id || null;
              } else {
                formData.category_id = lookup.parent.id || null;
                formData.category_slug = lookup.parent.slug || null;
                formData.subcategory = w.subcategory || '';

          }
          if (formData.category) {

      const save = async (status) => {
        if (!formData.title.trim()) {

        if (!formData.slug.trim()) formData.slug = slugify(formData.title);

        if (status === 'published' && !hasMeaningfulArticleContent(formData.body)) {

          state.activeTab = 'bn';
          return;
        }
        const btn = status === 'published' ? $('#publish-btn') : $('#save-draft-btn');
        const orig = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner" style="width:14px;height:14px;display:inline-block;vertical-align:middle;margin-right:6px;"></span> সেভ হচ্ছে...';
        try {
          formData.status = status;
          await saveWriting(formData);
          toast(status === 'published' ? 'প্রকাশিত হয়েছে' : 'খসড়া সংরক্ষিত', `"${formData.title}" সফলভাবে সেভ হয়েছে`, 'success');
          state.view = 'list';
          state.editingId = null;
          await loadWritings();
          renderApp();
        } catch (e) {
          toast('সংরক্ষণ ব্যর্থ', e.message, 'error');
        } finally {
          btn.disabled = false;
          btn.innerHTML = orig;
          refreshIcons();
        }
      };
      $('#save-draft-btn').addEventListener('click', () => save('draft'));
      $('#publish-btn').addEventListener('click', () => save('published'));

      // Notify Subscribers — calls publish-notification Edge Function
      const notifyBtn = $('#notify-btn');
      if (notifyBtn) {
        notifyBtn.addEventListener('click', async () => {
          if (!state.editingId || !state.editingId.id) {
            toast('ত্রুটি', 'প্রথমে লেখা সংরক্ষণ করুন।', 'error');
            return;
          }
          if (!confirm('নিশ্চিত করুন: সকল নিশ্চিতকৃত সাবস্ক্রাইবারকে এই লেখার বিজ্ঞপ্তি পাঠাতে চান?')) return;
          notifyBtn.disabled = true;
          const origText = notifyBtn.innerHTML;
          notifyBtn.innerHTML = '<span class="spinner" style="width:14px;height:14px;display:inline-block;vertical-align:middle;margin-right:6px;"></span> পাঠানো হচ্ছে...';
          try {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) throw new Error('সেশন নেই — আবার লগইন করুন।');
            const resp = await fetch(SUPABASE_URL + '/functions/v1/publish-notification', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + session.access_token
              },
              body: JSON.stringify({ post_id: state.editingId.id })
            });
            const result = await resp.json();
            if (resp.ok) {
              toast('বিজ্ঞপ্তি পাঠানো হয়েছে', `${result.sent || 0} জনকে ইমেইল পাঠানো হয়েছে${result.failed ? ', ' + result.failed + 'টি ব্যর্থ' : ''}।`, 'success');
            } else {
              throw new Error(result.error || 'বিজ্ঞপ্তি ব্যর্থ');
            }
          } catch (e) {
            toast('বিজ্ঞপ্তি ব্যর্থ', e.message, 'error');
          } finally {
            notifyBtn.disabled = false;
            notifyBtn.innerHTML = origText;
            refreshIcons();
          }
        });
      }

      refreshIcons();
    }

    // ============================================================

    async function renderListView(mount) {
      mount.appendChild(el('div', { class: 'flex justify-between items-center gap-2 mb-4 flex-wrap' },

          el('h2', { class: 'page-title bn-font' }, 'আমার লেখাসমূহ'),

        ),
        el('button', { class: 'btn btn-primary', onclick: () => { state.view = 'new'; state.editingId = null; renderApp(); } },
          icon('plus'), 'নতুন লেখা')

      // Filters
      const filters = el('div', { class: 'flex gap-2 mb-4 flex-wrap' },
        el('div', { style: { position: 'relative', flex: 1, minWidth: '240px' } },
          el('input', { class: 'input', placeholder: 'শিরোনাম দিয়ে খুঁজুন...', id: 'search-input', value: state.filter.search })
        ),
        el('select', { class: 'select', id: 'status-filter', style: { width: 'auto' } },
          el('option', { value: 'all' }, 'সব'),
          el('option', { value: 'draft' }, 'খসড়া'),
          el('option', { value: 'scheduled' }, 'নির্ধারিত'),
          el('option', { value: 'published' }, 'প্রকাশিত')
        )
      );
      const listHost = el('div', { class: 'flex flex-col gap-2', id: 'list-host' });
      listHost.appendChild(el('div', { class: 'flex items-center justify-center', style: { padding: '40px' } }, el('div', { class: 'spinner' })));
      mount.append(filters, listHost);

      // Filter handlers
      let searchTimer = null;
      $('#search-input').addEventListener('input', (e) => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(async () => {
          state.filter.search = e.target.value;
          state.pagination.page = 1;
          await loadWritings();
          renderListItems();
        }, 250);
      });
      $('#status-filter').value = state.filter.status;
      $('#status-filter').addEventListener('change', async (e) => {
        state.filter.status = e.target.value;
        state.pagination.page = 1;
        await loadWritings();
        renderListItems();
      });

      await loadWritings();
      renderListItems();
      refreshIcons();
    }

    function renderListItems() {
      const host = $('#list-host');
      $('#count-text').textContent = `মোট ${formatNumber(state.pagination.total)} টি লেখা`;
      host.innerHTML = '';
      if (state.writings.length === 0) {
        host.appendChild(el('div', { class: 'text-center', style: { padding: '64px', border: '2px dashed var(--border)', borderRadius: 'var(--radius)' } },
          icon('file-text'),
          el('p', { class: 'text-muted mt-2' }, 'কোনো লেখা পাওয়া যায়নি'),
          el('button', { class: 'btn btn-primary mt-2', onclick: () => { state.view = 'new'; state.editingId = null; renderApp(); } },
            icon('plus'), 'প্রথম লেখা লিখুন')
        ));
        refreshIcons();
        return;
      }
      state.writings.forEach(w => {
        const item = el('div', { class: 'writing-item' });
        const thumb = el('div', { class: 'thumb' },
          w.cover_image ? el('img', { src: w.cover_image, alt: '' }) : icon('file-text'));
        const info = el('div', { class: 'info' },
          el('div', { class: 'flex items-center gap-2 flex-wrap' },
            el('h3', { class: 'title bn-font truncate', style: { flex: 1, minWidth: 0 } }, w.title),
            w.featured && el('span', { class: 'badge badge-default' }, '★ ফিচার্ড'),
            el('span', { class: `badge ${w.hasEnglish ? 'badge-info' : ''}`, title: w.hasEnglish ? (w.englishTitle || 'English translation added') : 'English translation not added' },
              w.hasEnglish ? 'বাংলা + EN' : 'শুধু বাংলা'),
            el('span', {
              class: `badge ${w.published ? 'badge-default' : 'badge-warning'}`,
              style: { cursor: 'pointer' },
              title: 'স্ট্যাটাস পরিবর্তন করতে ক্লিক করুন',
              onclick: async () => {
                try { await toggleWritingStatus(w); await loadWritings(); renderListItems(); toast('স্ট্যাটাস পরিবর্তিত'); }
                catch (e) { toast('ত্রুটি', e.message, 'error'); }
              }
            }, w.scheduled_at && !w.published ? 'নির্ধারিত' : (w.published ? 'প্রকাশিত' : 'খসড়া')),
            w.language === 'en' && el('span', { class: 'badge' }, 'EN')
          ),
          w.tags && w.tags.length > 0 && el('p', { class: 'text-xs text-muted truncate' },
            icon('tag'), ' ' + w.tags.slice(0, 4).join(', ') + (w.tags.length > 4 ? ` +${w.tags.length - 4}` : '')),
          el('div', { class: 'meta' },
            getWritingCategoryLabels(w).parent && el('span', {}, icon('folder'), getWritingCategoryLabels(w).parent),
            getWritingCategoryLabels(w).sub && el('span', { class: 'text-xs text-muted' }, '↳ ' + getWritingCategoryLabels(w).sub),
            el('span', {}, icon('calendar'), formatDate(w.updated_at))
          )
        );
        const actions = el('div', { class: 'flex gap-1', style: { flexShrink: 0 } },
          el('button', { class: 'btn btn-ghost btn-sm btn-icon', title: 'সম্পাদনা',
            onclick: () => { state.editingId = w.id; state.view = 'new'; renderApp(); }
          }, icon('pencil')),
          el('button', { class: 'btn btn-ghost btn-sm btn-icon', title: 'মুছুন',
            onclick: async () => {
              if (!confirm('এই লেখাটি মুছে ফেলবেন? (বাংলা ও English দুটি ভার্সনই মুছে যাবে)')) return;
              try { await deleteWriting(w); await loadWritings(); renderListItems(); toast('লেখা মুছে ফেলা হয়েছে'); }
              catch (e) { toast('ত্রুটি', e.message, 'error'); }
            }
          }, icon('trash-2'))
        );
        item.append(thumb, info, actions);
        host.appendChild(item);
      });

      // Pagination
      if (state.pagination.totalPages > 1) {
        const pag = el('div', { class: 'flex justify-between items-center mt-2' },
          el('p', { class: 'text-xs text-muted' }, `পৃষ্ঠা ${formatNumber(state.pagination.page)} / ${formatNumber(state.pagination.totalPages)}`),
          el('div', { class: 'flex gap-1' },
            el('button', { class: 'btn btn-sm btn-icon', disabled: state.pagination.page <= 1,
              onclick: async () => { state.pagination.page--; await loadWritings(); renderListItems(); }
            }, icon('chevron-left')),
            el('button', { class: 'btn btn-sm btn-icon', disabled: state.pagination.page >= state.pagination.totalPages,
              onclick: async () => { state.pagination.page++; await loadWritings(); renderListItems(); }
            }, icon('chevron-right'))
          )
        );
        host.appendChild(pag);
      }
      refreshIcons();
    }

    // ============================================================
    // VIEW: Stats
    // ============================================================
    async function renderStatsView(mount) {
      mount.appendChild(el('h2', { class: 'page-title bn-font', style: { margin: '0 0 4px' } }, 'পরিসংখ্যান'));
      mount.appendChild(el('p', { class: 'page-subtitle mb-4' }, 'আপনার লেখার সারসংক্ষেপ'));
      const spinnerWrap = el('div', { class: 'flex items-center justify-center', style: { padding: '40px' } }, el('div', { class: 'spinner' }));
      mount.appendChild(spinnerWrap);
      try {
        const stats = await loadStats();
        spinnerWrap.remove();

        const cards = [
          { label: 'Total Views', value: stats.totalViews, icon: 'eye', cls: 'badge-default' },
          { label: 'Published', value: stats.published, icon: 'check-circle-2', cls: 'badge-default' },
          { label: 'Followers', value: stats.followers, icon: 'users', cls: 'badge-default' },
          { label: 'মোট লেখা (বাংলা)', value: stats.total, icon: 'file-text', cls: 'badge-default' },
          { label: 'মোট লেখা (English)', value: stats.totalEn, icon: 'languages', cls: 'badge-default' },
          { label: 'খসড়া', value: stats.drafts, icon: 'file-edit', cls: 'badge-warning' },
        ];
        const cardsGrid = el('div', { class: 'grid grid-4 mb-4', style: { gridTemplateColumns: 'repeat(auto-fit, minmax(190px, 1fr))' } });
        cards.forEach((c, index) => {
          cardsGrid.appendChild(el('div', { class: `card stats-card stats-card-${index}` },
            el('div', { class: 'flex items-center justify-between' },
              el('div', {},
                el('p', { class: 'text-xs text-muted' }, c.label),
                el('p', { style: { fontSize: '24px', fontWeight: 700, marginTop: '4px' } }, formatNumber(c.value))
              ),
              el('div', { class: `badge ${c.cls}`, style: { width: '36px', height: '36px', borderRadius: '8px' } }, icon(c.icon))
            )
          ));
        });
        mount.appendChild(cardsGrid);

        // Total featured
        mount.appendChild(el('div', { class: 'card mb-4 stats-featured-card' },
          el('div', { class: 'flex items-center justify-between' },
            el('div', {},
              el('p', { class: 'text-xs text-muted' }, 'ফিচার্ড লেখা'),
              el('p', { style: { fontSize: '24px', fontWeight: 700, marginTop: '4px' } }, formatNumber(stats.featured))),
            el('div', { class: 'badge badge-default', style: { width: '36px', height: '36px', borderRadius: '8px' } }, icon('star'))
          )
        ));

        // Most-read and recent writings are separate, properly structured sections.
        const readingCard = el('div', { class: 'card mb-4' },
          el('h3', { class: 'card-h' }, 'সর্বাধিক পঠিত'),
          el('div', { id: 'most-read-list', style: { marginBottom: '8px' } })
        );
        mount.appendChild(readingCard);
        loadMostRead();

        const recentCard = el('div', { class: 'card' },
          el('h3', { class: 'card-h' }, 'সাম্প্রতিক লেখা')
        );
        if (!stats.recent || stats.recent.length === 0) {
          recentCard.appendChild(el('p', { class: 'text-sm text-muted' }, 'এখনো কোনো লেখা নেই'));
        } else {
          stats.recent.forEach(w => {
            const thumb = w.cover_image
              ? el('img', { src: w.cover_image, alt: w.title || '', loading: 'lazy', style: { width: '76px', height: '58px', objectFit: 'cover', borderRadius: '6px', flex: '0 0 76px' } })
              : el('div', { style: { width: '76px', height: '58px', display: 'grid', placeItems: 'center', background: 'var(--muted)', borderRadius: '6px', flex: '0 0 76px' } }, '❦');
            const title = el('p', { class: 'text-sm bn-font', style: { fontWeight: 700, lineHeight: 1.5, margin: 0 } }, w.title || '(শিরোনামহীন)');
            const meta = el('p', { class: 'text-xs text-muted', style: { margin: '4px 0 0' } },
              (w.category || '') + ' · ' + formatDate(w.updated_at));
            const info = el('div', { style: { minWidth: 0, flex: 1 } }, title, meta);
            const row = el('div', { class: 'flex items-center gap-3', style: { padding: '10px 0', borderBottom: '1px solid var(--border)' } },
              thumb, info,
              el('span', { class: `badge ${w.published ? 'badge-default' : 'badge-warning'}` }, w.published ? 'প্রকাশিত' : 'খসড়া')
            );
            recentCard.appendChild(row);
          });
        }
        mount.appendChild(recentCard);
      } catch (e) {
        spinnerWrap.remove();
        mount.appendChild(el('div', { class: 'card' }, el('p', { class: 'text-destructive' }, 'ত্রুটি: ' + e.message)));
      }
      refreshIcons();
    }

    // ============================================================
    // After auth — load initial data and render
    // ============================================================
    async function afterAuth() {
      state.loading = true;
      renderApp();
      await Promise.all([loadCategories(), loadTags()]);
      state.loading = false;
      renderApp();
    }

    // ============================================================
    // INIT
    // ============================================================
    async function init() {
      applyTheme(state.theme);
      if (!initSupabase()) {
        renderConfigError();
        return;
      }
      // Show loading
      $('#app').innerHTML = '<div class="min-h-screen flex items-center justify-center"><div class="flex flex-col items-center gap-3"><div class="spinner"></div><p class="text-muted text-sm">লোড হচ্ছে...</p></div></div>';
      const ok = await checkSession();
      if (ok) {
        await loadCategories();
        await loadTags();
      }
      renderApp();

      // Listen to auth state changes
      supabase.auth.onAuthStateChange(async (event, session) => {
        if (event === 'SIGNED_OUT') {
          state.session = null; state.user = null;
          renderApp();
        } else if (event === 'SIGNED_IN' && session && !state.session) {
          state.session = session; state.user = session.user; state.userEmail = session.user.email;
          await afterAuth();
        }
      });
    }

    // Boot
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
