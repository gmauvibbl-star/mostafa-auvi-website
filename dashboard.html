    /* ============================================================

    :root {

    * { box-sizing: border-box; }

    /* ============================================================
       Buttons
       ============================================================ */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 14px; border-radius: var(--radius); border: 1px solid var(--border);
      background: var(--card); color: var(--fg); cursor: pointer;
      font-family: inherit; font-size: 13px; font-weight: 500;
      transition: all .15s; line-height: 1.3;
    }
    .btn:hover:not(:disabled) { background: var(--muted); border-color: var(--border-strong); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary {
      background: var(--primary); color: var(--primary-fg);
      border-color: var(--primary);
    }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-destructive { background: var(--destructive); color: #fff; border-color: var(--destructive); }

    /* ============================================================
       Inputs
       ============================================================ */
    .input, .textarea, .select {
      width: 100%; padding: 7px 11px; border-radius: var(--radius);

    }

    .textarea { resize: vertical; min-height: 70px; }

    .label .req { color: var(--destructive); }
    .label-hint { font-size: 11px; color: var(--muted-fg); font-weight: 400; }

    /* ============================================================
       Cards & panels
       ============================================================ */

      border-radius: var(--radius-lg); padding: 18px; box-shadow: var(--shadow);

        for (const s of (p.subs || [])) {
          if (s.name === name || s.slug === name) return { parent: p, sub: s };
        }
      }
      return null;
    }
    function findCategoryById(catId, subId) {
      const cats = state.categories && state.categories.length ? state.categories : CATEGORIES;
      const parent = cats.find(c => c.id == catId || c.slug == catId);
      if (!parent) return null;
      const sub = subId ? (parent.subs || []).find(s => s.id == subId) : null;
      return { parent, sub };
    }

    // ============================================================
    // Utilities
    // ============================================================
    function $(selector, root = document) { return root.querySelector(selector); }
    function $$(selector, root = document) { return Array.from(root.querySelectorAll(selector)); }
    function el(tag, props = {}, ...children) {
      const e = document.createElement(tag);
      Object.entries(props).forEach(([k, v]) => {
        if (k === 'class') e.className = v;
        else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
        else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2).toLowerCase(), v);
        else if (k === 'html') e.innerHTML = v;
        else if (v !== null && v !== undefined && v !== false) e.setAttribute(k, v);
      });
      children.flat().forEach(c => {
        if (c == null || c === false) return;
        if (typeof c === 'string' || typeof c === 'number') e.appendChild(document.createTextNode(String(c)));
        else e.appendChild(c);
      });
      return e;
    }
    function icon(name, props = {}) {
      const i = document.createElement('i');
      i.setAttribute('data-lucide', name);
      Object.entries(props).forEach(([k, v]) => i.setAttribute(k, v));
      return i;
    }
    function refreshIcons() { if (window.lucide) lucide.createIcons(); }

    function slugify(text) {
      return (text || '').trim().toLowerCase()
        .replace(/[\s\u0964\u0965।]+/g, '-')
        .replace(/[^\u0980-\u09FFa-z0-9-]/g, '')
        .replace(/-+/g, '-')
        .replace(/^-|-$/g, '');
    }
    function formatDate(iso) {
      try { return new Date(iso).toLocaleDateString('bn-BD'); } catch { return ''; }
    }
    function formatNumber(n) {
      try { return Number(n).toLocaleString('bn-BD'); } catch { return String(n); }
    }
    function toast(title, desc = '', type = 'info', duration = 3500) {
      const host = $('#toast-host');
      const t = el('div', { class: `toast ${type}` },
        el('div', { class: 't-title' }, title),
        desc && el('div', { class: 't-desc' }, desc)
      );
      host.appendChild(t);
      setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .2s'; setTimeout(() => t.remove(), 200); }, duration);
    }

    // Theme
    function applyTheme(theme) {

    let supabase = null;
    function initSupabase() {
      if (!SUPABASE_URL || !SUPABASE_KEY || SUPABASE_URL === 'YOUR_SUPABASE_URL') {
        return false;
      }
      try {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {

    // ============================================================
    // AUTH
    // ============================================================
    async function checkSession() {
      if (!supabase) return false;
      const { data, error } = await supabase.auth.getSession();
      if (error || !data.session) return false;
      state.session = data.session;
      state.user = data.session.user;
      state.userEmail = data.session.user.email;
      // Verify admin
      const { data: adminRec } = await supabase.from('admin_users').select('user_id').eq('user_id', state.user.id).maybeSingle();
      if (!adminRec) {
        toast('অ্যাক্সেস নেই', 'এই অ্যাকাউন্ট লেখক ড্যাশবোর্ড ব্যবহার করতে পারবে না। প্রথমে admin_users টেবিলে যোগ করুন।', 'error', 6000);
        await supabase.auth.signOut();
        return false;
      }
      return true;
    }

    async function signIn(email, password) {
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) throw new Error(error.message);
      return checkSession();
    }

    async function signUp(email, password) {
      const { data, error } = await supabase.auth.signUp({ email, password });
      if (error) throw new Error(error.message);
      if (data.user && !data.session) {
        throw new Error('ইমেইল ভেরিফিকেশন প্রয়োজন। ইমেইল চেক করুন।');
      }
      if (data.user) {
        await supabase.from('admin_users').insert({ user_id: data.user.id });
      }
      return checkSession();
    }

    async function resetPassword(email) {
      const { error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.href,
      });
      if (error) throw new Error(error.message);

    async function signOut() {

    // ============================================================
    // CATEGORIES — Supabase থেকে লোড (fallback: hardcoded)
    // ============================================================
    async function loadCategories() {
      if (!supabase) {
        state.categories = CATEGORIES;
        return Promise.resolve();
      }
      try {
        const [{ data: cats, error: catErr }, { data: subs, error: subErr }] = await Promise.all([
          supabase.from('categories').select('id,name_bn,name_en,slug,icon,sort_order,is_active').eq('is_active', true).order('sort_order'),
          supabase.from('subcategories').select('id,category_id,name_bn,name_en,slug,sort_order,is_active').eq('is_active', true).order('sort_order'),
        ]);
        if (catErr || subErr) throw (catErr || subErr);
        if (!cats || cats.length === 0) {
          state.categories = CATEGORIES;
          return Promise.resolve();
        }
        const subByCat = {};
        (subs || []).forEach(s => {
          if (!subByCat[s.category_id]) subByCat[s.category_id] = [];
          subByCat[s.category_id].push(s);
        });
        state.categories = cats.map(c => ({
          id: c.id,
          name: c.name_bn,
          nameEn: c.name_en,
          slug: c.slug,
          icon: c.icon,
          sort_order: c.sort_order,
          is_active: c.is_active,
          subs: (subByCat[c.id] || []).map(s => ({
            id: s.id,
            name: s.name_bn,
            nameEn: s.name_en,
            slug: s.slug,
            sort_order: s.sort_order,
          })),
        }));
      } catch (e) {
        console.warn('loadCategories: Supabase থেকে লোড ব্যর্থ, hardcoded fallback', e);
        state.categories = CATEGORIES;
      }
      return Promise.resolve();
    }
    function getParentCategories() { return state.categories; }
    function getSubcategories(parentName) {
      const parent = state.categories.find(c => c.name === parentName);
      return parent && parent.subs ? parent.subs : [];
    }

    // TAGS
    // ============================================================
    async function loadTags() {
      const { data, error } = await supabase.from('posts').select('tags');
      if (error || !data) { state.tags = []; return; }
      const tagSet = new Set();
      data.forEach(p => { (p.tags || []).forEach(t => tagSet.add(t)); });

    // ============================================================
    // WRITINGS CRUD — bilingual = দুটি row (group_id দিয়ে যুক্ত)
    // ============================================================
    async function loadWritings() {
      const page = state.pagination.page;
      const limit = state.pagination.limit;
      let query = supabase.from('posts')
        .select('id, title, slug, group_id, language, category, cover_image, published, featured, updated_at, tags', { count: 'exact' });
      if (state.filter.status === 'draft') query = query.eq('published', false);
      else if (state.filter.status === 'published') query = query.eq('published', true);
      if (state.filter.search) {
        query = query.ilike('title', `%${state.filter.search}%`);
      }
      query = query.order('updated_at', { ascending: false }).range((page - 1) * limit, page * limit - 1);
      const { data, error, count } = await query;
      if (error) { console.error(error); toast('তালিকা লোড ব্যর্থ', error.message, 'error'); return; }
      state.writings = data || [];
      state.pagination.total = count || 0;
      state.pagination.totalPages = Math.max(Math.ceil((count || 0) / limit), 1);
    }

    // লেখা সংরক্ষণ — দুটি row (bn + en) একই group_id দিয়ে
    async function saveWriting(formData) {
      const now = new Date().toISOString();
      const published = formData.status === 'published';
      const groupId = formData.group_id || (`post-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`);
      const tagsArray = (formData.tags || []).filter(Boolean);
      const commonFields = {
        category: formData.category || null,            // ব্যাকওয়ার্ড-কম্প্যাট
        parent_category: formData.category || null,    // ব্যাকওয়ার্ড-কম্প্যাট
        subcategory: formData.subcategory || null,     // ব্যাকওয়ার্ড-কম্প্যাট
        category_id: formData.category_id || null,    // নতুন FK
        subcategory_id: formData.subcategory_id || null,// নতুন FK
        cover_image: formData.cover_image || null,
        featured: formData.featured || false,
        published,
        published_at: published ? now : null,
        updated_at: now,
        tags: tagsArray,
        group_id: groupId,
      };

      // Bengali row
      const bnPayload = {
        ...commonFields,
        language: 'bn',
        title: formData.title || '',
        slug: formData.slug || slugify(formData.title),
        excerpt: formData.excerpt || null,
        body: formData.body || '',
      };

      // English row (শুধু যদি title_en থাকে)
      const enPayload = formData.title_en && formData.title_en.trim() ? {
        ...commonFields,
        language: 'en',
        title: formData.title_en,
        slug: formData.slug_en || slugify(formData.title_en),
        excerpt: formData.excerpt_en || null,
        body: formData.body_en || '',
      } : null;

      // Update or insert bn row
      if (formData.bn_id) {
        const { error } = await supabase.from('posts').update(bnPayload).eq('id', formData.bn_id);
        if (error) throw new Error('বাংলা row আপডেট ব্যর্থ: ' + error.message);
      } else {
        const { error } = await supabase.from('posts').insert({ ...bnPayload, created_at: now });
        if (error) throw new Error('বাংলা row ইনসার্ট ব্যর্থ: ' + error.message);
      }

      // Update or insert en row
      if (enPayload) {
        if (formData.en_id) {
          const { error } = await supabase.from('posts').update(enPayload).eq('id', formData.en_id);
          if (error) throw new Error('English row আপডেট ব্যর্থ: ' + error.message);
        } else {
          const { error } = await supabase.from('posts').insert({ ...enPayload, created_at: now });
          if (error) throw new Error('English row ইনসার্ট ব্যর্থ: ' + error.message);
        }
      } else if (formData.en_id) {
        const { error } = await supabase.from('posts').delete().eq('id', formData.en_id);
        if (error) console.error('English row delete error', error);
      }

      return groupId;
    }

    // লেখা মুছুন — group_id দিয়ে দুটি row মুছবে

    // স্ট্যাটাস toggle — group_id দিয়ে দুটি row

      }
    }

    // ============================================================
    // IMAGE UPLOAD (Supabase Storage — post-images bucket)
    // ============================================================
    async function uploadCover(file, language = 'bn') {
      if (file.size > 5 * 1024 * 1024) throw new Error('ফাইল ৫MB এর বেশি');
      if (!file.type.startsWith('image/')) throw new Error('শুধু ছবি ফাইল দিন');
      const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
      const filename = `${Date.now()}-${Math.random().toString(36).slice(2, 10)}.${ext}`;
      const folder = language === 'en' ? COVER_FOLDER_EN : COVER_FOLDER_BN;
      const path = `${folder}/${filename}`;
      const { error } = await supabase.storage.from(STORAGE_BUCKET).upload(path, file, { cacheControl: '3600', upsert: false });
      if (error) throw new Error(error.message);
      const { data } = supabase.storage.from(STORAGE_BUCKET).getPublicUrl(path);
      return data.publicUrl;
    }

    async function uploadInlineImage(file, language = 'bn') {

    // ============================================================
    // RICH TEXT EDITOR (contentEditable + execCommand)
    // ============================================================
    function createRichEditor(mountEl, opts = {}) {
      const state = {
        value: opts.value || '',
        language: opts.language || 'bn',
        storageKey: opts.storageKey,
        isPreview: false,
        isFullscreen: false,
        lastSavedAt: null,
        history: [],
        historyIdx: -1,
        skipNextHistory: false,
      };

      const shell = el('div', { class: 'editor-shell' });

      // Toolbar
      const toolbar = el('div', { class: 'editor-toolbar' });
      const content = el('div', { class: 'editor-content', contenteditable: 'true', 'data-placeholder': opts.placeholder || 'এখানে লিখুন...' });
      const footer = el('div', { class: 'editor-footer' });
      const wordCount = el('span', {}, 'শব্দ: ০');
      const charCount = el('span', {}, 'অক্ষর: ০');
      const savedLabel = el('span', { class: 'hidden' });
      footer.append(wordCount, el('div', { class: 'flex items-center gap-2' }, savedLabel));

      shell.append(toolbar, el('div', { style: { flex: '1', overflow: 'auto', minHeight: '320px' } }, content), footer);
      mountEl.appendChild(shell);
      content.innerHTML = state.value || '';

      // Helpers
      const exec = (cmd, val) => {
        if (state.isPreview) return;
        content.focus();
        try { document.execCommand(cmd, false, val); } catch {}
        syncContent();
      };

      const syncContent = () => {
        const html = content.innerHTML;
        state.value = html;
        if (opts.onChange) opts.onChange(html);
        if (!state.skipNextHistory) {
          const last = state.history[state.historyIdx];
          if (!last || last !== html) {
            state.history = state.history.slice(0, state.historyIdx + 1);
            state.history.push(html);
            if (state.history.length > 50) state.history = state.history.slice(-50);
            state.historyIdx = state.history.length - 1;
          }
        }
        state.skipNextHistory = false;
        updateCounts();
      };

      const updateCounts = () => {
        const text = content.innerText || '';
        const words = text.trim() ? text.trim().split(/\s+/).length : 0;
        wordCount.textContent = `শব্দ: ${formatNumber(words)}`;
        charCount.textContent = `অক্ষর: ${formatNumber(text.length)}`;
      };

      // Toolbar buttons
      function tbBtn(title, iconSvg, onClick, activeFn) {
        const b = el('button', { class: 'tb-btn', title, type: 'button' });
        b.innerHTML = iconSvg;
        b.addEventListener('mousedown', e => e.preventDefault());
        b.addEventListener('click', () => { onClick(); b.blur(); });
        if (activeFn) b.dataset.activeFn = '1';
        return b;
      }

      function popoverTrigger(label, buildContent) {
        const wrap = el('div', { style: { position: 'relative' } });
        const btn = el('button', { class: 'tb-select', type: 'button' });
        btn.innerHTML = `${label} <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>`;
        const pop = el('div', { class: 'tb-popover hidden' });
        let open = false;
        const toggle = () => {
          open = !open;
          pop.classList.toggle('hidden', !open);
          if (open) {
            $$('.tb-popover').forEach(p => { if (p !== pop) p.classList.add('hidden'); });
            pop.innerHTML = '';
            buildContent(pop);
          }
        };
        btn.addEventListener('mousedown', e => e.preventDefault());
        btn.addEventListener('click', toggle);
        wrap.append(btn, pop);
        return wrap;
      }

      document.addEventListener('mousedown', (e) => {
        if (!e.target.closest('.editor-toolbar')) {
          $$('.tb-popover').forEach(p => p.classList.add('hidden'));
        }
      });

      // Build toolbar
      const ic = (paths) => `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${paths}</svg>`;

      // Undo/Redo
      toolbar.append(tbBtn('Undo (আগের কাজ বাতিল)', ic('<path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6.7 2.7L3 13"/>'), () => {

    // ============================================================
    // RENDERING — Dashboard shell
    // ============================================================
    function renderApp() {
      applyTheme(state.theme);
      const app = $('#app');
      app.innerHTML = '';

      if (!state.session) { renderLogin(); return; }

      // Breadcrumb text based on current view
      const crumbText = state.view === 'new'
        ? (state.editingId ? 'লেখা সম্পাদনা' : 'নতুন লেখা')
        : state.view === 'list' ? 'আমার লেখাসমূহ'
        : state.view === 'categories' ? 'ক্যাটাগরি ব্যবস্থাপনা'
        : 'পরিসংখ্যান';

      const topbar = el('div', { class: 'topbar' });
      const topbarLeft = el('div', { class: 'topbar-left' });
      const menuBtn = el('button', { class: 'btn btn-ghost btn-icon mobile-only', title: 'মেনু' }, icon('menu'));
      menuBtn.addEventListener('click', () => $('.sidebar').classList.toggle('open'));
      const breadcrumb = el('div', { class: 'breadcrumb' },
        el('span', {}, 'হোম'),
        el('span', { class: 'sep' }, '/'),
        el('span', { class: 'sep' }, 'লেখা'),
        el('span', { class: 'sep' }, '/'),
        el('span', { class: 'current bn-font' }, crumbText)
      );
      topbarLeft.append(menuBtn, breadcrumb);

      // Top right: theme toggle + options dropdown + user
      const topbarRight = el('div', { class: 'topbar-right' });
      const themeBtn = el('button', { class: 'btn btn-ghost btn-icon', title: 'থিম পরিবর্তন' },
        icon(state.theme === 'dark' ? 'sun' : 'moon'));
      themeBtn.addEventListener('click', () => {
        applyTheme(state.theme === 'dark' ? 'light' : 'dark');
        renderApp();
      });

      // Options dropdown
      const optionsWrap = el('div', { class: 'options-menu' });
      const optionsBtn = el('button', { class: 'btn btn-ghost', title: 'অপশন', type: 'button' },
        icon('settings'), el('span', { class: 'hidden md:inline' }, 'অপশন'),
        icon('chevron-down')
      );
      let optionsOpen = false;
      const optionsDropdown = el('div', { class: 'options-dropdown hidden' });
      const toggleOptions = (e) => {
        e.stopPropagation();
        optionsOpen = !optionsOpen;
        optionsDropdown.classList.toggle('hidden', !optionsOpen);
      };
      optionsBtn.addEventListener('click', toggleOptions);
      document.addEventListener('click', () => {
        if (optionsOpen) { optionsOpen = false; optionsDropdown.classList.add('hidden'); }
      });
      const optThemeLight = el('button', { type: 'button' }, icon('sun'), 'লাইট মোড');
      optThemeLight.addEventListener('click', () => { applyTheme('light'); renderApp(); });
      const optThemeDark = el('button', { type: 'button' }, icon('moon'), 'ডার্ক মোড');
      optThemeDark.addEventListener('click', () => { applyTheme('dark'); renderApp(); });
      const optStats = el('button', { type: 'button' }, icon('bar-chart-3'), 'পরিসংখ্যান');
      optStats.addEventListener('click', () => { state.view = 'stats'; renderApp(); });
      const optLogout = el('button', { type: 'button' }, icon('log-out'), 'লগআউট');
      optLogout.addEventListener('click', signOut);
      optionsDropdown.append(optThemeLight, optThemeDark, el('div', { class: 'options-divider' }),
        optStats, el('div', { class: 'options-divider' }), optLogout);
      optionsWrap.append(optionsBtn, optionsDropdown);

      // User avatar

          el('div', { class: 'sub' }, 'Author Dashboard')

      const sidebarScroll = el('div', { class: 'sidebar-scroll' });

      // RETURN section — external navigation back to the public site

        const a = el('a', {

          title: item.label,
        }, icon(item.icon), el('span', {}, item.label));
        returnSection.appendChild(a);
      });

      // MAIN section
      const mainSection = el('div', { class: 'sidebar-section' });
      mainSection.appendChild(el('div', { class: 'sidebar-section-title' }, 'Main'));
      const mainNav = [
        { id: 'stats', label: 'ড্যাশবোর্ড', icon: 'layout-dashboard' },
        { id: 'new', label: 'নতুন লেখা', icon: 'file-plus' },
        { id: 'list', label: 'আমার লেখাসমূহ', icon: 'list-ordered' },
      ];
      mainNav.forEach(item => {
        const isActive = state.view === item.id || (item.id === 'new' && state.view === 'new');
        const btn = el('button', { class: `nav-item bn-font ${isActive ? 'active' : ''}`, type: 'button' },
          icon(item.icon),
          el('span', {}, item.label)

        btn.addEventListener('click', () => {
          state.view = item.id;
          if (item.id === 'new') state.editingId = null;
          renderApp();
        });
        mainSection.appendChild(btn);
      });

      // SITE DATA section — ক্যাটাগরি ম্যানেজমেন্ট এখন সক্রিয়
      const siteSection = el('div', { class: 'sidebar-section' });
      siteSection.appendChild(el('div', { class: 'sidebar-section-title' }, 'Site Data'));
      const siteNav = [
        { label: 'ক্যাটাগরি', icon: 'folder-tree', action: 'categories', enabled: true },
        { label: 'ট্যাগ', icon: 'tag', action: null, enabled: false },
        { label: 'মিডিয়া লাইব্রেরি', icon: 'image', action: null, enabled: false },

      siteNav.forEach(item => {
        const btn = el('button', {
          class: 'nav-item bn-font' + (state.view === item.action ? ' active' : ''),
          type: 'button',
          disabled: !item.enabled,
          style: item.enabled ? {} : { opacity: '0.5', cursor: 'not-allowed' }
        },
          icon(item.icon),
          el('span', {}, item.label)
        );
        if (item.enabled && item.action) {
          btn.addEventListener('click', () => {
            state.view = item.action;
            state.editingId = null;
            renderApp();
          });
        } else {
          btn.title = 'শীঘ্রই আসছে';
        }
        siteSection.appendChild(btn);
      });

      // EXTRA section
      const extraSection = el('div', { class: 'sidebar-section' });
      extraSection.appendChild(el('div', { class: 'sidebar-section-title' }, 'Extra'));

        { label: 'সেটিংস', icon: 'settings' },
        { label: 'প্রোফাইল', icon: 'user' },
      ];
      extraNav.forEach(item => {
        const btn = el('button', { class: 'nav-item bn-font', type: 'button', disabled: true, style: { opacity: '0.5', cursor: 'not-allowed' } },
          icon(item.icon),
          el('span', {}, item.label)
        );
        btn.title = 'শীঘ্রই আসছে';
        extraSection.appendChild(btn);
      });

      sidebarScroll.append(returnSection, mainSection, siteSection, extraSection);

      // Footer — user card + logout
      const sidebarFooter = el('div', { class: 'sidebar-footer' },
        el('div', { class: 'avatar' }, (state.userEmail || 'A').slice(0, 2).toUpperCase()),
        el('div', { class: 'info' },
          el('div', { class: 'name bn-font truncate' }, state.userEmail || ''),
          el('div', { class: 'email truncate' }, 'লেখক')
        ),
        (() => {
          const b = el('button', { class: 'logout-btn', title: 'লগআউট' }, icon('log-out'));
          b.addEventListener('click', signOut);
          return b;
        })()
      );

      sidebar.append(brand, sidebarScroll, sidebarFooter);

      // Main content area
      const main = el('main', { class: 'main' });
      const inner = el('div', { class: 'main-inner' });

      layout.append(sidebar, main);
      main.appendChild(inner);
      app.append(topbar, layout);

      // Render active view
      if (state.view === 'new') renderEditorView(inner);
      else if (state.view === 'list') renderListView(inner);
      else if (state.view === 'stats') renderStatsView(inner);
      else if (state.view === 'categories') renderCategoriesView(inner);

      refreshIcons();
    }

        <p class="text-muted text-sm mb-2">ট্যাগ লিখে Enter চাপুন। একাধিক ট্যাগ যোগ করতে পারেন।</p>
      `;
      const tagInputWrap = el('div', { class: 'tag-input-wrap' });
      const tagInput = el('input', { type: 'text', placeholder: 'ট্যাগ লিখুন, Enter চাপুন...' });
      tagInputWrap.appendChild(tagInput);
      const renderTags = () => {
        tagInputWrap.querySelectorAll('.tag-chip').forEach(c => c.remove());
        formData.tags.forEach(t => {
          const chip = el('span', { class: 'tag-chip bn-font' }, t,
            el('button', { type: 'button' }, icon('x')));
          chip.querySelector('button').addEventListener('click', () => {
            formData.tags = formData.tags.filter(x => x !== t);
            renderTags();
          });
          tagInputWrap.insertBefore(chip, tagInput);
        });
      };
      tagInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ',') {
          e.preventDefault();
          const v = tagInput.value.trim();
          if (v && !formData.tags.includes(v)) {
            formData.tags.push(v);
            tagInput.value = '';
            renderTags();
          }
        } else if (e.key === 'Backspace' && !tagInput.value && formData.tags.length > 0) {
          formData.tags.pop();
          renderTags();
        }
      });
      tagsCard.appendChild(tagInputWrap);
      tagsTab.append(catCard, tagsCard);

      // ===== SEO SETTINGS TAB CONTENT =====
      const seoTab = el('div', { class: activeTopTab === 'seo' ? '' : 'hidden' });
      const seoCard = el('div', { class: 'card' });
      seoCard.innerHTML = `
        <h3 class="card-h"><i data-lucide="settings-2" style="width:14px;height:14px;"></i> প্রকাশনা ও SEO অপশন</h3>

        <div class="flex items-center justify-between mb-4">
          <label class="flex items-center gap-2" style="cursor:pointer">
            <i data-lucide="star" style="width:16px;height:16px;color:#D97706;"></i>
            <div>
              <div class="text-sm">ফিচার্ড লেখা</div>
              <div class="text-xs text-muted">হোমপেজে হাইলাইটেড দেখাবে</div>
            </div>
          </label>
          <label class="switch"><input type="checkbox" id="f-featured"><span class="slider"></span></label>
        </div>

        <div class="flex items-center justify-between mb-4">
          <div class="flex items-center gap-2">
            <i data-lucide="eye" style="width:16px;height:16px;"></i>
            <div>
              <div class="text-sm">বর্তমান স্ট্যাটাস</div>
              <div class="text-xs text-muted" id="status-text">খসড়া</div>
            </div>
          </div>
          <span class="badge badge-warning" id="status-badge">খসড়া</span>
        </div>

        <div class="options-divider" style="height:1px;background:var(--border);margin:14px 0;"></div>

        <div class="mb-2">
          <label class="label">বাংলা স্লাগ (URL)</label>
          <input class="input" id="f-seo-slug-bn" placeholder="বাংলা-স্লাগ" readonly />
          <p class="text-xs text-muted mt-1">এই লেখার বাংলা ভার্সনের URL।</p>
        </div>

        <div class="mb-2">
          <label class="label">English Slug (URL)</label>
          <input class="input" id="f-seo-slug-en" placeholder="english-slug" readonly />
          <p class="text-xs text-muted mt-1">English ভার্সনের URL।</p>
        </div>

        <div class="mt-4 p-3" style="background:var(--card-cream);border-radius:var(--radius);font-size:12px;color:var(--muted-fg);">
          <strong style="color:var(--fg);">💡 টিপ:</strong> স্লাগ স্বয়ংক্রিয়ভাবে শিরোনাম থেকে তৈরি হয়। ম্যানুয়ালি পরিবর্তন করতে "বিষয়বস্তু" ট্যাবে যান।
        </div>
      `;
      seoTab.appendChild(seoCard);

      // ===== Assemble tabs =====
      tabContent.append(topicTab, photosTab, tagsTab, seoTab);
      mount.append(header, tabsBar, tabContent);

      // Top tab switching
      tabsBar.querySelectorAll('.tab-btn').forEach(b => {
        b.addEventListener('click', () => {
          activeTopTab = b.dataset.tab;
          topicTab.classList.toggle('hidden', activeTopTab !== 'topic');
          photosTab.classList.toggle('hidden', activeTopTab !== 'photos');
          tagsTab.classList.toggle('hidden', activeTopTab !== 'tags');
          seoTab.classList.toggle('hidden', activeTopTab !== 'seo');
          tabsBar.querySelectorAll('.tab-btn').forEach(x => x.classList.toggle('active', x === b));
        });
      });

      // Populate categories — নতুন: value = slug, data-id = id
      const catSel = $('#f-category');
      getParentCategories().forEach(c => {
        const opt = el('option', { value: c.name }, `${c.icon ? c.icon + ' ' : ''}${c.name} / ${c.nameEn}`);
        if (c.id) opt.dataset.id = c.id;
        if (c.slug) opt.dataset.slug = c.slug;
        catSel.appendChild(opt);
      });
      catSel.addEventListener('change', () => {
        formData.category = catSel.value;
        formData.subcategory = '';
        const selOpt = catSel.options[catSel.selectedIndex];
        formData.category_id = selOpt && selOpt.dataset.id ? selOpt.dataset.id : null;
        formData.category_slug = selOpt && selOpt.dataset.slug ? selOpt.dataset.slug : null;
        formData.subcategory_id = null;
        const subWrap = $('#subcat-wrap');
        const subSel = $('#f-sub-category');
        subSel.innerHTML = '<option value="">-- ঐচ্ছিক --</option>';
        if (catSel.value) {
          const subs = getSubcategories(catSel.value);
          if (subs.length > 0) {
            subs.forEach(s => {
              const sopt = el('option', { value: s.name }, `${s.name} / ${s.nameEn}`);
              if (s.id) sopt.dataset.id = s.id;
              if (s.slug) sopt.dataset.slug = s.slug;
              subSel.appendChild(sopt);
            });
            subWrap.style.display = 'block';
          } else {
            subWrap.style.display = 'none';
          }
        } else {
          subWrap.style.display = 'none';
        }
        updateCatBadge();
      });
      $('#f-sub-category').addEventListener('change', (e) => {
        formData.subcategory = e.target.value;
        const selOpt = e.target.options[e.target.selectedIndex];
        formData.subcategory_id = selOpt && selOpt.dataset.id ? selOpt.dataset.id : null;
        updateCatBadge();
      });
      function updateCatBadge() {
        const badge = $('#cat-badge');
        badge.innerHTML = '';
        if (formData.category) {
          const cat = state.categories.find(c => c.name === formData.category);
          if (cat) {
            const parts = [`${cat.name} / ${cat.nameEn}`];
            if (formData.subcategory) {
              const sub = (cat.subs || []).find(s => s.name === formData.subcategory);
              if (sub) parts.push(`${sub.name} / ${sub.nameEn}`);
            }
            badge.appendChild(el('div', { class: 'flex flex-col gap-1' },
              el('span', { class: 'badge badge-default bn-font' }, parts[0]),
              parts[1] ? el('span', { class: 'badge bn-font', style: { background: 'var(--accent-soft)', color: 'var(--accent)' } }, '↳ ' + parts[1]) : null
            ));
          }
        }
      }

      // Cover upload
      coverUploader.addEventListener('click', () => coverInput.click());
      coverInput.addEventListener('change', async () => {
        const f = coverInput.files?.[0];
        if (!f) return;
        try {
          toast('আপলোড হচ্ছে...', '', 'info', 1500);
          const lang = state.activeTab;
          const url = await uploadCover(f, lang);
          formData.cover_image = url;
          coverUploader.classList.add('has-image');
          coverUploader.innerHTML = `<img src="${url}" alt="Cover" />`;
        } catch (e) { toast('আপলোড ব্যর্থ', e.message, 'error'); }
        coverInput.value = '';
      });

      // Featured switch
      $('#f-featured').addEventListener('change', (e) => { formData.featured = e.target.checked; });

      // Title -> slug auto
      $('#f-title').addEventListener('input', (e) => {
        formData.title = e.target.value;
        if (!formData.slug || formData.slug === slugify(formData.title)) {
          formData.slug = slugify(e.target.value);
          $('#f-slug').value = formData.slug;
        }
      });
      $('#f-slug').addEventListener('input', (e) => { formData.slug = e.target.value; });
      $('#f-excerpt').addEventListener('input', (e) => { formData.excerpt = e.target.value; });
      $('#f-title-en').addEventListener('input', (e) => {
        formData.title_en = e.target.value;
        if (!formData.slug_en || formData.slug_en === slugify(formData.title_en)) {
          formData.slug_en = slugify(e.target.value);
          $('#f-slug-en').value = formData.slug_en;
        }
      });
      $('#f-slug-en').addEventListener('input', (e) => { formData.slug_en = e.target.value; });
      $('#f-excerpt-en').addEventListener('input', (e) => { formData.excerpt_en = e.target.value; });

      // Init rich text editors
      let bnEd = null, enEd = null;
      const initEditors = () => {
        bnEd = createRichEditor($('#bn-editor-mount'), {
          language: 'bn',
          value: formData.body,
          storageKey: `draft-bn-${state.editingId || 'new'}`,
          placeholder: 'এখানে আপনার বাংলা লেখা লিখুন...',
          onChange: (html) => { formData.body = html; },
        });
        enEd = createRichEditor($('#en-editor-mount'), {
          language: 'en',
          value: formData.body_en,
          storageKey: `draft-en-${state.editingId || 'new'}`,
          placeholder: 'Write your English content here...',
          onChange: (html) => { formData.body_en = html; },
        });
      };

      // Load editing data
      if (state.editingId) {
        mount.appendChild(el('div', { class: 'flex items-center justify-center', style: { padding: '40px' } },
          el('div', { class: 'spinner' })));
        try {
          const w = await loadWritingForEdit(state.editingId);
          formData.group_id = w.group_id || null;
          formData.bn_id = w.bn_id || null;
          formData.en_id = w.en_id || null;
          formData.title = w.title || '';
          formData.slug = w.slug || '';
          formData.excerpt = w.excerpt || '';
          formData.body = w.body || '';
          formData.title_en = w.title_en || '';
          formData.slug_en = w.slug_en || '';
          formData.excerpt_en = w.excerpt_en || '';
          formData.body_en = w.body_en || '';
          formData.category = w.category || '';
          formData.subcategory = w.subcategory || '';
          formData.tags = w.tags || [];
          formData.featured = w.featured || false;
          formData.status = w.published ? 'published' : 'draft';
          formData.cover_image = w.cover_image || null;
          // Populate UI
          $('#f-title').value = formData.title;
          $('#f-slug').value = formData.slug;
          $('#f-excerpt').value = formData.excerpt;
          $('#f-title-en').value = formData.title_en;
          $('#f-slug-en').value = formData.slug_en;
          $('#f-excerpt-en').value = formData.excerpt_en;
          $('#f-featured').checked = formData.featured;
          // Category — handle legacy data where category might be a subcategory name
          if (w.category_id) {
            // নতুন মাইগ্রেশন হওয়া রো — ID থেকে লোড করি
            const cat = state.categories.find(c => String(c.id) === String(w.category_id));
            if (cat) {
              formData.category = cat.name;
              formData.category_id = cat.id;
              formData.category_slug = cat.slug;
              formData.subcategory_id = w.subcategory_id || null;
              if (w.subcategory_id) {
                const sub = (cat.subs || []).find(s => String(s.id) === String(w.subcategory_id));
                if (sub) formData.subcategory = sub.name;
              }
            }
          } else if (formData.category) {
            // লিগেসি: পুরোনো টেক্সট category — findCategoryByName দিয়ে resolve করি
            const lookup = findCategoryByName(formData.category);
            if (lookup) {
              if (lookup.sub) {
                formData.category = lookup.parent.name;
                formData.category_id = lookup.parent.id || null;
                formData.category_slug = lookup.parent.slug || null;
                formData.subcategory = lookup.sub.name;
                formData.subcategory_id = lookup.sub.id || null;
              } else {
                formData.category_id = lookup.parent.id || null;
                formData.category_slug = lookup.parent.slug || null;
                formData.subcategory = w.subcategory || '';
              }
            }
          }
          if (formData.category) {
            catSel.value = formData.category;
            catSel.dispatchEvent(new Event('change'));
            if (formData.subcategory) {
              $('#f-sub-category').value = formData.subcategory;
            }
            updateCatBadge();
          }
          // Cover
          if (formData.cover_image) {
            coverUploader.classList.add('has-image');
            coverUploader.innerHTML = `<img src="${formData.cover_image}" alt="Cover" />`;
          }
          // Status
          $('#status-text').textContent = formData.status === 'published' ? 'প্রকাশিত' : 'খসড়া';
          const sb = $('#status-badge');
          sb.textContent = formData.status === 'published' ? 'প্রকাশিত' : 'খসড়া';
          sb.className = `badge ${formData.status === 'published' ? 'badge-default' : 'badge-warning'}`;
          renderTags();
        } catch (e) {
          toast('লেখা লোড ব্যর্থ', e.message, 'error');
        }
        mount.lastChild.remove();
      }
      initEditors();

      // Save / Publish
      const save = async (status) => {
        if (!formData.title.trim()) {
          toast('ত্রুটি', 'বাংলা শিরোনাম দিন', 'error');
          state.activeTab = 'bn';
          renderApp();
          return;
        }
        if (!formData.slug.trim()) formData.slug = slugify(formData.title);
        if (!formData.category) {
          toast('ত্রুটি', 'ক্যাটাগরি নির্বাচন করুন', 'error');
          return;
        }
        const btn = status === 'published' ? $('#publish-btn') : $('#save-draft-btn');
        const orig = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner" style="width:14px;height:14px;display:inline-block;vertical-align:middle;margin-right:6px;"></span> সেভ হচ্ছে...';
        try {
          formData.status = status;
          await saveWriting(formData);
          toast(status === 'published' ? 'প্রকাশিত হয়েছে' : 'খসড়া সংরক্ষিত', `"${formData.title}" সফলভাবে সেভ হয়েছে`, 'success');
          state.view = 'list';
          state.editingId = null;
          await loadWritings();
          renderApp();
        } catch (e) {
          toast('সংরক্ষণ ব্যর্থ', e.message, 'error');
        } finally {
          btn.disabled = false;
          btn.innerHTML = orig;
          refreshIcons();
        }
      };
      $('#save-draft-btn').addEventListener('click', () => save('draft'));
      $('#publish-btn').addEventListener('click', () => save('published'));

      refreshIcons();
    }

    // ============================================================
    // VIEW: Writings List
    // ============================================================
    async function renderListView(mount) {
      mount.appendChild(el('div', { class: 'flex justify-between items-center gap-2 mb-4 flex-wrap' },
        el('div', {},
          el('h2', { class: 'page-title bn-font' }, 'আমার লেখাসমূহ'),
          el('p', { class: 'page-subtitle', id: 'count-text' }, 'লোড হচ্ছে...')
        ),
        el('button', { class: 'btn btn-primary', onclick: () => { state.view = 'new'; state.editingId = null; renderApp(); } },
          icon('plus'), 'নতুন লেখা')
      ));

      // Filters
      const filters = el('div', { class: 'flex gap-2 mb-4 flex-wrap' },
        el('div', { style: { position: 'relative', flex: 1, minWidth: '240px' } },
          el('input', { class: 'input', placeholder: 'শিরোনাম দিয়ে খুঁজুন...', id: 'search-input', value: state.filter.search })
        ),
        el('select', { class: 'select', id: 'status-filter', style: { width: 'auto' } },
          el('option', { value: 'all' }, 'সব'),
          el('option', { value: 'draft' }, 'খসড়া'),
          el('option', { value: 'published' }, 'প্রকাশিত')
        )
      );
      const listHost = el('div', { class: 'flex flex-col gap-2', id: 'list-host' });
      listHost.appendChild(el('div', { class: 'flex items-center justify-center', style: { padding: '40px' } }, el('div', { class: 'spinner' })));
      mount.append(filters, listHost);

      // Filter handlers
      let searchTimer = null;
      $('#search-input').addEventListener('input', (e) => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(async () => {
          state.filter.search = e.target.value;
          state.pagination.page = 1;
          await loadWritings();
          renderListItems();
        }, 250);
      });
      $('#status-filter').value = state.filter.status;
      $('#status-filter').addEventListener('change', async (e) => {
        state.filter.status = e.target.value;
        state.pagination.page = 1;
        await loadWritings();
        renderListItems();
      });

      await loadWritings();
      renderListItems();
      refreshIcons();
    }

    function renderListItems() {
      const host = $('#list-host');
      $('#count-text').textContent = `মোট ${formatNumber(state.pagination.total)} টি লেখা`;
      host.innerHTML = '';
      if (state.writings.length === 0) {
        host.appendChild(el('div', { class: 'text-center', style: { padding: '64px', border: '2px dashed var(--border)', borderRadius: 'var(--radius)' } },
          icon('file-text'),
          el('p', { class: 'text-muted mt-2' }, 'কোনো লেখা পাওয়া যায়নি'),
          el('button', { class: 'btn btn-primary mt-2', onclick: () => { state.view = 'new'; state.editingId = null; renderApp(); } },
            icon('plus'), 'প্রথম লেখা লিখুন')
        ));
        refreshIcons();
        return;
      }
      state.writings.forEach(w => {
        const item = el('div', { class: 'writing-item' });
        const thumb = el('div', { class: 'thumb' },
          w.cover_image ? el('img', { src: w.cover_image, alt: '' }) : icon('file-text'));
        const info = el('div', { class: 'info' },
          el('div', { class: 'flex items-center gap-2 flex-wrap' },
            el('h3', { class: 'title bn-font truncate', style: { flex: 1, minWidth: 0 } }, w.title),
            w.featured && el('span', { class: 'badge badge-default' }, '★ ফিচার্ড'),
            el('span', {
              class: `badge ${w.published ? 'badge-default' : 'badge-warning'}`,
              style: { cursor: 'pointer' },
              title: 'স্ট্যাটাস পরিবর্তন করতে ক্লিক করুন',
              onclick: async () => {
                try { await toggleWritingStatus(w); await loadWritings(); renderListItems(); toast('স্ট্যাটাস পরিবর্তিত'); }
                catch (e) { toast('ত্রুটি', e.message, 'error'); }
              }
            }, w.published ? 'প্রকাশিত' : 'খসড়া'),
            w.language === 'en' && el('span', { class: 'badge' }, 'EN')
          ),
          w.tags && w.tags.length > 0 && el('p', { class: 'text-xs text-muted truncate' },
            icon('tag'), ' ' + w.tags.slice(0, 4).join(', ') + (w.tags.length > 4 ? ` +${w.tags.length - 4}` : '')),
          el('div', { class: 'meta' },
            w.category && el('span', {}, icon('file-text'), w.category),
            el('span', {}, icon('calendar'), formatDate(w.updated_at))
          )
        );
        const actions = el('div', { class: 'flex gap-1', style: { flexShrink: 0 } },
          el('button', { class: 'btn btn-ghost btn-sm btn-icon', title: 'সম্পাদনা',
            onclick: () => { state.editingId = w.id; state.view = 'new'; renderApp(); }
          }, icon('pencil')),
          el('button', { class: 'btn btn-ghost btn-sm btn-icon', title: 'মুছুন',
            onclick: async () => {
              if (!confirm('এই লেখাটি মুছে ফেলবেন? (বাংলা ও English দুটি ভার্সনই মুছে যাবে)')) return;
              try { await deleteWriting(w); await loadWritings(); renderListItems(); toast('লেখা মুছে ফেলা হয়েছে'); }
              catch (e) { toast('ত্রুটি', e.message, 'error'); }
            }
          }, icon('trash-2'))
        );
        item.append(thumb, info, actions);
        host.appendChild(item);
      });

      // Pagination
      if (state.pagination.totalPages > 1) {
        const pag = el('div', { class: 'flex justify-between items-center mt-2' },
          el('p', { class: 'text-xs text-muted' }, `পৃষ্ঠা ${formatNumber(state.pagination.page)} / ${formatNumber(state.pagination.totalPages)}`),
          el('div', { class: 'flex gap-1' },
            el('button', { class: 'btn btn-sm btn-icon', disabled: state.pagination.page <= 1,
              onclick: async () => { state.pagination.page--; await loadWritings(); renderListItems(); }
            }, icon('chevron-left')),
            el('button', { class: 'btn btn-sm btn-icon', disabled: state.pagination.page >= state.pagination.totalPages,
              onclick: async () => { state.pagination.page++; await loadWritings(); renderListItems(); }
            }, icon('chevron-right'))
          )
        );
        host.appendChild(pag);
      }
      refreshIcons();
    }

    // ============================================================
    // VIEW: Stats
    // ============================================================
    async function renderStatsView(mount) {
      mount.appendChild(el('h2', { class: 'page-title bn-font', style: { margin: '0 0 4px' } }, 'পরিসংখ্যান'));
      mount.appendChild(el('p', { class: 'page-subtitle mb-4' }, 'আপনার লেখার সারসংক্ষেপ'));
      const spinnerWrap = el('div', { class: 'flex items-center justify-center', style: { padding: '40px' } }, el('div', { class: 'spinner' }));
      mount.appendChild(spinnerWrap);
      try {
        const stats = await loadStats();
        spinnerWrap.remove();

        const cards = [
          { label: 'Total Views', value: stats.totalViews, icon: 'eye', cls: 'badge-default' },
          { label: 'Published', value: stats.published, icon: 'check-circle-2', cls: 'badge-default' },
          { label: 'Followers', value: stats.followers, icon: 'users', cls: 'badge-default' },
          { label: 'মোট লেখা (বাংলা)', value: stats.total, icon: 'file-text', cls: 'badge-default' },
          { label: 'মোট লেখা (English)', value: stats.totalEn, icon: 'languages', cls: 'badge-default' },
          { label: 'খসড়া', value: stats.drafts, icon: 'file-edit', cls: 'badge-warning' },
        ];
        const cardsGrid = el('div', { class: 'grid grid-4 mb-4', style: { gridTemplateColumns: 'repeat(auto-fit, minmax(190px, 1fr))' } });
        cards.forEach((c, index) => {
          cardsGrid.appendChild(el('div', { class: `card stats-card stats-card-${index}` },
            el('div', { class: 'flex items-center justify-between' },
              el('div', {},
                el('p', { class: 'text-xs text-muted' }, c.label),
                el('p', { style: { fontSize: '24px', fontWeight: 700, marginTop: '4px' } }, formatNumber(c.value))
              ),
              el('div', { class: `badge ${c.cls}`, style: { width: '36px', height: '36px', borderRadius: '8px' } }, icon(c.icon))
            )
          ));
        });
        mount.appendChild(cardsGrid);

        // Total featured
        mount.appendChild(el('div', { class: 'card mb-4 stats-featured-card' },
          el('div', { class: 'flex items-center justify-between' },
            el('div', {},
              el('p', { class: 'text-xs text-muted' }, 'ফিচার্ড লেখা'),
              el('p', { style: { fontSize: '24px', fontWeight: 700, marginTop: '4px' } }, formatNumber(stats.featured))),
            el('div', { class: 'badge badge-default', style: { width: '36px', height: '36px', borderRadius: '8px' } }, icon('star'))
          )
        ));

        // Recent
        const recentCard = el('div', { class: 'card' },
          el('h3', { class: 'card-h' }, 'সাম্প্রতিক লেখা')
        );
        if (stats.recent.length === 0) {
          recentCard.appendChild(el('p', { class: 'text-sm text-muted' }, 'এখনো কোনো লেখা নেই'));
        } else {
          stats.recent.forEach(w => {
            const row = el('div', { class: 'flex items-center justify-between gap-2', style: { padding: '8px 0', borderBottom: '1px solid var(--border)' } },
              el('div', { style: { minWidth: 0, flex: 1 } },
                el('p', { class: 'text-sm bn-font truncate' }, w.title),
                el('p', { class: 'text-xs text-muted' },
                  (w.category || '') + ' · ' + formatDate(w.updated_at))
              ),
              el('span', { class: `badge ${w.published ? 'badge-default' : 'badge-warning'}` },
                w.published ? 'প্রকাশিত' : 'খসড়া')
            );
            recentCard.appendChild(row);
          });
        }
        mount.appendChild(recentCard);
      } catch (e) {
        spinnerWrap.remove();
        mount.appendChild(el('div', { class: 'card' }, el('p', { class: 'text-destructive' }, 'ত্রুটি: ' + e.message)));
      }
      refreshIcons();
    }

    // ============================================================
    // VIEW: Categories Management — অ্যাডমিন CRUD
    // ============================================================
    async function renderCategoriesView(mount) {
      // শুধু অ্যাডমিন ইউজার এখানে প্রবেশ করতে পারবে (RLS সার্ভারে এনফোর্স হয়)
      if (!state.session || !state.user) {
        mount.appendChild(el('div', { class: 'card' }, el('p', {}, 'এই পেজ দেখতে লগইন আবশ্যক।')));
        return;
      }

      mount.innerHTML = '';
      const wrap = el('div', { class: 'categories-view', style: { padding: '1rem' } });
      mount.appendChild(wrap);

      // Header
      const header = el('div', { class: 'flex items-center justify-between mb-4' });
      header.append(
        el('div', {},
          el('h2', { class: 'bn-font', style: { fontSize: '1.5rem', fontWeight: 600 } }, 'ক্যাটাগরি ব্যবস্থাপনা'),
          el('p', { class: 'text-sm text-muted bn-font' }, '৭টি প্রধান বিভাগ ও তাদের উপবিভাগ পরিচালনা করুন')
        ),
        el('button', { class: 'btn btn-primary', id: 'cat-add-btn' }, icon('plus'), el('span', { class: 'bn-font' }, 'নতুন বিভাগ'))
      );
      wrap.append(header);

      // তালিকা কন্টেইনার
      const list = el('div', { id: 'cat-list' });
      wrap.append(list);

      // লোডিং বার্তা
      list.append(el('p', { class: 'text-muted bn-font' }, 'ক্যাটাগরি লোড হচ্ছে...'));

      // ক্যাটাগরি লোড করি (admin-only কল)
      try {
        const [{ data: cats, error: catErr }, { data: subs, error: subErr }] = await Promise.all([
          supabase.from('categories').select('*').order('sort_order'),
          supabase.from('subcategories').select('*').order('sort_order'),
        ]);
        if (catErr || subErr) throw (catErr || subErr);

        const subByCat = {};
        (subs || []).forEach(s => {
          if (!subByCat[s.category_id]) subByCat[s.category_id] = [];
          subByCat[s.category_id].push(s);
        });

        list.innerHTML = '';

        if (!cats || cats.length === 0) {
          list.append(el('div', { class: 'card' }, el('p', { class: 'bn-font text-muted' }, 'কোনো ক্যাটাগরি পাওয়া যায়নি। উপরের "নতুন বিভাগ" বাটনে ক্লিক করে প্রথম ক্যাটাগরি তৈরি করুন।')));
          refreshIcons();
          return;
        }

        // প্রতিটি ক্যাটাগরি রেন্ডার করি
        cats.forEach((cat, idx) => {
          const catBox = el('div', { class: 'card', style: { marginBottom: '0.75rem', borderLeft: `4px solid var(--accent)` } });
          const catHead = el('div', { class: 'flex items-center justify-between', style: { flexWrap: 'wrap', gap: '0.5rem' } });
          catHead.append(
            el('div', { class: 'flex items-center gap-2', style: { flex: '1 1 auto' } },
              el('span', { style: { fontSize: '1.5rem' } }, cat.icon || '📁'),
              el('div', {},
                el('div', { class: 'bn-font', style: { fontWeight: 600 } }, cat.name_bn + ' / ' + cat.name_en),
                el('div', { class: 'text-xs text-muted bn-font' },
                  'slug: ' + cat.slug + ' · ক্রম: ' + cat.sort_order + ' · ' + (cat.is_active ? 'সক্রিয়' : 'নিষ্ক্রিয়')
                )
              )
            ),
            el('div', { class: 'flex gap-1', style: { flex: '0 0 auto', flexWrap: 'wrap' } },
              el('button', { class: 'btn btn-ghost', 'data-act': 'addsub', 'data-id': cat.id }, icon('plus'), 'সাব-ক্যাটাগরি'),
              el('button', { class: 'btn btn-ghost', 'data-act': 'edit',    'data-id': cat.id }, icon('pencil')),
              el('button', { class: 'btn btn-ghost', 'data-act': 'toggle',  'data-id': cat.id }, icon(cat.is_active ? 'eye-off' : 'eye')),
              el('button', { class: 'btn btn-ghost', 'data-act': 'up',      'data-id': cat.id, 'data-order': cat.sort_order }, icon('arrow-up')),
              el('button', { class: 'btn btn-ghost', 'data-act': 'down',    'data-id': cat.id, 'data-order': cat.sort_order }, icon('arrow-down')),
              el('button', { class: 'btn btn-ghost', 'data-act': 'del',     'data-id': cat.id, 'data-name': cat.name_bn, style: { color: 'var(--destructive)' } }, icon('trash-2'))
            )
          );
          catBox.append(catHead);

          // সাব-ক্যাটাগরি তালিকা
          const subList = subByCat[cat.id] || [];
          if (subList.length > 0) {
            const subWrap = el('div', { style: { marginTop: '0.5rem', paddingLeft: '2.5rem' } });
            subList.forEach((s, sidx) => {
              const subRow = el('div', { class: 'flex items-center justify-between', style: { padding: '0.25rem 0', borderBottom: '1px dashed var(--border)' } });
              subRow.append(
                el('div', { class: 'flex items-center gap-2' },
                  el('span', { style: { fontSize: '0.75rem', opacity: 0.6 } }, String(sidx + 1) + '.'),
                  el('span', { class: 'bn-font' }, s.name_bn + ' / ' + s.name_en),
                  !s.is_active && el('span', { class: 'badge', style: { background: '#f0f0f0', fontSize: '0.7rem' } }, 'নিষ্ক্রিয়')
                ),
                el('div', { class: 'flex gap-1' },
                  el('button', { class: 'btn btn-ghost btn-sm', 'data-act': 'editsub', 'data-id': s.id }, icon('pencil')),
                  el('button', { class: 'btn btn-ghost btn-sm', 'data-act': 'togglesub', 'data-id': s.id }, icon(s.is_active ? 'eye-off' : 'eye')),
                  el('button', { class: 'btn btn-ghost btn-sm', 'data-act': 'delsub', 'data-id': s.id, 'data-name': s.name_bn, style: { color: 'var(--destructive)' } }, icon('trash-2'))
                )
              );
              subWrap.append(subRow);
            });
            catBox.append(subWrap);
          } else {
            catBox.append(el('p', { class: 'text-xs text-muted bn-font', style: { paddingLeft: '2.5rem', marginTop: '0.25rem' } }, 'এই বিভাগের অধীনে এখনো কোনো উপবিভাগ নেই।'));
          }

          list.append(catBox);
        });

        // ইবেন্ট হ্যান্ডলার বাইন্ড করি (event delegation)
        list.querySelectorAll('button[data-act]').forEach(b => {
          b.addEventListener('click', handleCatAction);
        });

      } catch (e) {
        list.innerHTML = '';
        list.append(el('div', { class: 'card' }, el('p', { class: 'text-destructive bn-font' }, 'ত্রুটি: ' + (e.message || e))));
      }
      refreshIcons();

      // "নতুন বিভাগ" বাটন
      const addBtn = $('#cat-add-btn');
      if (addBtn) addBtn.addEventListener('click', () => openCategoryModal(null));

      // ============================================================
      // ক্যাটাগরি মোডাল (নতুন/সম্পাদনা)
      // ============================================================
      async function openCategoryModal(existing) {
        const modalId = 'cat-modal-' + Date.now();
        const overlay = el('div', { id: modalId, class: 'modal-overlay', style: {
          position: 'fixed', inset: '0', background: 'rgba(0,0,0,0.5)', display: 'flex',
          alignItems: 'center', justifyContent: 'center', zIndex: 1000
        }});
        const dialog = el('div', { class: 'card', style: { width: '90%', maxWidth: '480px', maxHeight: '90vh', overflow: 'auto', padding: '1.5rem' } });
        overlay.append(dialog);

        dialog.innerHTML = `
          <h3 class="bn-font" style="margin-bottom:1rem;font-size:1.25rem;">${existing ? 'বিভাগ সম্পাদনা' : 'নতুন বিভাগ'}</h3>
          <div class="form-grid" style="display:grid;gap:0.75rem;">
            <div>
              <label class="label bn-font">বাংলা নাম *</label>
              <input class="input bn-font" id="m-cat-bn" value="${existing ? esc(existing.name_bn) : ''}" placeholder="যেমন: কথাসাহিত্য" />
            </div>
            <div>
              <label class="label">English Name *</label>
              <input class="input" id="m-cat-en" value="${existing ? esc(existing.name_en) : ''}" placeholder="e.g. Fiction" />
            </div>
            <div>
              <label class="label bn-font">Slug (URL) *</label>
              <input class="input" id="m-cat-slug" value="${existing ? esc(existing.slug) : ''}" placeholder="kothasahitya" />
            </div>
            <div class="grid-2" style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;">
              <div>
                <label class="label bn-font">আইকন</label>
                <input class="input" id="m-cat-icon" value="${existing ? esc(existing.icon || '') : ''}" placeholder="❦" maxlength="4" />
              </div>
              <div>
                <label class="label bn-font">ক্রম</label>
                <input class="input" id="m-cat-order" type="number" value="${existing ? existing.sort_order : (state.categories.length + 1)}" />
              </div>
            </div>
            <label class="flex items-center gap-2 bn-font">
              <input type="checkbox" id="m-cat-active" ${(!existing || existing.is_active) ? 'checked' : ''} />
              সক্রিয়
            </label>
          </div>
          <div class="flex gap-2 mt-4 justify-end">
            <button class="btn" id="m-cat-cancel">বাতিল</button>
            <button class="btn btn-primary" id="m-cat-save">${existing ? 'আপডেট' : 'তৈরি করুন'}</button>
          </div>
        `;
        document.body.append(overlay);

        const close = () => overlay.remove();
        $('#m-cat-cancel').addEventListener('click', close);
        $('#m-cat-save').addEventListener('click', async () => {
          const name_bn = $('#m-cat-bn').value.trim();
          const name_en = $('#m-cat-en').value.trim();
          const slug    = $('#m-cat-slug').value.trim().toLowerCase().replace(/\s+/g,'-');
          const ic      = $('#m-cat-icon').value.trim();
          const ord     = parseInt($('#m-cat-order').value, 10) || 1;
          const active  = $('#m-cat-active').checked;
          if (!name_bn || !name_en || !slug) {
            toast('ত্রুটি', 'বাংলা, ইংরেজি ও slug আবশ্যক', 'error');
            return;
          }
          const payload = { name_bn, name_en, slug, icon: ic || null, sort_order: ord, is_active: active };
          try {
            if (existing) {
              const { error } = await supabase.from('categories').update(payload).eq('id', existing.id);
              if (error) throw error;
              toast('সফল', 'বিভাগ আপডেট হয়েছে', 'success');
            } else {
              const { error } = await supabase.from('categories').insert(payload);
              if (error) throw error;
              toast('সফল', 'নতুন বিভাগ তৈরি হয়েছে', 'success');
            }
            close();
            await loadCategories();
            renderCategoriesView(mount);
          } catch (e) {
            toast('ত্রুটি', e.message || 'সংরক্ষণ ব্যর্থ', 'error', 6000);
          }
        });
      }

      // ============================================================
      // সাব-ক্যাটাগরি মোডাল
      // ============================================================

        }});

            await loadCategories();
            renderCategoriesView(mount);

      // ============================================================
      // অ্যাকশন হ্যান্ডলার
      // ============================================================
      async function handleCatAction(e) {
        const btn = e.currentTarget;
        const act = btn.dataset.act;
        const id  = btn.dataset.id;
        const name = btn.dataset.name;
        const order = parseInt(btn.dataset.order, 10);

        if (act === 'edit') {
          const { data, error } = await supabase.from('categories').select('*').eq('id', id).single();
          if (error) { toast('ত্রুটি', error.message, 'error'); return; }
          openCategoryModal(data);
        }
        else if (act === 'addsub') {
          const { data, error } = await supabase.from('categories').select('*').eq('id', id).single();
          if (error) { toast('ত্রুটি', error.message, 'error'); return; }
          openSubcategoryModal(data, null);
        }
        else if (act === 'toggle') {
          const { data } = await supabase.from('categories').select('is_active').eq('id', id).single();
          const newVal = !(data && data.is_active);
          const { error } = await supabase.from('categories').update({ is_active: newVal }).eq('id', id);
          if (error) { toast('ত্রুটি', error.message, 'error'); return; }
          toast('সফল', newVal ? 'সক্রিয় করা হয়েছে' : 'নিষ্ক্রিয় করা হয়েছে', 'success');
          await loadCategories();
          renderCategoriesView(mount);
        }
        else if (act === 'up' || act === 'down') {
          const newOrder = act === 'up' ? Math.max(0, order - 1) : order + 1;
          const { error } = await supabase.from('categories').update({ sort_order: newOrder }).eq('id', id);
          if (error) { toast('ত্রুটি', error.message, 'error'); return; }
          toast('সফল', 'ক্রম পরিবর্তন হয়েছে', 'success');
          await loadCategories();
          renderCategoriesView(mount);
        }
        else if (act === 'del') {
          // সতর্কতা: ব্যবহৃত ক্যাটাগরি মুছলে সংশ্লিষ্ট পোস্ট category_id NULL হবে
          const { count } = await supabase.from('posts').select('id', { count: 'exact', head: true }).eq('category_id', id);
          const warnMsg = count > 0
            ? `⚠️ এই বিভাগে ${count}টি পোস্ট আছে। মুছলে ঐ পোস্টগুলোর ক্যাটাগরি সংযোগ বাতিল হবে (পোস্ট মুছে যাবে না)।`
            : `এই বিভাগ মুছে ফেলতে চান?`;
          if (!confirm(`"${name}" — ${warnMsg}\n\nঅগ্রসর হতে চাইলে OK ক্লিক করুন।`)) return;
          const { error } = await supabase.from('categories').delete().eq('id', id);
          if (error) { toast('ত্রুটি', error.message, 'error'); return; }
          toast('সফল', 'বিভাগ মুছে ফেলা হয়েছে', 'success');
          await loadCategories();
          renderCategoriesView(mount);
        }
        else if (act === 'editsub') {
          const { data: sub, error } = await supabase.from('subcategories').select('*').eq('id', id).single();
          if (error) { toast('ত্রুটি', error.message, 'error'); return; }
          const { data: parent } = await supabase.from('categories').select('*').eq('id', sub.category_id).single();
          openSubcategoryModal(parent, sub);
        }
        else if (act === 'togglesub') {
          const { data } = await supabase.from('subcategories').select('is_active').eq('id', id).single();
          const newVal = !(data && data.is_active);
          const { error } = await supabase.from('subcategories').update({ is_active: newVal }).eq('id', id);
          if (error) { toast('ত্রুটি', error.message, 'error'); return; }
          toast('সফল', newVal ? 'সক্রিয়' : 'নিষ্ক্রিয়', 'success');
          await loadCategories();
          renderCategoriesView(mount);
        }
        else if (act === 'delsub') {
          // সতর্কতা: সংশ্লিষ্ট পোস্ট আছে কিনা যাচাই
          const { count } = await supabase.from('posts').select('id', { count: 'exact', head: true }).eq('subcategory_id', id);
          const warnMsg = count > 0
            ? `⚠️ এই উপবিভাগে ${count}টি পোস্ট আছে। মুছলে ঐ পোস্টগুলোর সাব-ক্যাটাগরি সংযোগ বাতিল হবে।`
            : `এই উপবিভাগ মুছে ফেলতে চান?`;
          if (!confirm(`"${name}" — ${warnMsg}\n\nঅগ্রসর হতে চাইলে OK ক্লিক করুন।`)) return;
          const { error } = await supabase.from('subcategories').delete().eq('id', id);
          if (error) { toast('ত্রুটি', error.message, 'error'); return; }
          toast('সফল', 'উপবিভাগ মুছে ফেলা হয়েছে', 'success');
          await loadCategories();
          renderCategoriesView(mount);
        }
      }
    }

    // ============================================================
    // After auth — load initial data and render
    // ============================================================
    async function afterAuth() {
      state.loading = true;
      renderApp();
      await Promise.all([loadCategories(), loadTags()]);
      state.loading = false;
      renderApp();
    }

    // ============================================================
    // INIT
    // ============================================================
    async function init() {
      applyTheme(state.theme);
      if (!initSupabase()) {
        renderConfigError();
        return;
      }
      // Show loading
      $('#app').innerHTML = '<div class="min-h-screen flex items-center justify-center"><div class="flex flex-col items-center gap-3"><div class="spinner"></div><p class="text-muted text-sm">লোড হচ্ছে...</p></div></div>';
      const ok = await checkSession();
      if (ok) {
        await loadCategories();
        await loadTags();
      }
      renderApp();

      // Listen to auth state changes
      supabase.auth.onAuthStateChange(async (event, session) => {
        if (event === 'SIGNED_OUT') {
          state.session = null; state.user = null;
          renderApp();
        } else if (event === 'SIGNED_IN' && session && !state.session) {
          state.session = session; state.user = session.user; state.userEmail = session.user.email;
          await afterAuth();
        }
      });
    }

    // Boot
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
