<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>লেখক ড্যাশবোর্ড | Mostafa Auvi</title><style>
:root{color-scheme:light;--ink:#20252b;--muted:#667085;--line:#d9dee7;--paper:#f7f8fb;--accent:#2856a6}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:980px;margin:36px auto;padding:0 18px}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:22px;margin:16px 0}h1,h2{line-height:1.25}label{display:block;font-weight:650;margin:12px 0 5px}input,textarea{width:100%;padding:12px;border:1px solid #bcc5d2;border-radius:9px;font:inherit}textarea{min-height:250px;resize:vertical}button,.btn{border:0;border-radius:9px;padding:10px 15px;background:var(--accent);color:#fff;font:inherit;cursor:pointer;margin:6px 5px 6px 0}button.secondary{background:#e9edf5;color:var(--ink)}.muted{color:var(--muted)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row input{width:auto}.item{border-top:1px solid var(--line);padding:12px 0}.status{padding:10px;border-radius:8px;background:#eef4ff;margin:12px 0;white-space:pre-wrap}.hidden{display:none}a{color:var(--accent)}</style></head>
<body><main class="wrap"><p><a href="./">← মূল ওয়েবসাইট</a></p><h1>লেখক ড্যাশবোর্ড</h1><p class="muted">এই প্যানেল চালাতে Supabase সেটআপ ও আপনার অ্যাকাউন্টকে অ্যাডমিন হিসেবে অনুমোদন করতে হবে। কোনো গোপন সার্ভার কী এখানে বসাবেন না।</p><div id="status" class="status">সেটআপ যাচাই করা হচ্ছে…</div>
<section id="login" class="panel hidden"><h2>নিরাপদ লগইন</h2><label for="email">আপনার ইমেইল</label><input id="email" type="email" autocomplete="email" placeholder="আপনার ইমেইল" required><button id="loginBtn">লগইন লিংক পাঠান</button><p class="muted">অনুমোদিত ইমেইলেই লগইন করুন।</p></section>
<section id="app" class="hidden"><div class="panel"><div class="row"><h2 style="flex:1">লেখা তৈরি / সম্পাদনা</h2><button class="secondary" id="logoutBtn">লগআউট</button></div><input id="postId" type="hidden"><label for="title">শিরোনাম</label><input id="title" maxlength="180" required><label for="slug">স্থায়ী লিংক নাম (ইংরেজি অক্ষর, সংখ্যা, হাইফেন)</label><input id="slug" pattern="[a-z0-9-]+" placeholder="amar-notun-lekha" required><label for="body">লেখা</label><textarea id="body" placeholder="এখানে আপনার লেখা লিখুন…"></textarea><div class="row"><label class="row"><input id="published" type="checkbox"> প্রকাশিত</label><button id="saveBtn">সংরক্ষণ</button><button id="newBtn" class="secondary">নতুন লেখা</button></div></div><div class="panel"><h2>আপনার লেখা</h2><div id="posts">লোড হচ্ছে…</div></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://voswrndbxrsaqfzwffhh.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_lsz4V4nlZIbrFKi43YhOEg_m_pf0E5I";
const statusEl=document.getElementById('status'), login=document.getElementById('login'), app=document.getElementById('app');
let sb,session=null;
const configured=SUPABASE_URL.startsWith('https://')&&!SUPABASE_URL.includes('YOUR_')&&!SUPABASE_ANON_KEY.includes('YOUR_');
function status(s){statusEl.textContent=s}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
if(!configured){status('এখনো সেটআপ করা হয়নি। SETUP-ADMIN-SUBSCRIPTION.md ফাইলের ধাপ অনুসরণ করে Supabase URL ও anon key বসাতে হবে; এরপর অনুমোদিত অ্যাডমিন অ্যাকাউন্ট তৈরি করুন।');login.classList.remove('hidden')}
else {sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);status('সেশন যাচাই হচ্ছে…');sb.auth.onAuthStateChange(()=>refresh());refresh()}
async function refresh(){if(!sb)return;const {data:{session:s}}=await sb.auth.getSession();session=s;login.classList.toggle('hidden',!!session);app.classList.add('hidden');if(!session){status('আপনার অ্যাকাউন্ট দিয়ে লগইন করুন.');return}const {data:admin,error}=await sb.from('admin_users').select('user_id').eq('user_id',session.user.id).maybeSingle();if(error||!admin){status('এই অ্যাকাউন্ট অ্যাডমিন হিসেবে অনুমোদিত নয়। সাইটের মালিককে সেটআপ নির্দেশিকা অনুযায়ী অনুমোদন দিতে হবে।');return}status('লগইন সফল। আপনার লেখা অনলাইনে সংরক্ষিত হবে।');app.classList.remove('hidden');loadPosts()}
document.getElementById('loginBtn').onclick=async()=>{if(!sb)return;const email=document.getElementById('email').value.trim();if(!email)return status('ইমেইল লিখুন।');const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.href}});status(error?error.message:'লগইন লিংক পাঠানো হয়েছে। ইমেইল খুলে লিংকে ক্লিক করুন।')};
document.getElementById('logoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload()};
document.getElementById('newBtn').onclick=()=>{['postId','title','slug','body'].forEach(id=>document.getElementById(id).value='');document.getElementById('published').checked=false};
document.getElementById('saveBtn').onclick=async()=>{if(!session)return;const id=document.getElementById('postId').value,title=document.getElementById('title').value.trim(),slug=document.getElementById('slug').value.trim(),body=document.getElementById('body').value,published=document.getElementById('published').checked;if(!title||!slug||!body)return status('শিরোনাম, লিংক নাম ও লেখা পূরণ করুন।');if(!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(slug))return status('লিংক নামে শুধু ছোট ইংরেজি অক্ষর, সংখ্যা ও হাইফেন ব্যবহার করুন।');const wasPublished=id&&document.getElementById('published').dataset.was==='true';const payload={title,slug,body,published,updated_at:new Date().toISOString(),...(published?{published_at:new Date().toISOString()}:{})};let result=id?await sb.from('posts').update(payload).eq('id',id).select().single():await sb.from('posts').insert(payload).select().single();if(result.error)return status('সংরক্ষণ হয়নি: '+result.error.message);document.getElementById('postId').value=result.data.id;document.getElementById('published').dataset.was=String(published);status('লেখা সংরক্ষিত হয়েছে।');if(published&&!wasPublished){const {error}=await sb.functions.invoke('publish-notification',{body:{post_id:result.data.id}});if(error)status('লেখা প্রকাশিত ও সংরক্ষিত হয়েছে, তবে ইমেইল নোটিফিকেশনে সমস্যা: '+error.message)}loadPosts()};
async function loadPosts(){const el=document.getElementById('posts');const {data,error}=await sb.from('posts').select('id,title,slug,published,updated_at').order('updated_at',{ascending:false});if(error){el.textContent=error.message;return}el.innerHTML=data.length?data.map(p=>'<div class="item"><strong>'+esc(p.title)+'</strong> · '+(p.published?'প্রকাশিত':'খসড়া')+'<br><span class="muted">'+esc(p.slug)+'</span><br><button data-edit="'+p.id+'">এডিট</button> <button class="secondary" data-delete="'+p.id+'">মুছে ফেলুন</button> '+(p.published?'<a href="./read.html?slug='+encodeURIComponent(p.slug)+'" target="_blank">লেখা দেখুন</a>':'')+'</div>').join(''):'এখনো কোনো লেখা নেই।';el.querySelectorAll('[data-edit]').forEach(b=>b.onclick=async()=>{const {data:p,error}=await sb.from('posts').select('*').eq('id',b.dataset.edit).single();if(error)return status(error.message);document.getElementById('postId').value=p.id;document.getElementById('title').value=p.title;document.getElementById('slug').value=p.slug;document.getElementById('body').value=p.body;document.getElementById('published').checked=p.published;document.getElementById('published').dataset.was=String(p.published);window.scrollTo({top:0,behavior:'smooth'})});el.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('এই লেখা স্থায়ীভাবে মুছে ফেলবেন?'))return;const {error}=await sb.from('posts').delete().eq('id',b.dataset.delete);if(error)return status('মুছে ফেলা যায়নি: '+error.message);status('লেখা মুছে ফেলা হয়েছে।');if(document.getElementById('postId').value===b.dataset.delete)document.getElementById('newBtn').click();loadPosts()})}
</script></body></html>
